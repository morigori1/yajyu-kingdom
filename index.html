<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c181c">
<meta name="format-detection" content="telephone=no">
<title>野獣キングダム — 王道を征く</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" href="assets/senpai_icon.png">
<link rel="apple-touch-icon" href="assets/senpai_icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
  :root {
    --pad-h: clamp(118px, 24vh, 168px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --hud-fs: clamp(12px, 3vw, 15px);
    --ui-fs: clamp(12px, 3.2vw, 15px);
    --btn-min-h: 46px;
    --pad-btn-h: 64px;
    --panel-max-h: min(78vh, 560px);
    --chip-gap: 6px;
    --yk-ui-shadow: 0 8px 28px rgba(0,0,0,.55);
    --yk-jp: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    /* 真夏・部室掲示板 */
    --yk-ink: #0c181c;
    --yk-parchment: #f3ead4;
    --yk-gold: #f0c040;
    --yk-gold-dim: #c9a040;
    --yk-gold-deep: #8a6a20;
    --yk-wood: #3a3228;
    --yk-wood-mid: #5a4030;
    --yk-wood-hi: #7a5840;
    --yk-rose: #ff6b9d;
    --yk-rose-dim: #d44a78;
    --yk-sky: #6ec4ff;
    --yk-grass: #6aaa48;
    --yk-soil: #6a5840;
    --yk-night: #0c1c22;
    --yk-panel: #1a1612;
    --yk-panel-hi: #2a241c;
    --yk-frame: #c9a040;
    --yk-vend: #3ad0c8;
    --yk-cork: #c4a070;
    --yk-ch0: #6aaa60;
    --yk-ch1: #5a9ab8;
    --yk-ch2: #c07090;
    --yk-ch3: #8a6ab0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    height: 100dvh;
    background: var(--yk-ink);
    color: var(--yk-parchment);
    font-family: var(--yk-jp);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    padding-top: var(--safe-t);
    padding-left: var(--safe-l);
    padding-right: var(--safe-r);
    touch-action: none;
  }
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    touch-action: none;
    overflow: hidden;
    z-index: 1;
    isolation: isolate;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--yk-night);
    width: 100%;
    height: auto;
    max-width: none;
    max-height: none;
    object-fit: contain;
    border: 3px solid #2a3230;
    box-shadow:
      0 0 0 2px #1a2220,
      0 0 0 5px #3a4038,
      0 8px 28px rgba(0,0,0,.5),
      inset 0 0 40px rgba(80,160,140,.04);
    cursor: crosshair;
    touch-action: none;
    display: block;
    border-radius: 2px;
  }
  /* 上端メッセージ帯：HUD／湿度／ストーリー／トーストを縦積みして重なり回避
     （#wrap の safe-t 余白を使うため、ここでは safe-t を二重に足さない） */
  #top-ui {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: min(960px, calc(100% - 12px));
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    max-height: min(42%, 220px);
    overflow: hidden;
  }
  #hud {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    text-shadow: 2px 2px 0 #000;
    font-size: var(--hud-fs);
    line-height: 1.45;
  }
  #hud .gold { color: #ffd700; text-shadow: 1px 1px 0 #3a2810, 0 0 6px rgba(255,215,0,.25); }
  #hud .night { color: #a8b8ff; }
  #hud .box {
    background: linear-gradient(180deg, rgba(36,32,24,.96) 0%, rgba(14,16,16,.94) 100%);
    border: 2px solid #8a7040;
    box-shadow: inset 0 0 0 1px #3a3020, inset 0 1px 0 rgba(240,200,80,.15), 0 4px 12px rgba(0,0,0,.35);
    padding: 6px 8px;
    max-width: 42%;
    flex: 1 1 auto;
    position: relative;
    image-rendering: pixelated;
    border-radius: 3px;
  }
  /* ドット枠コーナー */
  #hud .box::before, #hud .box::after {
    content: "";
    position: absolute;
    width: 4px; height: 4px;
    background: #ffd700;
    box-shadow: 0 0 0 1px #8b6914;
    pointer-events: none;
  }
  #hud .box::before { top: -2px; left: -2px; }
  #hud .box::after  { top: -2px; right: -2px; }
  #hud .box .dot-bl, #hud .box .dot-br {
    position: absolute; width: 4px; height: 4px; background: #ffd700;
    box-shadow: 0 0 0 1px #8b6914; pointer-events: none;
  }
  #hud-humid {
    position: absolute;
    left: 50%;
    top: 2px;
    transform: translateX(-50%);
    width: min(160px, 28vw);
    z-index: 2;
    pointer-events: none;
    font-size: 8px;
    color: #b8e8ff;
    text-align: center;
    text-shadow: 1px 1px 0 #000;
    background: rgba(8,18,22,.86);
    border: 2px solid #3ad0c8;
    box-shadow: inset 0 0 0 1px #2a3040;
    padding: 3px 6px 4px;
  }
  /* 狭い幅: 湿度をHUD下の独立行へ（左右ボックスと被らない） */
  @media (max-width: 640px) {
    #hud {
      flex-wrap: wrap;
      row-gap: 4px;
    }
    #hud .box { max-width: calc(50% - 4px); }
    #hud-humid {
      position: static;
      left: auto; top: auto;
      transform: none;
      order: 3;
      width: 100%;
      max-width: none;
      margin: 0 auto;
    }
  }
  #hud-humid .bar {
    margin-top: 2px; height: 6px; background: #1a2030; border: 1px solid #446;
    image-rendering: pixelated;
  }
  #hud-humid .bar > i {
    display: block; height: 100%; background: linear-gradient(90deg,#4af,#ff6b9d 70%,#f44);
    width: 40%;
  }
  #story, #toast {
    position: relative;
    left: auto;
    right: auto;
    top: auto;
    bottom: auto;
    transform: none;
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    text-align: center;
    pointer-events: none;
    text-shadow: 2px 2px 0 #000;
    display: none; /* 非表示時は高さを占有しない */
    overflow: hidden;
  }
  #story.show, #toast.show { display: block; }
  #story {
    z-index: 3;
    font-size: clamp(9px, 2.2vw, 11px);
    line-height: 1.35;
    color: #f3ead4;
    background: rgba(22,18,12,.92);
    border: 2px solid #8a7040;
    box-shadow: inset 0 0 0 1px #3a2a18, 0 0 8px rgba(240,180,60,.12);
    padding: 5px 10px;
    max-height: 2.9em;
    display: none;
  }
  #story.show {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
  }
  #toast {
    z-index: 4;
    background: rgba(28,18,10,.92);
    border: 2px solid #c9a040;
    box-shadow: inset 0 0 0 1px #5a3820;
    padding: 6px 10px;
    font-size: clamp(10px, 2.5vw, 12px);
    line-height: 1.35;
    max-height: 2.9em;
  }
  #toast.show {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    #top-ui { top: 2px; gap: 2px; max-height: min(48%, 140px); }
    #hud .box { padding: 4px 6px; }
    #story, #toast { font-size: clamp(8px, 2vh, 10px); padding: 4px 8px; max-height: 2.4em; }
    #hud-humid { width: min(120px, 22vw); font-size: 7px; }
  }

  #overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(80,140,180,.22) 0%, rgba(20,24,28,.62) 40%, rgba(12,10,8,.78) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 20; text-align: center;
    padding: max(24px, var(--safe-t)) 20px calc(24px + var(--safe-b));
    overflow: auto;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    transition: background 1.2s ease;
  }
  #overlay.cine-dawn {
    background: linear-gradient(180deg, rgba(255,160,90,.18) 0%, rgba(20,16,30,.55) 40%, rgba(10,8,14,.7) 100%);
  }
  #overlay h1 {
    font-size: clamp(16px, 5vw, 24px);
    color: #ffd700;
    line-height: 1.7;
    text-shadow: 0 0 12px rgba(255,215,0,.45), 2px 2px 0 #000;
    animation: crownPulse 2.8s ease-in-out infinite;
  }
  #overlay h1 .meme {
    display: inline-block;
    background: linear-gradient(90deg, #ffd700, #fff8c8, #ff6b9d, #ffd700);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: crownShine 3.2s linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,215,0,.55));
  }
  @keyframes crownShine {
    0% { background-position: 0% 50%; }
    100% { background-position: 220% 50%; }
  }
  @keyframes crownPulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.02); filter: brightness(1.12); }
  }
  #title-faces img {
    animation: faceGlow 3.5s ease-in-out infinite;
  }
  @keyframes faceGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); }
    50% { box-shadow: 0 0 8px 0 rgba(255,215,0,.2); }
  }
  #overlay p {
    font-size: clamp(11px, 3.2vw, 13px);
    line-height: 1.85;
    color: #ddd;
    max-width: 520px;
  }
  #overlay button {
    font-family: inherit;
    font-size: clamp(13px, 3.5vw, 15px);
    background: #5a2a1a; color: #ffd700;
    border: 3px solid #ffd700;
    padding: 16px 28px;
    cursor: pointer;
    min-height: 52px;
    touch-action: manipulation;
   box-shadow: inset 0 0 0 1px #8b6914, 0 0 0 2px #3a2810; }
  #overlay button:hover { background: #7a3a2a; filter: drop-shadow(0 0 6px rgba(255,215,0,.35)); }
  #overlay.hidden { display: none; }
  /* fixed + z100: #wrap/#stage stacking から独立（タイトル overlay を貫通） */
  #gfx-chip, #mute-chip, #zoom-chip {
    position: fixed; z-index: 100; pointer-events: auto;
    font-family: var(--yk-jp); font-size: 11px;
    background: rgba(16,18,18,.9); color: #f0c040;
    border: 2px solid #8b6914; padding: 6px 8px; border-radius: 8px;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  /* タッチパッド上に縦積み（下→上: 画質 / 音 / 拡大） */
  #gfx-chip { right: max(6px, var(--safe-r)); bottom: calc(var(--pad-h) + var(--safe-b) + var(--chip-gap)); }
  #mute-chip { right: max(6px, var(--safe-r)); bottom: calc(var(--pad-h) + var(--safe-b) + var(--chip-gap) + 34px); color: #8cf; border-color: #468; }
  #zoom-chip { right: max(6px, var(--safe-r)); bottom: calc(var(--pad-h) + var(--safe-b) + var(--chip-gap) + 68px); color: #9f8; border-color: #486; }
  #gfx-chip:active, #mute-chip:active, #zoom-chip:active { background: #7a3a2a; }
  #mute-chip.muted { color: #888; border-color: #555; }
  @media (max-width: 720px) {
    #gfx-chip, #mute-chip, #zoom-chip { font-size: 7px; padding: 5px 6px; }
    #gfx-chip { bottom: calc(var(--pad-h) + var(--safe-b) + 4px); }
    #mute-chip { bottom: calc(var(--pad-h) + var(--safe-b) + 34px); }
    #zoom-chip { bottom: calc(var(--pad-h) + var(--safe-b) + 64px); }
  }

  #choice-panel {
    position: absolute; inset: 0; z-index: 25;
    background: radial-gradient(ellipse at center, rgba(28,24,16,.9) 0%, rgba(8,12,14,.9) 70%);
    display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 8px;
    padding: max(10px, var(--safe-t)) max(10px, var(--safe-r)) max(10px, var(--safe-b)) max(10px, var(--safe-l));
    text-align: center;
    touch-action: manipulation; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  #choice-panel.show { display: flex; }
  #choice-panel .panel-card {
    width: min(440px, calc(100vw - 20px - var(--safe-l) - var(--safe-r)));
    margin-top: auto; margin-bottom: auto;
    background:
      linear-gradient(180deg, #2a241c 0%, #1c1814 60%, #12100c 100%);
    border: 3px solid #8a7048;
    box-shadow:
      0 0 0 2px #3a3020,
      0 10px 28px rgba(0,0,0,.55),
      inset 0 0 40px rgba(196,160,112,.08),
      inset 0 1px 0 rgba(243,234,212,.12);
    border-radius: 10px; padding: 14px 12px 16px; max-height: var(--panel-max-h);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scroll-padding-top: 48px;
    position: relative;
  }
  #choice-panel .panel-card::before,
  #choice-panel .panel-card::after {
    content: "";
    position: absolute;
    width: 10px; height: 10px;
    border: 2px solid var(--yk-gold);
    pointer-events: none;
  }
  #choice-panel .panel-card::before {
    top: 6px; left: 6px;
    border-right: none; border-bottom: none;
  }
  #choice-panel .panel-card::after {
    top: 6px; right: 6px;
    border-left: none; border-bottom: none;
  }
  #choice-panel .panel-card .orn-bl,
  #choice-panel .panel-card .orn-br {
    position: absolute; width: 10px; height: 10px;
    border: 2px solid var(--yk-gold); pointer-events: none;
  }
  #choice-panel .panel-card .orn-bl {
    bottom: 6px; left: 6px; border-right: none; border-top: none;
  }
  #choice-panel .panel-card .orn-br {
    bottom: 6px; right: 6px; border-left: none; border-top: none;
  }
  #choice-panel.ch-theme-0 .panel-card { box-shadow: 0 0 0 2px #5a3a10, 0 0 0 5px rgba(106,170,96,.35), 0 10px 28px rgba(0,0,0,.6), inset 0 0 28px rgba(106,170,96,.08); }
  #choice-panel.ch-theme-1 .panel-card { box-shadow: 0 0 0 2px #5a3a10, 0 0 0 5px rgba(90,154,184,.4), 0 10px 28px rgba(0,0,0,.6), inset 0 0 28px rgba(90,154,184,.1); }
  #choice-panel.ch-theme-2 .panel-card { box-shadow: 0 0 0 2px #5a3a10, 0 0 0 5px rgba(192,112,144,.4), 0 10px 28px rgba(0,0,0,.6), inset 0 0 28px rgba(192,112,144,.1); }
  #choice-panel.ch-theme-3 .panel-card { box-shadow: 0 0 0 2px #5a3a10, 0 0 0 5px rgba(138,106,176,.4), 0 10px 28px rgba(0,0,0,.6), inset 0 0 28px rgba(138,106,176,.12); }
  #choice-panel .tabs { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
  #choice-panel .tabs button { min-height:40px; padding:8px 10px; font-size:clamp(10px,2.6vw,12px); border-radius:8px; }
  #choice-panel .tabs button.civil { border-color:#6af; background:#1a3a4a; }
  #choice-panel .tabs button.mili { border-color:#f84; background:#4a1a10; }
  #choice-panel .tabs button.mission { border-color:#fc8; background:#3a2a10; }
  #choice-panel .tabs button.bond { border-color:#f6a; background:#3a1a2a; }
  #choice-panel .tabs button.active { outline:2px solid #ffd700; filter: brightness(1.15); }
  #choice-panel .meta {
    font-size:clamp(9px,2.4vw,11px); color:#cbb; max-width:520px; line-height:1.55;
    background:rgba(0,0,0,.35); border:1px solid #5a4030; border-radius:8px; padding:8px; margin-bottom:6px;
  }
  #choice-panel button.cost-ok { border-color:#ffd700; box-shadow:0 0 8px rgba(255,215,0,.2); }
  #choice-panel button.cost-ng { opacity:.5; }
  #choice-panel button.close-btn { background:#333; border-color:#888; margin-top:6px; }
  #choice-panel button:active { transform: scale(0.97); filter: brightness(1.2); }
  #choice-panel .panel-hint {
    font-size: 10px; color: #c9a227; text-align: center; margin: 4px 0 8px;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  #choice-panel .collect-box {
    text-align: left; max-height: min(42vh, 280px); overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: rgba(0,0,0,.4); border: 1px solid #5a4030; border-radius: 8px;
    padding: 8px 10px; margin: 6px 0 10px; font-size: clamp(9px,2.4vw,11px); line-height: 1.55;
  }
  #choice-panel .collect-box .row {
    padding: 4px 0; border-bottom: 1px solid rgba(90,64,48,.45); color: #dcc;
  }
  #choice-panel .collect-box .row:last-child { border-bottom: none; }
  #choice-panel .collect-box .row.on { color: #ffe7a0; }
  #choice-panel .collect-box .row.off { color: #776; }
  #choice-panel .collect-box .row.on .tag { color: #ffb040; }
  #choice-panel .collect-box .tag {
    display: inline-block; min-width: 3.2em; color: #c9a227; font-size: 9px;
  }
  #choice-panel .collect-sub {
    display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 4px 0 6px;
  }
  #choice-panel .collect-sub button {
    min-height: 34px; padding: 6px 8px; font-size: clamp(9px,2.3vw,11px); border-radius: 8px;
  }
  #choice-panel .collect-sub button.active { outline: 2px solid #ffd700; }

  @keyframes hintPulse {
    0%,100% { opacity: .55; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-1px); }
  }
  #choice-panel button.flash {
    animation: btnflash .28s ease-out;
    border-color: #fff !important;
    box-shadow: 0 0 16px rgba(255,215,0,.55);
  }
  #choice-panel .panel-card.pulse {
    animation: cardpulse .35s ease-out;
  }
  #choice-panel .tabs button.flash-tab {
    animation: btnflash .28s ease-out;
  }
  @keyframes btnflash {
    0% { filter: brightness(1.6); }
    100% { filter: brightness(1); }
  }
  @keyframes cardpulse {
    0% { box-shadow: 0 0 0 2px #5a3a10, 0 0 28px rgba(255,215,0,.45); }
    100% { box-shadow: 0 0 0 2px #5a3a10, 0 8px 24px rgba(0,0,0,.55), inset 0 0 20px rgba(255,215,0,.06); }
  }
  #choice-panel .fb-hint {
    font-size: clamp(8px, 2.2vw, 10px); color: #8a7; margin: 2px 0 6px;
  }
  #ach-toast {
    position:absolute; left:50%; bottom: calc(var(--pad-h) + var(--safe-b) + 8px);
    transform:translateX(-50%); z-index:22; pointer-events:none;
    background:rgba(20,10,0,.88); border:2px solid #ffd700; color:#ffd700;
    padding:8px 12px; font-size:clamp(9px,2.5vw,11px); display:none; max-width:90vw;
  }
  #ach-toast.show { display:block; animation: achpop .35s ease-out; }
  @keyframes achpop { from { transform:translateX(-50%) translateY(8px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }
  #choice-panel h2 {
    font-size: clamp(12px, 3.5vw, 16px); color: #ffd700; line-height: 1.6; max-width: 520px;
  }
  #choice-panel .mili-subtabs {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
    position: sticky; top: 0; z-index: 2; background: rgba(26,16,12,.94);
    padding: 4px 0 6px; margin-bottom: 4px;
  }
  #choice-panel .mili-subtabs .mili-sub {
    min-height: 36px; min-width: 64px; flex: 1 1 64px; max-width: 110px;
    padding: 6px 8px; font-size: clamp(10px, 2.6vw, 12px);
    border-radius: 8px; border: 2px solid #c96; background: #3a2010; color: #ffe8c8;
  }
  #choice-panel .mili-subtabs .mili-sub.active {
    border-color: #ffd700; background: #5a2a12; box-shadow: 0 0 10px rgba(255,215,0,.35);
  }
  @media (max-width: 720px) {
    #choice-panel .panel-card { max-height: min(84vh, 640px); width: min(480px, 96vw); }

  #hint {

  /* 仮想パッド */
  #touch-pad {

  }
  .pad-btn small {
    font-size: clamp(9px, 2.4vw, 11px);

  }
  .pad-btn:active, .pad-btn.active {

  }
  #btn-civil, #btn-mili {
    min-width: clamp(52px, 13vw, 84px);

  }
  #btn-mili.active, #btn-mili:active {

  @media (max-width: 400px) {

  #btn-pay {

  /* 横向き: パッドやや低く、ボタン横並び維持 */
  @media (orientation: landscape) and (max-height: 500px) {
    :root {
      --pad-h: clamp(78px, 30vh, 100px);
      --hud-fs: clamp(10px, 2.2vh, 12px);

  /* ===== モバイル／タッチUI磨き（セーフエリア・縦持ち・品質連動） ===== */
  @media (orientation: portrait) {
    :root {

  /* パネル開時: パッドを隠して重なり／誤操作を防ぐ（セーフエリアは維持） */

  /* チップは body 直下でもパネル開時はパッド非表示に合わせて下げる */

  #wrap.ui-panel #gfx-chip {

  }

  #wrap.ui-panel #choice-panel {
    /* パッド非表示分、カードを大きく */
    --panel-max-h: min(88dvh, calc(100dvh - var(--safe-t) - var(--safe-b) - 24px));

  #wrap.ui-panel #choice-panel .panel-card {

  /* 画質ティア連動（applyQuality が html[data-gfx] をセット） */
  html[data-gfx="low"] {
    --yk-ui-shadow: 0 4px 12px rgba(0,0,0,.4);

  html[data-gfx="low"] canvas {

  html[data-gfx="low"] #choice-panel .panel-card {

  html[data-gfx="low"] #hud .box {

  html[data-gfx="high"] canvas {

  /* 超縦長・ノッチ端末向け微调 */
  @media (orientation: portrait) and (max-width: 400px) {

</style>
</head>
<body>

        <div style="text-align:center"><img src="assets/kohai_pixel.png" alt="後輩" width="56" height="56" style="image-rendering:pixelated;border-radius:8px;background:#222"/><div style="font-size:9px;color:#ff6b9d;margin-top:4px">後輩</div></div>

<!-- チップは body 直下 + position:fixed（overlay stacking から完全分離） -->
<button type="button" id="mute-chip" aria-label="音声ミュート切替" aria-pressed="false">音:ON</button>

<script>
/* =========================================================
   野獣キングダム — Kingdom Two Crowns 風最小プロトタイプ
   自作 canvas / 絵文字 / ドット描画のみ（外部画像なし）
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const SPR = { senpai: null, kohai: null, icon: null, tono: null, face: null, ready: 0 };
function loadSpr(key, src) {
  const im = new Image();
  im.onload = () => { SPR[key] = im; SPR.ready++; };
  im.onerror = () => { SPR.ready++; };
  im.src = src;
}
loadSpr('senpai', 'assets/senpai_pixel.png');
loadSpr('kohai', 'assets/kohai_pixel.png');
loadSpr('icon', 'assets/senpai_icon.png');
loadSpr('tono', 'assets/tono_smile_pixel.png');
loadSpr('face', 'assets/doya.jpg');
const REDUCE_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const W = canvas.width, H = canvas.height;
const GROUND_Y = 380;
const PIX = 4; // ドット感

// ---------- ユーティリティ ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }
function irand(a, b) { return (a + Math.floor(Math.random() * (b - a + 1))); }
const UI_FONT = '"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif';
function uiFont(px, weight) {
  return (weight ? weight + ' ' : '700 ') + Math.max(11, px | 0) + 'px ' + UI_FONT;
}
function drawUiLabel(text, x, y, color, px) {
  ctx.save();
  ctx.font = uiFont(px || 13);
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(8,10,10,0.78)';
  ctx.strokeText(String(text), x, y);
  ctx.fillStyle = color || '#f3ead4';
  ctx.fillText(String(text), x, y);
  ctx.restore();
}
function streetHash(n) {
  const x = Math.sin((n + 1.7) * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

/** 電柱・電線・室外機・自販機・雑草・剥がれポスター。低画質は間引く。章で密度を変える */
function drawStreetLayer(phase, nightish) {
  const low = GFX.quality === 'low';
  const th = chapterTheme();
  const cam = state.cameraX || 0;
  const dense = th.decor === 'alley' || th.decor === 'neon';
  const step = th.decor === 'pond' ? 220 : th.decor === 'void' ? 200 : 148;
  const i0 = Math.floor((cam - 90) / step) - 1;
  const i1 = Math.ceil((cam + W + 90) / step) + 1;
  ctx.save();
  // 電線（電柱の前に薄く）
  ctx.strokeStyle = nightish ? 'rgba(18,22,22,0.5)' : 'rgba(36,36,36,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  let started = false;
  for (let i = i0; i <= i1; i++) {
    const wx0 = i * step + ((i * 37) % 28);
    const sx = wx(wx0);
    const y = GROUND_Y - 78 + Math.sin(i * 0.7) * 5;
    if (!started) { ctx.moveTo(sx, y); started = true; }
    else ctx.lineTo(sx, y);
  }
  ctx.stroke();
  if (th.decor !== 'pond') {
    ctx.beginPath();
    started = false;
    for (let i = i0; i <= i1; i++) {
      const wx0 = i * step + ((i * 37) % 28);
      const sx = wx(wx0);
      const y = GROUND_Y - 72 + Math.sin(i * 0.7 + 1) * 4;
      if (!started) { ctx.moveTo(sx + 6, y); started = true; }
      else ctx.lineTo(sx + 6, y);
    }
    ctx.stroke();
  }
  const maxProps = low ? 6 : (GFX.quality === 'high' ? 18 : 12);
  let drawn = 0;
  for (let i = i0; i <= i1 && drawn < maxProps; i++) {
    const wx0 = i * step + ((i * 37) % 28);
    const sx = wx(wx0);
    if (sx < -70 || sx > W + 70) continue;
    const h = streetHash(i * 17 + (th.decor === 'alley' ? 1 : th.decor === 'pond' ? 2 : th.decor === 'neon' ? 3 : 4));
    // 電柱
    drawPixelRect(sx - 3, GROUND_Y - 92, 6, 92, nightish ? '#2a2a28' : '#4a4a44');
    drawPixelRect(sx - 14, GROUND_Y - 86, 28, 4, nightish ? '#3a3a36' : '#5a5a54');
    drawPixelRect(sx - 1, GROUND_Y - 88, 2, 6, '#333');
    if (nightish && h > 0.35) {
      const glow = ctx.createRadialGradient(sx, GROUND_Y - 44, 1, sx, GROUND_Y - 44, 22);
      glow.addColorStop(0, 'rgba(255,220,140,0.35)');
      glow.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx - 22, GROUND_Y - 66, 44, 40);
      drawPixelRect(sx - 4, GROUND_Y - 46, 8, 4, '#ffe080');
    }
    drawn++;
    // 室外機（路地・外縁。池は控えめ）
    if (th.decor !== 'pond' && (i + 3) % 2 === 0) {
      const ax = sx + 16;
      drawPixelRect(ax, GROUND_Y - 20, 16, 12, nightish ? '#3a403c' : '#6a7068');
      drawPixelRect(ax + 2, GROUND_Y - 18, 12, 3, '#2a2e2c');
      drawPixelRect(ax + 3, GROUND_Y - 14, 10, 4, '#4a504c');
      if (nightish && h > 0.7) drawPixelRect(ax + 6, GROUND_Y - 16, 3, 2, '#3ad0c8');
    }
    // 自販機（路地／ネオンに疎ら。810 は1台だけ）
    if ((th.decor === 'alley' || th.decor === 'neon') && i % 5 === 2) {
      const vx = sx - 28;
      const vend = th.decor === 'neon' ? (nightish ? '#3a2040' : '#6a3058') : (nightish ? '#1a3a32' : '#2a6a58');
      drawPixelRect(vx, GROUND_Y - 36, 14, 36, vend);
      drawPixelRect(vx + 2, GROUND_Y - 32, 10, 10, nightish ? '#8cf' : '#cfe');
      drawPixelRect(vx + 3, GROUND_Y - 18, 3, 3, '#c44');
      drawPixelRect(vx + 8, GROUND_Y - 18, 3, 3, '#48c');
      if (nightish) {
        const vg = ctx.createRadialGradient(vx + 7, GROUND_Y - 20, 1, vx + 7, GROUND_Y - 20, 20);
        vg.addColorStop(0, 'rgba(58,208,200,0.28)');
        vg.addColorStop(1, 'rgba(58,208,200,0)');
        ctx.fillStyle = vg;
        ctx.fillRect(vx - 12, GROUND_Y - 40, 38, 40);
      }
      if (i % 10 === 2 && GFX.quality === 'high') {
        ctx.font = uiFont(11);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f0c040';
        ctx.fillText('810', vx + 7, GROUND_Y - 38);
      }
    }
    // 雑草
    if (th.decor !== 'neon') {
      for (let w = 0; w < 3; w++) {
        const wxw = sx - 18 + w * 11 + h * 6;
        const gh = 4 + ((i + w) % 4);
        drawPixelRect(wxw, GROUND_Y - gh, 2, gh, nightish ? '#2a4a28' : '#6a8a38');
      }
    }
    // 剥がれポスター（小さく、看板の壁紙にしない）
    if (!low && dense && i % 4 === 1) {
      const px = sx + 22;
      drawPixelRect(px, GROUND_Y - 34, 10, 12, nightish ? '#4a3020' : '#8a6040');
      drawPixelRect(px + 1, GROUND_Y - 32, 8, 3, h > 0.5 ? '#c44' : '#c4a070');
      if (th.decor === 'alley' && i % 8 === 1) {
        ctx.font = uiFont(11);
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(243,234,212,0.7)';
        ctx.fillText('あり', px + 5, GROUND_Y - 22);
      }
    }
    // 池：ヨシ。外縁：錆びパネル
    if (th.decor === 'pond' && i % 2 === 0) {
      drawPixelRect(sx + 10, GROUND_Y - 16, 2, 16, '#3a4a30');
      drawPixelRect(sx + 8, GROUND_Y - 22, 6, 8, nightish ? '#1a3020' : '#4a6a38');
    }
    if (th.decor === 'void' && i % 3 === 0) {
      drawPixelRect(sx + 14, GROUND_Y - 28, 12, 18, nightish ? '#2a2018' : '#5a4a38');
      drawPixelRect(sx + 16, GROUND_Y - 24, 8, 2, '#8a6040');
    }
  }
  ctx.restore();
}

let toastTimer = 0;
function shortenMsg(msg, max = 56) {
  const s = String(msg || '').replace(/\s+/g, ' ').trim();
  if (s.length <= max) return s;
  return s.slice(0, max - 1) + '…';
}
function toast(msg, sec = 2.0) {
  const el = document.getElementById('toast');
  el.textContent = shortenMsg(msg, 60);
  el.classList.add('show');
  toastTimer = Math.min(sec, 2.6);
}

function chapterStoryPack(ch) {
  const i = clamp(ch | 0, 0, 3);
  return CHAPTER_STORY[i] || CHAPTER_STORY[0];
}
function fillDayToken(s) {
  return String(s || '').replace(/\{d\}/g, String(state.day | 0));
}
function bondFlavorSuffix() {
  const b = state.bond || { kohai: 0, crew: 0, town: 0 };
  const bits = [];
  if ((b.kohai | 0) >= 60) bits.push('後輩も　おかのした');
  else if ((b.kohai | 0) >= 30) bits.push('後輩　あり…ます');
  if ((b.crew | 0) >= 60) bits.push('撮影班　やりますねぇ');
  else if ((b.crew | 0) >= 30) bits.push('班が　あ〜いいっすね〜');
  if ((b.town | 0) >= 60) bits.push('街が　王道を征く');
  else if ((b.town | 0) >= 30) bits.push('街　いいゾ〜');
  if (!bits.length) return '';
  return '　' + bits.slice(0, 2).join('　');
}
function scheduleFlavorSuffix() {
  const sch = state.schedule || [];
  const bits = [];
  if (sch.length) {
    const pending = sch.filter(s => !s.done);
    const head = (pending[0] || sch[0]);
    const n = sch.length;
    const done = sch.filter(s => s.done).length;
    if (done >= n) bits.push('本日ロケ完了　おかのした');
    else bits.push(`本日ロケ${n}本　${head.label || '撮影'}`);
  }
  if (state.weekly && !state.weekly.done) bits.push(`週次 ${state.weekly.label}`);
  if (state.chapterQuest && !state.chapterQuest.done) bits.push(`章任務 ${state.chapterQuest.label}`);
  if (!bits.length) return '';
  return '　' + bits.slice(0, 2).join('　');
}
function heatFlavorSuffix() {
  const id = state.heatEvent;
  if (!id) return state.midsummer ? '　真夏　湿度' + (state.humidity | 0) : '';
  const map = {
    heatwave: '　猛暑　動けぬわ',
    bbq_wind: '　焼肉の風',
    laundry_day: '　洗濯日和',
    gaze_sun: '　眼光の太陽',
    '810_festival': '　810祭',
    evening_shower: '　夕立予報',
    mugicha_day: '　麦茶の日',
    heatstroke_warn: '　熱中症注意',
    ice_stand: '　アイス屋台',
    steam_haze: '　湯気蜃気楼',
  };
  let s = map[id] || ('　真夏:' + id);
  if ((state.heatRisk | 0) >= 70) s += '　熱中症↑';
  return s;
}
function storyCompose(base, opts) {
  opts = opts || {};
  let s = fillDayToken(base);
  if (opts.bond !== false) s += bondFlavorSuffix();
  if (opts.schedule) s += scheduleFlavorSuffix();
  if (opts.heat) s += heatFlavorSuffix();
  return s;
}
function pickChapterLine(kind) {
  const pack = chapterStoryPack(state.chapter);
  const arr = pack[kind] || [];
  if (!arr.length) return '';
  return fillDayToken(pick(arr));
}
function dayOpenLine(day) {
  // 章昼ビート優先 → 旧Day固定 → fallback、関係値・ロケ・真夏を末尾に織る
  const chLine = pickChapterLine('day');
  const base = chLine || LORE.dayOpen[day] || pick(LORE.dayOpenFallback);
  return storyCompose(base, { bond: true, schedule: true, heat: true });
}
function nightOpenLine() {
  const chLine = pickChapterLine('night');
  const base = chLine || pick(LORE.night);
  return storyCompose(base, { bond: true, schedule: false, heat: true });
}
function chapterIntroLine() {
  const pack = chapterStoryPack(state.chapter);
  return storyCompose(pick(pack.intro), { bond: true, schedule: false, heat: true });
}
function chapterAssaultLine() {
  const pack = chapterStoryPack(state.chapter);
  const next = chapterName(Math.min((state.chapter | 0) + 1, 3));
  const base = pick(pack.assault) || pick(LORE.assaultOpen);
  return storyCompose(base + '　→' + next, { bond: true, schedule: false, heat: true });
}
function chapterClearLines() {
  const pack = chapterStoryPack(state.chapter);
  const lines = (pack.clear || []).slice();
  // 関係値・真夏・ロケ実績を末尾に1行足す
  const b = state.bond || {};
  const schDone = (state.schedule || []).filter(s => s.done).length;
  const epi = [
    `関係　後輩${b.kohai|0}／班${b.crew|0}／街${b.town|0}　撮影${state.filmShots|0}　汗${state.sweatDrops|0}`,
    state.heatEvent ? `真夏の残響　${state.heatEvent}　湿度${state.humidity|0}` : `湿度${state.humidity|0}　測定器は壊れたまま`,
    schDone ? `本日ロケ消化 ${schDone}本　おかのした` : 'ロケ日程は　明日も　あり…ますあります',
  ];
  return lines.concat(epi).slice(0, 7);
}

function bindHold(el, on, off) {
  if (!el) return;
  const start = ev => {
    ev.preventDefault();
    try { if (ev.pointerId != null) el.setPointerCapture(ev.pointerId); } catch (_) {}
    el.classList.add('active');
    try { on(); } catch (_) {}
  };
  const end = ev => {
    if (ev) ev.preventDefault();
    try { if (ev && ev.pointerId != null) el.releasePointerCapture(ev.pointerId); } catch (_) {}
    el.classList.remove('active');
    try { off(); } catch (_) {}
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', ev => ev.preventDefault());
}

(function bindMovePads() {

function applyUiLayout() {
  const root = document.documentElement;
  const wrap = document.getElementById('wrap');
  const portrait = (window.matchMedia && matchMedia('(orientation: portrait)').matches)
    || (window.innerHeight > window.innerWidth);
  const touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches)
    || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || '');
  if (wrap) {
    wrap.classList.toggle('ui-portrait', !!portrait);
    wrap.classList.toggle('ui-landscape', !portrait);
    wrap.classList.toggle('ui-touch', !!touch);
    const panelEl = document.getElementById('choice-panel');
    const panelOpen = !!(state && state.panelOpen) || !!(panelEl && panelEl.classList.contains('show'));
    wrap.classList.toggle('ui-panel', panelOpen);
  }
  // 品質＋縦持ちでパッド高・ボタン高を微調整（CSS clamp の上書き）
  const q = (typeof GFX !== 'undefined' && GFX.quality) || 'high';
  let padH, padBtn, btnMin, panelMax;
  if (portrait) {
    padH = touch ? 'clamp(136px, 22vh, 192px)' : 'clamp(124px, 20vh, 172px)';
    padBtn = touch ? 'clamp(70px, 11vh, 86px)' : 'clamp(64px, 10vh, 78px)';
    btnMin = touch ? '52px' : '48px';
    panelMax = 'min(72dvh, calc(100dvh - var(--pad-h) - var(--safe-t) - var(--safe-b) - 28px))';
  } else if (window.innerHeight && window.innerHeight <= 500) {
    padH = 'clamp(78px, 30vh, 100px)';
    padBtn = '52px';
    btnMin = '40px';
    panelMax = 'min(86dvh, 420px)';
  } else {
    padH = 'clamp(118px, 24vh, 168px)';
    padBtn = '64px';
    btnMin = touch ? '48px' : '46px';
    panelMax = 'min(78vh, 560px)';
  }
  // 低画質モバイルはパッドやや低くしキャンバス領域を確保
  if (q === 'low' && touch && portrait) {
    padH = 'clamp(124px, 20vh, 168px)';
  }
  root.style.setProperty('--pad-h', padH);
  root.style.setProperty('--pad-btn-h', padBtn);
  root.style.setProperty('--btn-min-h', btnMin);
  root.style.setProperty('--panel-max-h', panelMax);
  root.style.setProperty('--hud-fs', portrait ? 'clamp(11px, 3.4vw, 14px)' : 'clamp(11px, 2.8vw, 14px)');
  root.style.setProperty('--ui-fs', portrait ? 'clamp(11px, 3.4vw, 14px)' : 'clamp(11px, 3.1vw, 14px)');
}

function fitCanvas() {
  try { applyUiLayout(); } catch (_) {}
  const stage = document.getElementById('stage');
  if (!stage) return;
  let aw = stage.clientWidth;
  let ah = stage.clientHeight;
  // visualViewport: モバイルブラウザUI開閉でstage高がずれないよう補正
  try {
    const vv = window.visualViewport;
    if (vv && vv.height) {
      const pad = document.getElementById('touch-pad');
      const padH = pad && !document.getElementById('wrap')?.classList.contains('ui-panel')
        ? pad.offsetHeight : 0;
      const safeT = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
      // stage 実高が優先。極端に小さいときだけ vv で下限を補う
      if (ah < 120 && vv.height > ah) ah = Math.max(ah, Math.floor(vv.height - padH - 8));
    }
  } catch (_) {}
  const base = Math.min(aw / W, ah / H);
  const z = (typeof VIEW !== 'undefined' && VIEW.zoom) ? VIEW.zoom : 1.25;
  // 内部解像度はそのまま、CSS 表示だけ拡大（はみ出しは stage overflow:hidden）
  const scale = base * z;
  const dw = Math.max(1, Math.floor(W * scale));
  const dh = Math.max(1, Math.floor(H * scale));
  canvas.style.width = dw + 'px';
  canvas.style.height = dh + 'px';
  canvas.style.maxWidth = 'none';
  canvas.style.maxHeight = 'none';
}
window.addEventListener('resize', fitCanvas);

  if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => { try { fitCanvas(); } catch (_) {} });
    visualViewport.addEventListener('scroll', () => { try { fitCanvas(); } catch (_) {} });
  }
} catch (_) {}

function activeOutposts() {

function migrateIslandSave(d) {
  const out = Object.assign({}, (d && d.landmarks) || {});
  if (d && d.island === -1 && !out.kitazawa) out.kitazawa = true;
  if (d && d.island === 1 && !out.azuma) out.azuma = true;
  return out;
}
function ensureOutpostsForAssault() {
  if (!state.assault) return;
  const targetCh = Math.min(state.chapter + 1, 3);
  for (const def of OUTPOST_DEFS) {
    if (def.unlockChapter !== targetCh) continue;
    if ((state.outposts || []).some(o => o.id === def.id)) continue;
    // 片側ずつ：既に片側クリアならもう片側だけ
    state.outposts.push({
      id: def.id, name: def.name, short: def.short, side: def.side, x: def.x,
      hp: def.hp + state.chapter * 8, maxHp: def.hp + state.chapter * 8,
      cleared: false, unlockChapter: def.unlockChapter,
      kind: def.kind || 'fort', retal: def.retal || 'swarm',
    });
  }
  // エンドレス：外縁をさらに外側へ複製（種類ローテ）
  if (state.chapter >= 3) {
    const kinds = ['taka','peep','tono','ngimo','mur','koko'];
    for (const side of [-1, 1]) {
      const id = 'op_end_' + state.chapter + '_' + (side > 0 ? 'e' : 'w');
      if (state.outposts.some(o => o.id === id)) continue;
      const x = side * (1100 + (state.chapter - 2) * 160);
      const k = kinds[(state.chapter + (side > 0 ? 1 : 0)) % kinds.length];
      const retalMap = { taka:'swarm', peep:'gaze', tono:'smile', ngimo:'heavy', mur:'elite', koko:'rush' };
      state.outposts.push({
        id, name: '外縁' + k + '要塞', short: side > 0 ? '外縁東' : '外縁西',
        side, x, hp: 60 + state.chapter * 12, maxHp: 60 + state.chapter * 12,
        cleared: false, unlockChapter: state.chapter + 1,
        kind: k, retal: retalMap[k] || 'swarm',
      });
    }
  }
}

function ensureCollectState() {
  if (!state.codexQuotes) state.codexQuotes = {};
  if (!state.locPhotos) state.locPhotos = {};
  if (!state.towerSkins) state.towerSkins = { default: true };
  if (!state.towerSkins.default) state.towerSkins.default = true;
  if (!state.towerSkin) state.towerSkin = 'default';
  if (!state.secrets) state.secrets = {};
}

function unlockCodexId(id, quiet) {
  ensureCollectState();
  if (!id || state.codexQuotes[id]) return false;
  state.codexQuotes[id] = true;
  if (!quiet) {
    const q = CODEX_QUOTES.find(x => x.id === id);
    toast('語録図鑑　+' + (q ? shortenMsg(fillDayToken(q.raw), 28) : id), 2.0);
  }
  return true;
}

function unlockCodexFromStory(msg) {
  ensureCollectState();
  const m = String(msg || '');
  if (!m) return;
  let n = 0;
  for (const q of CODEX_QUOTES) {
    if (state.codexQuotes[q.id]) continue;
    const filled = fillDayToken(q.raw);
    // 先頭〜中盤の特徴部分で照合（compose接尾辞付きでも拾う）
    const keys = [filled.slice(0, 14), filled.slice(0, 10)];
    if (q.raw.indexOf('{d}') >= 0) keys.push(String(q.raw).split('{d}')[0].slice(0, 12));
    if (keys.some(k => k && k.length >= 6 && m.indexOf(k) >= 0)) {
      state.codexQuotes[q.id] = true;
      n++;
    }
  }
  if (n === 1) toast('語録図鑑　+1', 1.4);
  else if (n > 1) toast(`語録図鑑　+${n}`, 1.6);
}

function unlockLocPhoto(id, quiet) {
  ensureCollectState();
  if (!id || state.locPhotos[id]) return false;
  state.locPhotos[id] = true;
  if (!quiet) {
    const L = landmarkById(id);
    const sec = CHAPTER_SECRETS.find(s => s.photo === id);
    const exS = (typeof EXPLORE_SITES !== 'undefined') ? EXPLORE_SITES.find(x => x.photo === id) : null;
    const name = (L && L.short) || (sec && sec.name) || (exS && exS.name) || (id === 'ph_adv_echo' ? '残響の間' : id);
    toast('ロケ写真　' + name, 2.2);
    spawnMeme(player.x, GROUND_Y - 70, '📷');
  }
  return true;
}

function refreshTowerSkins(announce) {
  ensureCollectState();
  let gained = null;
  for (const s of TOWER_SKINS) {
    const ok = !!s.free || (typeof s.check === 'function' && !!s.check());
    if (ok && !state.towerSkins[s.id]) {
      state.towerSkins[s.id] = true;
      gained = s;
    } else if (ok) state.towerSkins[s.id] = true;
  }
  if (!state.towerSkins[state.towerSkin]) state.towerSkin = 'default';
  if (announce && gained) {
    toast('塔スキン解放　' + gained.name, 2.4);
    spawnMeme(player.x, GROUND_Y - 80, '塔');
  }
  return gained;
}

function setTowerSkin(id) {
  ensureCollectState();
  refreshTowerSkins(false);
  if (!state.towerSkins[id]) { toast('未解放の塔スキン', 1.8); return false; }
  state.towerSkin = id;
  const s = TOWER_SKINS.find(x => x.id === id);
  toast('塔スキン　' + ((s && s.name) || id), 2.0);
  saveGame(true);
  return true;
}

function unlockSecret(sec) {
  ensureCollectState();
  if (!sec || state.secrets[sec.id]) return false;
  state.secrets[sec.id] = true;
  if (sec.photo) unlockLocPhoto(sec.photo, true);
  story(storyCompose(sec.story, { bond: true, schedule: true, heat: true }), 2.8);
  toast('章の隠し　' + sec.name, 2.6);
  spawnMeme(sec.x, GROUND_Y - 70, '★');
  bumpBond('town', 3);
  refreshTowerSkins(true);
  return true;
}

function towerSkinAccent() {
  ensureCollectState();
  const s = TOWER_SKINS.find(x => x.id === state.towerSkin);
  return (s && s.accent) || '#c9a227';
}

function collectCounts() {
  ensureCollectState();
  return {
    codex: Object.keys(state.codexQuotes).length,
    photo: Object.keys(state.locPhotos).length,
    skin: Object.keys(state.towerSkins).filter(k => state.towerSkins[k]).length,
    secret: Object.keys(state.secrets).length,
    explore: (typeof exploreFoundCount === 'function') ? exploreFoundCount() : 0,
    ach: Object.keys(state.achievements || {}).length,
  };
}

function renderCollectBox(parent, sub) {
  ensureCollectState();
  refreshTowerSkins(false);
  const box = document.createElement('div');
  box.className = 'collect-box';
  const rows = [];
  if (sub === 'ach') {
    for (const a of ACH_DEFS) {
      const on = !!(state.achievements && state.achievements[a.id]);
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">${on ? '✓' : '・'}</span>${a.name}</div>`);
    }
  } else if (sub === 'codex') {
    const beatJa = { intro: '導入', day: '昼', night: '夜', assault: '攻勢', clear: 'クリア', bond: '関係', share: '共有', collapse: '崩壊', bondevt: '関係Evt', heat: '真夏', explore: '探索' };
    for (const q of CODEX_QUOTES) {
      const on = !!state.codexQuotes[q.id];
      const label = on ? shortenMsg(fillDayToken(q.raw), 42) : '？？？';
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">${chapterName(q.ch)}/${beatJa[q.beat]||q.beat}</span>${label}</div>`);
    }
  } else if (sub === 'photo') {
    for (const L of LANDMARKS) {
      const on = !!state.locPhotos[L.id];
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">${chapterName(L.chapter)}</span>${on ? '📷 ' + L.name : '未撮影　' + L.short}</div>`);
    }
    for (const s of CHAPTER_SECRETS) {
      const on = !!state.locPhotos[s.photo];
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">隠し</span>${on ? '📷 ' + s.name : '未発見　章' + (s.ch+1)}</div>`);
    }
    for (const S of EXPLORE_SITES) {
      if (!S.photo) continue;
      const on = !!state.locPhotos[S.photo];
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">探索</span>${on ? '📷 ' + S.name : '未踏　' + (S.side < 0 ? '西' : '東')}</div>`);
      const on2 = !!state.locPhotos['ph_exr_' + S.id];
      rows.push(`<div class="row ${on2 ? 'on' : 'off'}"><span class="tag">再訪</span>${on2 ? '📷 ' + S.short + '（別カット）' : '未撮影　再訪で解放'}</div>`);
    }
    for (const D of DUNGEONS) {
      const on = !!state.locPhotos[D.photo];
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">潜入</span>${on ? '📷 ' + D.name + '最奥' : '未踏破　' + D.name}</div>`);
    }
    {
      const on = !!state.locPhotos.ph_adv_echo;
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">残響</span>${on ? '📷 残響の間' : '未撮影　部室の裏穴'}</div>`);
    }
  } else if (sub === 'skin') {
    for (const s of TOWER_SKINS) {
      const on = !!state.towerSkins[s.id];
      const eq = state.towerSkin === s.id;
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">${eq ? '装備' : (on ? '解放' : '未')}</span>${s.name}　${s.desc}</div>`);
    }
  } else if (sub === 'explore') {
    ensureExploreState();
    const perkJa = { income: '夜明け+2🪙', humid: '湿度上昇-15%', scout: '草むら漁り強化', speed: '移動+6%', night: '夜撃破ボーナス' };
    for (const S of EXPLORE_SITES) {
      const on = !!state.explore[S.id];
      const seen = !!state.exploreSeen[S.id];
      const why = exploreLockReason(S);
      const dir = S.side < 0 ? '西' : '東';
      const info = on ? `${EXPLORE_KIND_JA[S.kind] || ''} ${S.name}　${S.blurb}${S.perk ? '　［' + perkJa[S.perk] + '］' : ''}`
        : (seen ? `${S.name}　${why || (S.cost ? S.cost + '🪙で探索' : '無料')}` : `未踏の${dir}　約${Math.round(Math.abs(S.x) / 10)}m${state.exploreClue[S.id] ? '　手がかり有' : ''}${why ? '　' + why : ''}`);
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">${on ? '✓' : dir}</span>${info}</div>`);
    }
    const e2 = ensureEx2();
    for (const D of DUNGEONS) {
      const S = EXPLORE_SITES.find(x => x.id === D.site);
      const ok = !!e2.dgClear[D.site];
      rows.push(`<div class="row ${ok ? 'on' : 'off'}"><span class="tag">潜入</span>${D.name}　${ok ? '踏破済（秘宝：' + D.rooms[2].obj.label + '）' : (state.explore[D.site] ? '入口発見済　昼に【潜入】' : (S ? S.short + 'を探索すると入口' : ''))}</div>`);
    }
    rows.push(`<div class="row off"><span class="tag">記録</span>再訪${e2.revN}回　遭遇${e2.encN}回　潜入${e2.dgRuns}回${e2.plan && e2.plan.day === (state.day|0) ? '　今日の予定：' + ((EXPLORE_SITES.find(x => x.id === e2.plan.id) || {}).short || '') + (e2.plan.done ? '✓' : '') : ''}</div>`);
    rows.push(`<div class="row off"><span class="tag">足跡</span>西${Math.round(-(state.reachL|0) / 10)}m／東${Math.round((state.reachR|0) / 10)}m　落とし物${state._cachesOpened|0}</div>`);
  } else if (sub === 'journal') {
    try { renderAdvJournal(rows); } catch (_) { rows.push('<div class="row off">日誌なし</div>'); }
  } else if (sub === 'secret') {
    for (const s of CHAPTER_SECRETS) {
      const on = !!state.secrets[s.id];
      const known = (state.chapter|0) >= s.ch;
      rows.push(`<div class="row ${on ? 'on' : 'off'}"><span class="tag">${chapterName(s.ch)}</span>${on ? '★ ' + s.name + '　' + s.blurb : (known ? '未発見（現地で支払）' : '章未到達')}</div>`);
    }
  }
  box.innerHTML = rows.join('') || '<div class="row off">まだなし</div>';
  parent.appendChild(box);
}

function drawAdvLayer(nightish) {
  const a = ensureAdvState();
  if (!state.running) return;
  const g = GROUND_Y;
  const crack = (wx0, open, col) => {
    const sx = wx(wx0);
    if (sx < -40 || sx > W + 40) return;
    ctx.save();
    ctx.globalAlpha = nightish ? 0.35 : (0.55 + Math.sin(state.animT * 3 + wx0 * 0.02) * 0.25);
    ctx.strokeStyle = col;
    ctx.lineWidth = open ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(sx - 10, g - 2);
    ctx.lineTo(sx - 2, g - 8);
    ctx.lineTo(sx + 6, g - 3);
    ctx.lineTo(sx + 12, g - 10);
    ctx.stroke();
    if (open) {

        ctx.setLineDash([]);

      }

  }
  if (a.stage >= 2) {

      ctx.fillStyle = '#ffd27a';

function advDungeonNearest() {
  const dg = state.dungeon;
  if (!dg || !dg.adv) return null;
  const last = dg.room === 2;
  const unlocked = dg.room !== 1 || !!(ensureAdvState().journal.room2);
  const cands = [
    { k: 'left', x: 50, label: dg.room === 0 ? '【出口】地上へ戻る' : '【扉】前の部屋へ' },
    { k: 'right', x: DG_RW - 50, label: last ? '【出口】地上へ' : (unlocked ? '【扉】奥へ進む' : '【扉】冷たい火を先に') },
  ];
  if (dg.room === 0 && !dg.taken[0]) cands.push({ k: 'obj', x: DG_RW / 2 + 40, label: '【調べる】暖かい格子' });
  if (dg.room === 1 && !dg.taken.fire) cands.push({ k: 'fire', x: DG_RW / 2 - 20, label: '【調べる】冷たい火' });
  if (dg.room === 1 && !dg.taken.tea) cands.push({ k: 'tea', x: DG_RW / 2 + 100, label: '【飲む】ぬるいアイスティー（任意）' });
  if (dg.room === 2 && !ensureAdvState().relic) cands.push({ k: 'relic', x: DG_RW / 2, label: '【秘宝】残響鈴' });
  let best = null, bd = 1e9;
  for (const c of cands) { const d = Math.abs(c.x - dg.px); if (d < 46 && d < bd) { bd = d; best = c; } }
  return best;
}

function updateAdvDungeon(dt) {
  const dg = state.dungeon;
  if (!dg || !dg.adv) { state.dungeon = null; return; }
  dg.t += dt;
  state.dayTimer += dt;
  try { tickPresentation(dt); } catch (_) {}
  if (dg.fx) { dg.fx.t -= dt; if (dg.fx.t <= 0) dg.fx = null; }
  if ((state.dayLength || 52) - state.dayTimer < 3) { exitDungeon('日が暮れる！　急いで地上へ'); return; }
  dg.hitCd = Math.max(0, dg.hitCd - dt);
  if (dg.room === 0) {
    const hx = DG_RW / 2 - 30 + Math.sin(dg.t * 1.1) * 160;
    dg.hx = hx;
    if (dg.hitCd <= 0 && Math.abs(hx - dg.px) < 24) {
      dg.hitCd = 1.15;
      state.humidity = clamp((state.humidity || 0) + 4, 0, 100);
      dg.px = clamp(dg.px + (dg.px < hx ? -60 : 60), 30, DG_RW - 30);
      dg.fx = { t: 0.7, txt: 'つめたい…　湿度+4' };
      try { shake(2, 0.12); } catch (_) {}
    }
  } else dg.hx = null;
  try {
    const right = document.getElementById('hud-right');
    const remain = Math.max(0, (state.dayLength || 52) - state.dayTimer) | 0;
    const R = ADV_DG.rooms[dg.room];
    if (right) right.innerHTML = `<span style="color:#ffb040">裏穴</span> ${dg.room + 1}/3「${R.name}」<br>湿度${state.humidity | 0}　日暮れまで${remain}s　左で戻れる`;
  } catch (_) {}
}

    } else {
      ctx.fillStyle = '#888'; ctx.font = uiFont(12); ctx.textAlign = 'center';
      ctx.fillText('（空）　残り香', cx, g - 30);
    }
    if (dg.fx && dg.fx.reveal) {
      ctx.globalAlpha = Math.min(0.55, dg.fx.t);
      const rg = ctx.createRadialGradient(cx, g - 40, 10, cx, g - 40, 220);
      rg.addColorStop(0, 'rgba(255,208,80,0.7)');
      rg.addColorStop(1, 'rgba(255,107,157,0)');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
  try { drawSoftShadow(X(dg.px), g, 14, 0.3); drawYajyu(X(dg.px), g, player.facing); } catch (_) {}
  ctx.font = uiFont(14); ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText(`部室の裏穴　${dg.room + 1}/3　${R.name}`, W / 2, 28);
  const n = advDungeonNearest();
  ctx.font = n ? uiFont(13) : uiFont(12);
  ctx.fillStyle = n ? '#ffe066' : '#aaa';
  ctx.fillText(n ? (n.label + '　［Space／💰］') : '◀▶移動　左の扉で戻れる　日暮れ3秒前は地上', W / 2, g + 40);
  if (dg.fx) {
    ctx.globalAlpha = Math.min(1, dg.fx.t * 2);
    ctx.font = uiFont(14); ctx.fillStyle = '#ffd700';
    ctx.fillText(dg.fx.txt, X(dg.px), g - 80 - (0.8 - Math.min(0.8, dg.fx.t)) * 30);
    ctx.globalAlpha = 1;
  }
  const vg = ctx.createRadialGradient(W / 2, g - 60, dg.room === 2 ? 90 : 130, W / 2, g - 60, 500);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, dg.room === 2 ? 'rgba(0,0,0,0.72)' : 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function renderAdvJournal(rows) {
  const a = ensureAdvState();
  const lead = advLatestLead();
  if (!lead) {
    rows.push('<div class="row off"><span class="tag">未</span>たき火の影を待ってる　部室のそば…？</div>');
    return;
  }
  rows.push(`<div class="row on"><span class="tag">今</span>${lead.tag}　${lead.text}</div>`);
  for (const J of ADV_JOURNAL) {
    if (J.id === lead.id) continue;
    if (J.id === 'risk' && a.choice !== 'risk') continue;
    if (a.journal[J.id]) rows.push(`<div class="row on"><span class="tag">${J.tag}</span>${J.text}</div>`);
    else rows.push(`<div class="row off"><span class="tag">…</span>まだ先の手がかり</div>`);
  }
  rows.push(`<div class="row ${a.relic ? 'on' : 'off'}"><span class="tag">鈴</span>${a.relic ? '残響鈴　未踏がたき火色　日暮れは部室へ急げる' + (a.riskBonus ? '　（溝の勘）' : '') : '未入手　探索が変わる秘宝'}</div>`);
}

function ensureBondState() {
  if (!state.bond) state.bond = { kohai: 0, crew: 0, town: 0 };
  if (!state.bondFlags) state.bondFlags = {};
  if (!state.bondGiftDay) state.bondGiftDay = {};
  if (!state.bondTalkDay) state.bondTalkDay = {};
  if (state._bondGifts == null) state._bondGifts = 0;
  if (state._bondJoints == null) state._bondJoints = 0;
}

function bondNpcOf(key) {
  return BOND_NPCS.find(n => n.key === key) || null;
}

function pickBondBranch(npc) {
  const v = (state.bond && state.bond[npc.key]) | 0;
  let best = npc.branches[0];
  for (const b of npc.branches) {
    if (v >= (b.min | 0)) best = b;
  }
  return best;
}

function checkBondThresholds(quiet) {
  ensureBondState();
  let fired = 0;
  for (const ev of BOND_THRESH_EVENTS) {
    if (state.bondFlags[ev.id]) continue;
    if ((ev.chapterMin | 0) > (state.chapter | 0)) continue;
    const v = (state.bond && state.bond[ev.key]) | 0;
    if (v < (ev.min | 0)) continue;
    state.bondFlags[ev.id] = true;
    fired++;
    if (ev.codexIds) {
      for (const id of ev.codexIds) unlockCodexId(id, true);
    }
    if (ev.skinHint) {
      ensureCollectState();
      state.towerSkins[ev.skinHint] = true;
    }
    if (ev.coins) state.coins += ev.coins | 0;
    if (!quiet) {
      toast('関係Evt　' + ev.title, 2.8);
      story(storyCompose(ev.story, { bond: true, schedule: true, heat: true }), 3.0);
      spawnMeme(player.x, GROUND_Y - 80, 'Evt');
    }
  }
  if (fired) {
    try { refreshTowerSkins(true); } catch (_) {}
    try { checkAchievements(); } catch (_) {}
  }
  return fired;
}

function bumpBond(key, n) {
  ensureBondState();
  if (!state.bond) state.bond = { kohai: 0, crew: 0, town: 0 };
  state.bond[key] = clamp((state.bond[key] | 0) + n, 0, 100);
  checkBondThresholds(false);
}

function bondMul(key) {
  return 1 + Math.min(0.25, ((state.bond && state.bond[key]) | 0) / 400);
}

function doBondTalk(key) {
  ensureBondState();
  const npc = bondNpcOf(key);
  if (!npc) return;
  if ((state.bondTalkDay[key] | 0) === (state.day | 0)) {
    toast('今日はもう話した　ま、多少はね？', 2.0);
    return;
  }
  state.bondTalkDay[key] = state.day | 0;
  const br = pickBondBranch(npc);
  bumpBond(key, npc.talkGain | 0);
  if (npc.humidity) state.humidity = clamp(state.humidity + (npc.humidity | 0), 0, 100);
  if (key === 'crew') state.filmShots = (state.filmShots | 0) + 1;
  if (br.codexIds) for (const id of br.codexIds) unlockCodexId(id, true);
  if (br.flag) state.bondFlags[br.flag] = true;
  const line = pick(br.lines || ['…']);
  toast(npc.name + '　関係' + ((state.bond[key] | 0)), 2.0);
  story(storyCompose(line, { bond: true, schedule: true, heat: true }), 2.6);
  updateHumidityHud();
  refreshTowerSkins(true);
  try { checkAchievements(); } catch (_) {}
}

function doBondGift(key, giftId) {
  ensureBondState();
  const npc = bondNpcOf(key);
  if (!npc) return;
  const g = (npc.gifts || []).find(x => x.id === giftId);
  if (!g) return;
  const gk = key + '_' + giftId;
  if ((state.bondGiftDay[gk] | 0) === (state.day | 0)) {
    toast('今日はもう贈った　おかのした', 2.0);
    return;
  }
  const need = g.need | 0;
  if (((state.bond[key] | 0) < need)) {
    toast('関係が足りない（要' + need + '）', 2.0);
    return;
  }
  const cost = g.cost | 0;
  if ((state.coins | 0) < cost) {
    toast('コインが足りない', 1.8);
    return;
  }
  state.coins -= cost;
  state.bondGiftDay[gk] = state.day | 0;
  state._bondGifts = (state._bondGifts | 0) + 1;
  bumpBond(key, g.gain | 0);
  if (g.id === 'mugicha' || g.id === 'tea') {
    ensureHeatState();
    state.humidity = clamp(state.humidity - 10, 0, 100);
    state.heatRisk = clamp((state.heatRisk | 0) - 8, 0, 100);
    updateHumidityHud();
  }
  if (g.codexIds) for (const id of g.codexIds) unlockCodexId(id, true);
  toast('ギフト　' + g.label, 2.2);
  story(storyCompose(g.line, { bond: true, schedule: true, heat: true }), 2.6);
  refreshTowerSkins(true);
  try { checkAchievements(); } catch (_) {}
}

function doBondJoint(key, jointId) {
  ensureBondState();
  const npc = bondNpcOf(key);
  if (!npc) return;
  const j = (npc.joints || []).find(x => x.id === jointId);
  if (!j) return;
  if (state.bondFlags['joint_' + j.id]) {
    toast('この共同ロケは済　おかのした', 2.0);
    return;
  }
  if (((state.bond[key] | 0) < (j.needBond | 0))) {
    toast('関係が足りない（要' + (j.needBond | 0) + '）', 2.0);
    return;
  }
  const L = landmarkById(j.lmId);
  if (!L || !state.landmarks[j.lmId]) {
    toast('聖地未解放　' + ((L && L.short) || j.lmId), 2.2);
    return;
  }
  // 進行型：初回開始→need回の進捗で完了
  if (!state.bondJoint || state.bondJoint.id !== j.id) {
    state.bondJoint = { id: j.id, key: key, lmId: j.lmId, progress: 0, need: j.need | 2 };
    toast('共同ロケ開始　' + j.label, 2.2);
    story(storyCompose('【共同】' + j.label + '　開始　いいよ！こいよ！', { bond: true, schedule: true, heat: true }), 2.4);
    return;
  }
  state.bondJoint.progress = (state.bondJoint.progress | 0) + 1;
  if ((state.bondJoint.progress | 0) < (state.bondJoint.need | 2)) {
    toast('共同ロケ進捗　' + state.bondJoint.progress + '/' + state.bondJoint.need, 2.0);
    story(storyCompose('【共同】撮影中…　' + j.label + '　' + state.bondJoint.progress + '/' + state.bondJoint.need, { bond: true, schedule: true, heat: true }), 2.2);
    return;
  }
  // 完了
  state.bondFlags['joint_' + j.id] = true;
  state.bondJoint = null;
  state._bondJoints = (state._bondJoints | 0) + 1;
  if (j.reward) state.coins += j.reward | 0;
  bumpBond(key, j.bondGain | 0);
  if (j.codexIds) for (const id of j.codexIds) unlockCodexId(id, true);
  if (j.photo) unlockLocPhoto(j.photo, false);
  state.filmShots = (state.filmShots | 0) + 1;
  toast('共同ロケ完了　' + j.label, 2.6);
  story(storyCompose(j.line + '　やりますねぇ', { bond: true, schedule: true, heat: true }), 2.8);
  refreshTowerSkins(true);
  try { checkAchievements(); } catch (_) {}
}


function unlockAch(id) {
  if (!state.achievements) state.achievements = {};
  if (state.achievements[id]) return;
  const def = ACH_DEFS.find(a => a.id === id);
  if (!def) return;
  state.achievements[id] = true;
  const el = document.getElementById('ach-toast');
  if (el) {
    el.textContent = 'やりこみ解放　' + def.name;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }
  toast('やりこみ　' + def.name, 2.6);
  spawnMeme(player.x, GROUND_Y - 80, '★');
  state.coins += 1;
}

function checkAchievements() {
  if (!state.achievements) state.achievements = {};
  try { ensureBondState(); ensureHeatState(); ensureCivilMiliExt(); } catch (_) {}
  try { refreshTowerSkins(true); } catch (_) {}
  for (const a of ACH_DEFS) {
    try { if (!state.achievements[a.id] && a.check()) unlockAch(a.id); } catch (_) {}
  }
}

function bestiaryKill(name) {
  if (!state.bestiary) state.bestiary = {};
  state.bestiary[name] = (state.bestiary[name]|0) + 1;
}

function weekKey() {
  return 'w' + Math.floor(Math.max(0, (state.day | 0) - 1) / 7);
}
function weekIndex() {
  return Math.floor(Math.max(0, (state.day | 0) - 1) / 7);
}

function missionKindsForDay() {
  const ch = state.chapter | 0;
  return MISSION_KINDS.filter(m => (m.chapterMin | 0) <= ch);
}

function grantMissionExtras(pack, quiet) {
  if (!pack) return;
  if (pack.bond) {
    for (const k of Object.keys(pack.bond)) bumpBond(k, pack.bond[k] | 0);
  }
  if (pack.codexIds) {
    for (const id of pack.codexIds) unlockCodexId(id, true);
  }
  if (pack.skin) {
    ensureCollectState();
    if (!state.towerSkins[pack.skin]) {
      state.towerSkins[pack.skin] = true;
      const s = TOWER_SKINS.find(x => x.id === pack.skin);
      if (!quiet) toast('塔スキン解放　' + ((s && s.name) || pack.skin), 2.6);
      spawnMeme(player.x, GROUND_Y - 85, '塔');
    }
  }
  try { refreshTowerSkins(false); } catch (_) {}
}

function rollDaySchedule() {
  const u = unlockedLandmarks();
  state.schedule = [];
  if (!u.length) return;
  const kinds = missionKindsForDay();
  const n = Math.min(4, 1 + Math.floor(Math.random() * 2) + (state.civilTier >= 2 ? 1 : 0) + ((state.bond && state.bond.crew) >= 40 ? 1 : 0));
  const pool = u.slice();
  for (let i = 0; i < n && pool.length; i++) {
    const ix = (Math.random() * pool.length) | 0;
    const L = pool.splice(ix, 1)[0];
    let mk = kinds[(state.day + i + (state.chapter | 0)) % kinds.length];
    // 章2+は時々崩壊／共有語録ロケを差し込み
    if ((state.chapter | 0) >= 2 && i === 0 && Math.random() < 0.45) {
      mk = kinds.find(k => k.id === 'collapse') || mk;
    } else if (i === n - 1 && Math.random() < 0.4) {
      mk = kinds.find(k => k.id === 'collab') || mk;
    }
    const fl = typeof mk.flavor === 'function' ? mk.flavor() : '';
    state.schedule.push({
      lmId: L.id, kind: mk.id, label: mk.label, done: false,
      flavor: fl, tier: 'day',
    });
  }
  if (state.schedule.length && state.panelOpen === 'mission') {
    const head = state.schedule[0];
    const L0 = landmarkById(head.lmId);
    toast(`本日ロケ ${state.schedule.length}本　${(L0 && L0.short) || '?'}…`, 2.6);
  }
}

function ensureWeeklyQuest() {
  if (!state.weeklyDone) state.weeklyDone = {};
  const wk = weekKey();
  if (state.weeklyDone[wk]) { state.weekly = null; return; }
  if (state.weekly && state.weekly.week === wk) return;
  const def = WEEKLY_DEFS[weekIndex() % WEEKLY_DEFS.length];
  state.weekly = {
    id: def.id, week: wk, kind: def.kind, label: def.label,
    progress: 0, need: def.need, reward: def.reward,
    bond: def.bond, codexIds: def.codexIds, skin: def.skin || null,
    flavor: def.flavor, done: false,
  };
  state._weekFilm = 0;
}

function ensureChapterQuest() {
  if (!state.chapterQuestDone) state.chapterQuestDone = {};
  const ch = state.chapter | 0;
  const def = CHAPTER_MISSIONS.find(q => q.ch === ch);
  if (!def) { state.chapterQuest = null; return; }
  if (state.chapterQuestDone[def.id]) {
    if (state.chapterQuest && state.chapterQuest.id === def.id) state.chapterQuest = null;
    return;
  }
  if (state.chapterQuest && state.chapterQuest.id === def.id) return;
  let lmId = def.lmPrefer;
  const Lpref = landmarkById(lmId);
  if (!Lpref || !state.landmarks[lmId]) {
    const u = unlockedLandmarks().filter(L => L.chapter === ch);
    lmId = (u[0] && u[0].id) || (unlockedLandmarks()[0] && unlockedLandmarks()[0].id) || lmId;
  }
  state.chapterQuest = {
    id: def.id, ch, kind: def.kind, label: def.label, lmId,
    progress: 0, need: def.need, reward: def.reward,
    bond: def.bond, codexIds: def.codexIds, skin: def.skin || null,
    story: def.story, done: false, tier: 'chapter',
  };
}

function startMissionFromSchedule(slot) {
  if (!slot || slot.done || state.mission) return false;
  const L = landmarkById(slot.lmId);
  if (!L) return false;
  const mk = MISSION_KINDS.find(m => m.id === slot.kind) || MISSION_KINDS[0];
  const fl = slot.flavor || (typeof mk.flavor === 'function' ? mk.flavor() : '');
  state.mission = {
    id: slot.kind + '_' + slot.lmId + '_' + state.day,
    lmId: slot.lmId, kind: slot.kind,
    progress: 0, need: mk.need | 0,
    reward: typeof mk.reward === 'function' ? mk.reward() : (mk.reward | 0),
    label: mk.label, day: state.day,
    bond: mk.bond || { crew: 2, town: 2 },
    codexIds: mk.codexIds || null,
    flavor: fl, tier: 'day',
  };
  toast(`ロケ日程　${L.short}　${mk.label}`, 2.8);
  story(storyCompose(`【撮影】${chapterName(state.chapter)}・${L.short}へ　${mk.label}　${fl}`, { bond: true, schedule: true, heat: true }), 2.8);
  if (slot.kind === 'bus' || slot.kind === 'patrol' || slot.kind === 'film' || slot.kind === 'collab') {
    startLocationBus(0, L.id, false, 'civil', true);
  }
  return true;
}

function startWeeklyAsMission() {
  ensureWeeklyQuest();
  const w = state.weekly;
  if (!w || w.done || state.mission) return false;
  const u = unlockedLandmarks();
  if (!u.length) { toast('聖地が必要', 2.0); return false; }
  const L = u[(state.day + weekIndex()) % u.length];
  state.mission = {
    id: 'weekly_' + w.id + '_' + w.week,
    lmId: L.id, kind: w.kind, progress: w.progress | 0, need: w.need,
    reward: w.reward | 0, label: w.label, day: state.day,
    bond: w.bond, codexIds: w.codexIds, skin: w.skin || null,
    flavor: w.flavor || '', tier: 'week', weeklyId: w.id, week: w.week,
  };
  toast('週次ロケ　' + w.label, 2.8);
  story(storyCompose(`【週次】${w.label}　${w.flavor || ''}　${L.short}`, { bond: true, schedule: true, heat: true }), 2.8);
  return true;
}

function startChapterQuestMission() {
  ensureChapterQuest();
  const q = state.chapterQuest;
  if (!q || q.done || state.mission) return false;
  if (!state.landmarks[q.lmId] && unlockedLandmarks().length) {
    q.lmId = unlockedLandmarks()[0].id;
  }
  const L = landmarkById(q.lmId);
  if (!L) { toast('聖地が必要', 2.0); return false; }
  state.mission = {
    id: 'chapter_' + q.id,
    lmId: q.lmId, kind: q.kind, progress: q.progress | 0, need: q.need,
    reward: q.reward | 0, label: q.label, day: state.day,
    bond: q.bond, codexIds: q.codexIds, skin: q.skin || null,
    flavor: q.story || '', tier: 'chapter', chapterQuestId: q.id,
  };
  toast('章任務　' + q.label, 2.8);
  story(storyCompose(`【章任務】${q.label}　${q.story || ''}`, { bond: true, schedule: true, heat: true }), 3.0);
  if (q.kind === 'film' || q.kind === 'patrol' || q.kind === 'collab') startLocationBus(0, L.id, false, 'civil', true);
  return true;
}

function tickMission(dt) {
  const m = state.mission;
  if (!m) return;
  const L = landmarkById(m.lmId);
  if (!L) { state.mission = null; return; }
  const stayKinds = { film: 1, sweat: 1, collab: 1, collapse: 1, summer: 1 };
  if (stayKinds[m.kind]) {
    if (Math.abs(player.x - L.x) < 70 && !state.isNight) {
      m._acc = (m._acc || 0) + dt;
      if (m._acc >= 0.95) {
        m._acc = 0;
        m.progress++;
        state.filmShots = (state.filmShots | 0) + 1;
        unlockLocPhoto(m.lmId, m.kind !== 'film' && m.kind !== 'collab');
        if (m.kind === 'sweat') {
          state.sweatDrops = (state.sweatDrops | 0) + 1;
          spawnMeme(L.x, GROUND_Y - 50, '汗');
        } else if (m.kind === 'summer') {
          ensureHeatState();
          state.sweatDrops = (state.sweatDrops | 0) + 1;
          state.heatRisk = clamp((state.heatRisk | 0) + 3, 0, 100);
          spawnMeme(L.x, GROUND_Y - 50, '真夏');
          if (state.heatEvent === 'mugicha_day') unlockCodexId('qh_mugicha', true);
          else if (state.heatEvent === 'evening_shower') unlockCodexId('qh_shower', true);
          else if (state.heatEvent === 'heatstroke_warn') unlockCodexId('qh_stroke', true);
          else if (state.heatEvent === 'steam_haze') unlockCodexId('qh_steam', true);
          else if (state.heatEvent === 'ice_stand') unlockCodexId('qh_ice', true);
          else unlockCodexId('qh_heatwave', true);
        } else if (m.kind === 'collapse') {
          spawnMeme(L.x, GROUND_Y - 50, '観測');
          screenFlash('rgba(180,200,255,0.14)', 0.08);
          bumpBond('town', 1);
        } else {
          spawnMeme(L.x, GROUND_Y - 50, m.kind === 'collab' ? '共有' : 'カット');
          screenFlash('rgba(255,255,220,0.18)', 0.08);
          bumpBond('crew', 1);
        }
        if (m.tier === 'week' && state.weekly) state.weekly.progress = m.progress;
        if (m.tier === 'chapter' && state.chapterQuest) state.chapterQuest.progress = m.progress;
        if (m.progress >= m.need) completeMission();
      }
    }
  } else if (m.kind === 'patrol') {
    if (Math.abs(player.x - L.x) < 55) {
      m.progress = m.need;
      if (m.tier === 'week' && state.weekly) state.weekly.progress = m.progress;
      if (m.tier === 'chapter' && state.chapterQuest) state.chapterQuest.progress = m.progress;
      completeMission();
    }
  } else if (m.kind === 'bus') {
    if (!state.bus && Math.abs(player.x - L.x) < 80) {
      m.progress = m.need;
      completeMission();
    }
  }
}

function completeMission() {
  const m = state.mission;
  if (!m) return;
  const reward = m.reward | 0;
  dropCoin(player.x, Math.max(1, reward));
  // 基本関係＋任務固有
  bumpBond('town', 2);
  bumpBond('crew', 2);
  grantMissionExtras(m, false);
  state._missionsDone = (state._missionsDone | 0) + 1;
  for (const s of (state.schedule || [])) {
    if (s.lmId === m.lmId && s.kind === m.kind && !s.done) s.done = true;
  }
  if (m.tier === 'week' && m.week) {
    if (!state.weeklyDone) state.weeklyDone = {};
    state.weeklyDone[m.week] = m.weeklyId || true;
    if (state.weekly && state.weekly.week === m.week) {
      state.weekly.done = true;
      state.weekly.progress = m.need;
    }
    state.weekly = null;
  }
  if (m.tier === 'chapter' && m.chapterQuestId) {
    if (!state.chapterQuestDone) state.chapterQuestDone = {};
    state.chapterQuestDone[m.chapterQuestId] = true;
    state.chapterQuest = null;
  }
  toast(`ミッション完了　＋${reward}　${m.label}`, 2.8);
  const Ldone = landmarkById(m.lmId);
  const fl = m.flavor ? '　' + m.flavor : '';
  story(storyCompose(`撮影OK　${(Ldone && Ldone.short) || '聖地'}　${m.label}${fl}　やりますねぇ`, { bond: true, schedule: true, heat: true }), 2.6);
  spawnMeme(player.x, GROUND_Y - 70, 'OK');
  state.mission = null;
  checkAchievements();
  saveGame(true);
}

function heatEventDef(id) {
  return HEAT_EVENT_DEFS.find(e => e.id === id) || null;
}

function ensureHeatState() {
  if (state.mugichaStock == null) state.mugichaStock = 0;
  if (state.heatRisk == null) state.heatRisk = 0;
  if (!state.heatFlags) state.heatFlags = {};
  if (state.heatStunT == null) state.heatStunT = 0;
  if (state._heatSeen == null) state._heatSeen = 0;
  if (state._mugichaDrunk == null) state._mugichaDrunk = 0;
}

function rollHeatEvent() {
  ensureHeatState();
  state.heatEvent = null;
  state.heatEventT = 0;
  if (state.day < 2) return;
  const roll = Math.random();
  const force = state.humidity >= 68 || (state.heatRisk | 0) >= 55;
  if (!(force || roll < 0.34 + Math.min(0.2, (state.day | 0) * 0.01))) return;
  state.midsummer = true;
  // 湿度・リスク帯で候補を寄せる
  let pool = HEAT_EVENT_DEFS.slice();
  if ((state.humidity | 0) >= 75) pool = pool.filter(e => e.humid >= 0 || e.id === 'evening_shower' || e.id === 'laundry_day');
  if ((state.heatRisk | 0) >= 60) pool = pool.filter(e => e.id === 'heatstroke_warn' || e.id === 'evening_shower' || e.id === 'mugicha_day' || e.id === 'laundry_day' || e.id === 'ice_stand');
  if (!pool.length) pool = HEAT_EVENT_DEFS.slice();
  const ev = pool[(state.day + state.weatherSeed + (state._heatSeen | 0)) % pool.length];
  state.heatEvent = ev.id;
  state.heatEventT = state.dayLength;
  state.humidity = clamp(state.humidity + (ev.humid || 0), 0, 100);
  state.heatRisk = clamp((state.heatRisk | 0) + (ev.risk || 0), 0, 100);
  state.heatFlags['hev_' + ev.id] = true;
  state._heatSeen = (state._heatSeen | 0) + 1;
  if (ev.codex) unlockCodexId(ev.codex, true);
  const hs = (LORE.heatStory && LORE.heatStory[ev.id]) ? pick(LORE.heatStory[ev.id]) : (ev.name + '　' + ev.desc);
  toast(`真夏イベント　${ev.name}　${ev.desc}`, 3.4);
  state._heatStoryPending = storyCompose(hs + '　' + chapterName(state.chapter), { bond: true, schedule: true, heat: false });
  if (ev.id === 'bbq_wind') state.coins += 1;
  if (ev.id === '810_festival') { state.bank += 1; state.mugichaStock = Math.min(3, (state.mugichaStock | 0) + 1); }
  if (ev.id === 'mugicha_day') state.mugichaStock = Math.min(3, (state.mugichaStock | 0) + 2);
  if (ev.id === 'steam_haze') state.filmShots = (state.filmShots | 0) + 1;
  if (ev.id === 'evening_shower') state.rainCool = Math.min(state.rainCool | 0, 6);
  if (ev.id === 'ice_stand') {
    state.heatRisk = clamp((state.heatRisk | 0) - 8, 0, 100);
    state.sweatDrops = (state.sweatDrops | 0) + 1;
  }
  try { checkAchievements(); } catch (_) {}
}

function heatExtraInterest() {
  return state.heatEvent === '810_festival' ? 1 : 0;
}

function heatHumidTickMul() {
  const id = state.heatEvent;
  if (id === 'heatwave' || id === 'heatstroke_warn') return 1.45;
  if (id === 'steam_haze' || id === 'gaze_sun') return 1.2;
  if (id === 'bbq_wind') return 1.12;
  if (id === 'laundry_day' || id === 'mugicha_day' || id === 'ice_stand') return 0.72;
  if (id === 'evening_shower') return 0.9;
  return 1;
}

function tickHeatRisk(dt, moving) {
  ensureHeatState();
  if (state.heatStunT > 0) state.heatStunT = Math.max(0, state.heatStunT - dt);
  const h = state.humidity | 0;
  let d = 0;
  if (h >= 85) d += moving ? 5.5 : 2.6;
  else if (h >= 70) d += moving ? 3.2 : 1.1;
  else if (h >= 55) d += moving ? 1.2 : 0.15;
  else if (h <= 35) d -= 4;
  else d -= 1.4;
  if (state.heatEvent === 'heatstroke_warn') d += 2.2;
  if (state.heatEvent === 'heatwave') d += 1.5;
  if (state.heatEvent === 'mugicha_day' || state.heatEvent === 'laundry_day' || state.heatEvent === 'ice_stand') d -= 1.8;
  if (state.rainT > 0) d -= 5;
  // 補給線：配置人数＋物資で熱中症上昇を抑制
  try {
    const sw = workers.filter(w => w.job === 'supply').length;
    if (sw > 0) d -= 0.7 + sw * 0.4;
    if ((state.supplyStock | 0) >= 2) d -= 0.6;
    if ((state.supplyStock | 0) >= 4) d -= 0.4;
  } catch (_) {}
  state.heatRisk = clamp((state.heatRisk | 0) + d * dt, 0, 100);
  if ((state.heatRisk | 0) >= 94 && !state.heatStunT) {
    triggerHeatstroke();
  }
  if ((state.heatRisk | 0) <= 15 && (state.heatFlags && state.heatFlags.heatstroke_hit) && !state.heatFlags.risk_cooled) {
    state.heatFlags.risk_cooled = true;
    try { checkAchievements(); } catch (_) {}
  }
}

function triggerHeatstroke() {
  ensureHeatState();
  if (state.heatFlags._strokeCdDay === (state.day | 0)) return;
  state.heatFlags._strokeCdDay = state.day | 0;
  state.heatFlags.heatstroke_hit = true;
  state.heatStunT = 1.85;
  state.heatRisk = clamp((state.heatRisk | 0) - 30, 18, 100);
  state.humidity = clamp(state.humidity + 3, 0, 100);
  unlockCodexId('qh_stroke', true);
  toast('熱中症…！　動けぬわ　アイスティー／麦茶！', 3.2);
  try { if (typeof audPlay === 'function') audPlay('heat'); } catch (_) {}
  story(storyCompose('熱中症注意報　クゥーン…　でも王道を征く　茶を飲め', { bond: true, schedule: true, heat: true }), 2.8);
  spawnMeme(player.x, GROUND_Y - 70, 'ぬわあああん');
  shake(4, 0.35);
  screenFlash('rgba(255,80,60,0.28)', 0.35);
  try { checkAchievements(); } catch (_) {}
}

function tryDrinkMugicha() {
  ensureHeatState();
  if (!state.running || state.over) return false;
  if ((state.mugichaStock | 0) <= 0) {
    toast('麦茶切れ…部室で淹れよ　麦茶は麦じゃない', 2.2);
    return false;
  }
  state.mugichaStock--;
  state._mugichaDrunk = (state._mugichaDrunk | 0) + 1;
  state.humidity = clamp(state.humidity - 24, 0, 100);
  state.heatRisk = clamp((state.heatRisk | 0) - 28, 0, 100);
  unlockCodexId('qh_mugicha', true);
  toast('麦茶は麦じゃない（迫真）　湿度↓　リスク↓', 2.6);
  try { if (typeof audPlay === 'function') audPlay('tea'); } catch (_) {}
  spawnMeme(player.x, GROUND_Y - 50, '麦茶');
  story(storyCompose('麦茶を飲む　冷えてるゾ　いいかな？（念押し）', { bond: true, schedule: false, heat: true }), 2.2);
  updateHumidityHud();
  try { checkAchievements(); } catch (_) {}
  return true;
}


function syncPanelChrome(open) {
  const wrap = document.getElementById('wrap');
  const panel = document.getElementById('choice-panel');
  const isOpen = open != null ? !!open : !!(panel && panel.classList.contains('show'));
  if (wrap) wrap.classList.toggle('ui-panel', isOpen);
  try { applyUiLayout(); fitCanvas(); } catch (_) {}
}

function closeBranchPanel() {
  const panel = document.getElementById('choice-panel');
  if (panel) panel.classList.remove('show');
  state.panelOpen = null;
  state.collectSub = null;
  if (!state.over && !state.won) state.running = true;
  try { syncPanelChrome(false); } catch (_) {}
}

function panelPay(cost, fn) {
  if (state.coins < cost) {
    toast(pick(LORE.payShort) + ` ${cost}枚必要`);
    return false;
  }
  state.coins -= cost;
  const ok = fn();
  if (ok === false) { state.coins += cost; return false; }
  saveGame(true);
  checkAchievements();
  return true;
}

function openBranchPanel(tab) {
  if (state.isNight) { toast('夜はパネル不可　防衛に集中', 2.0); return; }
  if (state.over || state.won) return;
  // 既に開いていればタブ切替OK。未開かつ停止中は昼の選択待ちなど — ボタンからは通常 running
  const prevTab = state.panelOpen;
  state.panelOpen = tab || state.panelOpen || 'civil';
  if (state.panelOpen !== 'bond') state.collectSub = null;
  if (state.panelOpen === 'mili' && !state.miliSub) state.miliSub = 'west';
  state.running = false;
  const panel = document.getElementById('choice-panel');
  syncPanelChapterTheme();
  const title = document.getElementById('choice-title');
  const btns = document.getElementById('choice-btns');

    const tabJa = ({ civil:'民帳', mili:'陣帳', mission:'ロケ日程', bond:'関係・やりこみ' })[state.panelOpen] || '';

      if (!state._ledgerHint) {

  title.textContent = '';

  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (!state.bond) state.bond = { kohai:0, crew:0, town:0 };

  const _cc = collectCounts();
  ensureHeatState();
  const _hev = heatEventDef(state.heatEvent);
  ensureCivilMiliExt();
  const _jr = {
    g: workers.filter(w => (w.job||'gather')==='gather').length,
    s: workers.filter(w => w.job==='supply').length,
    f: workers.filter(w => w.job==='film').length,
    c: workers.filter(w => w.job==='cheer').length,
  };
  const _b = state.bond || {};

  btns.appendChild(meta);
  title.textContent = ({
    civil: '【民帳・一覧】現地払いが基本　役割切替のみここで',

    title.textContent = ({
      ach: '【実績パネル】',

      photo: '【ロケ写真】',
      skin: '【塔スキン】',
      secret: '【章ごとの隠し】',
      explore: '【探索】',

  if (state.panelOpen === 'civil' && state.civilSub) {

    })[state.civilSub] || title.textContent;
  }
  if (state.panelOpen === 'mili' && state.miliSub) {
    title.textContent = ({
      west: '【陣帳・西一覧】砲台は壁まで行って払う',
      east: '【陣帳・東一覧】砲台は壁まで行って払う',

  }

  const addBtn = (label, cost, fn, enabled=true) => {
    const b = document.createElement('button');

        }

        fn();

      }

      openBranchPanel(state.panelOpen);

  if (state.panelOpen === 'civil') {

    if (!state.civilSub) state.civilSub = 'people';

    csub.className = 'mili-subtabs';
    for (const sd of [
      { id: 'people', label: '民の役割' },
      { id: 'supply', label: '補給線' },
      { id: 'spot', label: '施設・バス' },
    ]) {
      const sb = document.createElement('button');
      sb.type = 'button';
      sb.className = 'mili-sub' + (state.civilSub === sd.id ? ' active' : '');

      csub.appendChild(sb);
    }
    btns.appendChild(csub);

    const maxW = 2 + Math.min(2, state.civilTier|0);
    if (state.civilSub === 'people') {
      addBtn(`作業員を雇う (${workers.length}/${maxW})　TD集金後輩`, 3 + workers.length * 2, () => {
        if (workers.length >= maxW) return false;
        const unlocked = unlockedLandmarks();

        if (unlocked.length) {

          side = L.side; base = L.x + rand(-18,18); lmId = L.id;

        bumpBond('kohai', 3); bumpBond('crew', 1);

      // 役割切替（既存民）

          try { if (typeof audPlay === 'function') audPlay('coin'); } catch (_) {}

          checkAchievements();
          return true;
        }, !on);
      }
      if (stock >= 1) {
        addBtn(`物資消費で壁応急＋湿度↓ (${stock})`, 0, () => {
          if ((state.supplyStock | 0) < 1) return false;
          state.supplyStock--;
          for (const wall of [structures.leftWall, structures.rightWall]) {
            if (wall.level >= 1 && wall.hp < wall.maxHp) wall.hp = Math.min(wall.maxHp, wall.hp + 12);
          }

          state.heatRisk = clamp((state.heatRisk | 0) - 5, 0, 100);
          bumpBond('crew', 1);
          try { if (typeof audPlay === 'function') audPlay('day'); } catch (_) {}
          toast('補給投下　壁応急／熱中症↓', 2.2);
          return true;
        });

      if (state.civilTier < 3 && unlockedCount() >= 1) {
        addBtn(`内政整備 Lv${state.civilTier}→${state.civilTier+1}`, 4 + state.civilTier * 3, () => {
          state.civilTier++; toast(pick(LORE.civilUp)); return true;
        });
      }
    } else {
      // spot: 施設・バス・銀行

        addBtn(`内政整備 Lv${state.civilTier}→${state.civilTier+1}`, 4 + state.civilTier * 3, () => {
          state.civilTier++; toast(pick(LORE.civilUp)); return true;
        });
      }
      if (state.bankTier < 3 && state.bank >= 8 + state.bankTier * 8) {

      }
      for (const L of unlockedLandmarks()) {

          startLocationBus(0, L.id, false, 'civil', true); bumpBond('crew', 1); return true;

      if (!state.bus && unlockedCount()) {
        addBtn('自動巡回タイマー短縮（整備）', 2, () => {

    else if (state.miliSub === 'east') fillSide('right');
    else if (state.miliSub === 'trap') {
      const sn = state.snares || [];

        if (state.snares.length >= snareMax()) return false;
        let side = 'left';
        if (structures.leftWall.level >= 1 && structures.rightWall.level >= 1) {
          const lc = state.snares.filter(s => s.side==='left').length;
          const rc = state.snares.filter(s => s.side==='right').length;
          side = lc <= rc ? 'left' : 'right';
        } else if (structures.rightWall.level >= 1) side = 'right';
        else if (structures.leftWall.level < 1 && structures.rightWall.level < 1) {
          toast('先にバリケードを', 1.6); return false;
        }
        const wall = side === 'left' ? structures.leftWall : structures.rightWall;
        const x = (wall.level > 0 ? wall.x : (side==='left'?-120:120)) + (side==='left'?40:-40);
