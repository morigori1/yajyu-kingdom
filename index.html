// ---------- 更新 ----------
let last = performance.now();
function loop(now) {
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  // ヒットストップ／スローモ（感情演出）— 実時間で減衰
  if (state.hitStop > 0) state.hitStop -= raw;
  if (state.slowMoT > 0) state.slowMoT -= raw;
  if (state.dawnFxT > 0) state.dawnFxT -= raw;
  if (state.clearPillarT > 0) state.clearPillarT -= raw;
  const scale = state.hitStop > 0 ? 0.15 : (state.slowMoT > 0 ? 0.42 : 1);
  const dt = raw * scale;
  if (state.running && !state.over) update(dt);
  else {
    tickPresentation(dt, raw);
    if (state.titleCine) {
      // シネマカメラ：ゆっくり左右に漂う
      state.cameraX = Math.sin(state.animT * 0.25) * 70 + Math.sin(state.animT * 0.07) * 30;
      state.nightSway = Math.sin(state.animT * 1.2) * 1.2;
    }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function tickPresentation(dt, rawDt) {
  const r = rawDt != null ? rawDt : dt;
  if (state.shakeT > 0) state.shakeT -= r;
  else state.shakeMag = 0;
  if (state.flashT > 0) state.flashT -= r;
  if (state.skillRingT > 0) state.skillRingT -= r;
  if (state.winFxT > 0) state.winFxT -= r;
  // タイトル導入：徐々に夜が明ける
  if (state.titleCine && !state.running) {
    state.titleDawn = Math.min(1, (state.titleDawn || 0) + r * 0.11);
    const ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('hidden')) {
      if (state.titleDawn > 0.35) ov.classList.add('cine-dawn');
      else ov.classList.remove('cine-dawn');
    }
    // 王冠きらめき粒子（低頻度）
    if (GFX.quality !== 'low' && Math.random() < 0.08 * r * 60) {
      pushFx({
        type: 'spark', x: player.x + rand(-10, 10), y: GROUND_Y - 70 + rand(-6, 4),
        vx: rand(-20, 20), vy: rand(-50, -10), t: 0, life: 0.5,
        color: pick(['#ffd700', '#fff8c8', '#fff']), size: 2,
      });
    }
  }
  state.animT += dt;
  tickWindWeather(dt);
  spawnMistAmbient(dt);
  const emberChance = (state.isNight ? 0.35 : 0.12) * (GFX.emberMul || 1);
  if (Math.random() < emberChance * dt * 60) {
    pushFx({
      type: 'spark', x: rand(-8, 8), y: GROUND_Y - rand(24, 40),
      vx: rand(-20, 20), vy: rand(-70, -30),
      t: 0, life: rand(0.4, 0.9),
      color: pick(['#ffcc33', '#ff6600', '#ffe566', '#fff']),
      size: 2,
    });
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.t += dt;
    if (f.type === 'pay') {
      const p = Math.min(1, f.t / f.life);
      f.x = f.x + (f.tx - f.x) * p;
    }
    if (f.type === 'dot' || f.type === 'spark' || f.type === 'trail') {
      f.x += (f.vx || 0) * dt;
      f.y += (f.vy || 0) * dt;
      if (f.type !== 'trail') f.vy = (f.vy || 0) + (f.type === 'spark' ? 200 : 120) * dt;
    }
    if (f.type === 'mist' || f.type === 'ember') {
      f.x += (f.vx || 0) * dt;
      f.y += (f.vy || 0) * dt;
    }
    if (f.type === 'paren') f.y -= 22 * dt;
    if (f.type === 'slash') { f.x += (f.vx || 0) * dt; }
    if (f.t >= (f.life || 1)) fx.splice(i, 1);
  }
  for (const e of enemies) { if (e._flash > 0) e._flash -= dt; }
  for (const u of units) { if (u._shotFlash > 0) u._shotFlash -= dt; }
}

function update(dt) {
  // 昼夜
  state.dayTimer += dt;
  const len = state.isNight ? state.nightLength : state.dayLength;
  if (state.dayTimer >= len) {
    if (state.isNight) {
      // 朝へ
      enemies.length = 0; // 残敵逃走
      state.day++;
      startDay();
      winCheck();
    } else {
      startNight();
    }
  }

  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) document.getElementById('toast').classList.remove('show');
  }
  if (storyTimer > 0) {
    storyTimer -= dt;
    if (storyTimer <= 0) {
      const s = document.getElementById('story');
      if (s) s.classList.remove('show');
    }
  }

  // 独自メカ＆アニメ時刻（animT / 風は tickPresentation）
  state.nightSway = state.wind * 1.1 + (state.isNight ? Math.sin(state.animT * 1.7) * 0.4 : 0);
  if (state.bossCineT > 0) {
    state.bossCineT -= dt;
    const tx = state.bossCineX * 0.55;
    state.cameraX += (tx - state.cameraX) * Math.min(1, dt * 3.2);
  }
  if (state.skillCd > 0) state.skillCd -= dt;
  if (state.skillStunT > 0) state.skillStunT -= dt;
  if (state.gazeT > 0) state.gazeT -= dt;
  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.killCombo = 0;
  }
  // 昼ミニ選択（昼の中盤・1回）
  if (!state.isNight && !state.dayChoiceDone && state.dayTimer >= 18 && state.dayTimer < 19.2) {
    openDayChoice();
    return; // 選択中は世界を止める
  }
  // 湿度：移動で上昇、静止＋部室近傍で低下、夜は上昇速め
  const nearCamp = Math.abs(player.x) < 70;
  const moving = Math.abs(player.vx) > 10 || (keys['ArrowLeft']||keys['KeyA']||touchMove.left||keys['ArrowRight']||keys['KeyD']||touchMove.right);
  // note: player.vx set below — use input preview
  let humidRate = state.isNight ? 1.8 : 1.1;
  // 仮: 下で再計算するためフラグのみ。本計算は移動後

  // 移動
  let input = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || touchMove.left) input -= 1;
  if (keys['ArrowRight'] || keys['KeyD'] || touchMove.right) input += 1;
  player.vx = input * player.speed * playerSpeedMul();
  if (input) player.facing = input;
  player.x += player.vx * dt;
  // 壁の内側に制限しすぎない（探索可）。ワールド端のみ
  player.x = clamp(player.x, world.leftBound + 40, world.rightBound - 40);

  // 湿度本計算
  if (Math.abs(input) > 0) state.humidity += humidRate * dt * (state.isNight ? 1.35 : 1);
  else if (nearCamp) state.humidity -= 3.2 * dt;
  else state.humidity -= 0.35 * dt;
  // 敵近接で汗
  for (const e of enemies) {
    if (Math.abs(e.x - player.x) < 90) { state.humidity += 2.2 * dt; break; }
  }
  state.humidity = clamp(state.humidity, 0, 100);
  if ((Math.floor(state.animT * 4) % 4) === 0) updateHumidityHud();

  // カメラ（向き先読み＋微呼吸）
  const look = (player.facing || 1) * 36;
  const breath = Math.sin(state.animT * 0.55) * 2.5;
  const targetCam = player.x - W / 2 + look + breath;
  state.cameraX += (targetCam - state.cameraX) * Math.min(1, dt * 4.2);

  // ambientミーム（たき火周辺）
  if (!state._memeCd) state._memeCd = 0;
  state._memeCd -= dt;
  if (state._memeCd <= 0) {
    state._memeCd = state.isNight ? 4.5 : 7;
    const lines = state.isNight
      ? ['見とけよ', 'ファッ!?', 'ンアッー', 'キタ!', '114514', '来るな']
      : ['いいゾ〜これ', 'やりますねぇ', '王道を征く', '114514', '810', 'こ↑こ↓', 'おかのした', 'あっ（察し）'];
    spawnMeme(rand(-40, 40), GROUND_Y - 54, pick(lines));
  }

  // コイン物理＆拾い
  for (let i = coinsOnGround.length - 1; i >= 0; i--) {
    const c = coinsOnGround[i];
    c.age += dt;
    c.pickupDelay = Math.max(0, c.pickupDelay - dt);
    c.vy += 400 * dt;
    c.y += c.vy * dt;
    if (c.y >= GROUND_Y - 8) {
      c.y = GROUND_Y - 8;
      if (Math.abs(c.vy) > 30) c.vy *= -0.35;
      else c.vy = 0;
    }
    if (c.pickupDelay <= 0 && Math.abs(c.x - player.x) < 22 && Math.abs(c.y - (GROUND_Y - 10)) < 30) {
      state.coins++;
      spawnCoinSparkle(c.x, c.y);
      coinsOnGround.splice(i, 1);
      spawnMeme(player.x, GROUND_Y - 36, '+1');
      if (Math.random() < 0.35) spawnMeme(player.x + 20, GROUND_Y - 50, pick(LORE.coinPickup));
    }
  }

  // 作業員後輩（昼の収入）
  if (!state.isNight) {
    for (const w of workers) {
      w.workCd = (w.workCd || 0) - dt;
      // 解放聖地／部室のあいだをロケ往復（徒歩片鱗／バスは別途）
      const u = unlockedLandmarks();
      let home = 0;
      if (w.lmId && state.landmarks[w.lmId]) {
        const Lm = landmarkById(w.lmId);
        if (Lm) home = Lm.x;
      } else if (u.length) {
        const pool = u.filter(x => (w.side || 0) === 0 || x.side === w.side);
        const pickL = (pool.length ? pool : u)[0];
        home = pickL ? pickL.x : 0;
        if (pickL) w.lmId = pickL.id;
      }
      // ロケバス搭乗中は座標をバスに追従
      if (state.bus && state.bus.cargo && state.bus.cargo.includes(w)) {
        w.x = state.bus.x;
      } else {
        const target = home + Math.sin(state.animT * 0.6 + (w.bob || 0)) * 36;
        w.x += (target - w.x) * Math.min(1, dt * 1.4);
      }
      if (w.workCd <= 0) {
        w.workCd = 4.5 + rand(0, 2);
        // 地面にコイン or 直接収入（軽め）
        const pay = 1 + (facilityLv(w.lmId) >= 2 ? 1 : 0) + ((state.civilTier | 0) >= 2 && Math.random() < 0.35 ? 1 : 0);
        if (Math.random() < 0.55) {
          dropCoin(w.x + rand(-12, 12), pay);
        } else {
          state.coins += pay;
          spawnMeme(w.x, GROUND_Y - 40, pick(LORE.workerWork));
        }
        if (Math.random() < 0.25) pushFx({
          type: 'spark', x: w.x, y: GROUND_Y - 20, vx: rand(-10,10), vy: -40,
          t: 0, life: 0.4, color: '#ffd700', size: 2,
        });
      }
    }
  } else {
    // 夜は部室付近に退避
    for (const w of workers) {
      w.x += (rand(-30, 30) - w.x) * dt * 0.8;
    }
  }

  // 軍事ユニット（砲台／先鋒）
  for (const u of units) {
    if (u._shotFlash > 0) u._shotFlash -= dt;
    const wall = u.side === 'left' ? structures.leftWall : structures.rightWall;
    if (u.role === 'vanguard') {
      // 先鋒は壁より外側で待機（侵攻時にバスへ）
      const ideal = wall.x + (u.side === 'left' ? -28 : 28);
      u.x += (ideal - u.x) * dt * 2.2;
      continue;
    }
    const ideal = wall.x + (u.side === 'left' ? 16 : -16);
    u.x += (ideal - u.x) * dt * 2;
    u.cooldown -= dt;
    if (u.cooldown <= 0 && state.isNight) {
      let best = null, bestD = 280 + (u.tier | 0) * 40 + (state.miliTier | 0) * 20;
      for (const e of enemies) {
        const d = Math.abs(e.x - u.x);
        if (d < bestD && ((u.side === 'left' && e.x <= u.x + 40) || (u.side === 'right' && e.x >= u.x - 40) || d < 200)) {
          best = e; bestD = d;
        }
      }
      if (!best) {
        for (const e of enemies) {
          const d = Math.abs(e.x - u.x);
          if (d < bestD) { best = e; bestD = d; }
        }
      }
      if (best) {
        const spd = 240 + (u.tier | 0) * 30;
        const vx = (best.x - u.x) > 0 ? spd : -spd;
        arrows.push({
          x: u.x, y: GROUND_Y - 28,
          vx, life: 1.2, trailCd: 0,
          dmg: 1 + Math.min(2, u.tier | 0),
        });
        u._shotFlash = 0.18;
        spawnSparks(u.x, GROUND_Y - 28, 3, ['#fff8d0', '#ffd700'], 50);
        pushFx({ type: 'ring', x: u.x, y: GROUND_Y - 28, t: 0, life: 0.15, color: 'rgba(255,240,180,0.4)', r0: 2, r1: 12 });
        u.cooldown = (1.1 + rand(0, 0.4) - (u.tier | 0) * 0.12) * archerCdMul();
      } else {
        u.cooldown = 0.4;
      }
    }
  }

  // 矢（軌跡・着弾リング）
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.x += a.vx * dt;
    a.life -= dt;
    a.trailCd = (a.trailCd || 0) - dt;
    if (a.trailCd <= 0) {
      a.trailCd = GFX.quality === 'low' ? 0.045 : 0.022;
      pushFx({
        type: 'trail', x: a.x - Math.sign(a.vx) * 4, y: a.y + rand(-1, 1),
        t: 0, life: 0.22, color: '#ffe8a0', size: 2,
        vx: -a.vx * 0.05, vy: rand(-10, 10),
      });
    }
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.abs(a.x - e.x) < 14 && Math.abs((GROUND_Y - 20) - (e.y - 14)) < 24) {
        e.hp -= (a.dmg || 1);
        hit = true;
        spawnArrowHit(e.x, GROUND_Y, a.vx);
        e._flash = 0.14;
        state.hitStop = Math.max(state.hitStop, 0.04);
        if (e.hp <= 0) {
          spawnMeme(e.x, GROUND_Y - 40, pick(LORE.enemyDown));
          if (Math.random() < 0.55) dropCoin(e.x, 1);
          if (e.isTaka && Math.random() < 0.5) dropCoin(e.x, 1);
          onSacredKill();
          bestiaryKill(e.name || '?');
          if (e.isBoss) bumpBond('kohai', 3);
          checkAchievements();
          spawnKillEcho(e.x, GROUND_Y, e.isBoss || e.isMur);
          enemies.splice(j, 1);
        }
        break;
      }
    }
    if (hit || a.life <= 0) {
      if (!hit && a.life <= 0) {
        // 空振り着地の小さな埃
        pushFx({ type: 'spark', x: a.x, y: GROUND_Y - 8, vx: rand(-20,20), vy: -30, t: 0, life: 0.2, color: '#c8a060', size: 2 });
      }
      arrows.splice(i, 1);
    }
  }

  // 敵
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.anim = (e.anim || 0) + dt;
    if (e.stunned > 0) e.stunned -= dt;
    // 眼光デバフ：近距離で視線
    if (e.isGaze && Math.abs(e.x - player.x) < 220) {
      state.gazeT = Math.max(state.gazeT, 0.6);
    }
    // たかり後輩：壁より先輩のコインを優先して寄る／近接で窃盗
    if (e.isTaka && state.coins > 0 && Math.abs(e.x - player.x) < 280) {
      const dir = Math.sign(player.x - e.x) || e.side;
      const slow = e.stunned > 0 ? 0.25 : 1;
      e.x += dir * e.speed * 1.15 * slow * dt;
      e.stealCd = (e.stealCd || 0) - dt;
      if (Math.abs(e.x - player.x) < 36 && e.stealCd <= 0) {
        state.coins = Math.max(0, state.coins - 1);
        e.stealCd = 2.8;
        dropCoin(e.x + rand(-20, 20), 1, true); // 奪って落とす演出（回収可）
        spawnMeme(e.x, GROUND_Y - 50, 'たかり!');
        toast('たかり後輩にコインを…あっ（察し）', 2.0);
        state.humidity = clamp(state.humidity + 4, 0, 100);
      }
      // たかり中は通常壁AIスキップ
      continue;
    }
    const wall = e.side < 0 ? structures.leftWall : structures.rightWall;
    let targetX = 0; // たき火
    let blocking = false;
    if (wall.level > 0 && wall.hp > 0) {
      // 壁の外側から近づく
      if (e.side < 0 && e.x < wall.x - 10) { targetX = wall.x - 12; }
      else if (e.side > 0 && e.x > wall.x + 10) { targetX = wall.x + 12; }
      else if (e.side < 0 && e.x >= wall.x - 14) { blocking = true; targetX = wall.x; }
      else if (e.side > 0 && e.x <= wall.x + 14) { blocking = true; targetX = wall.x; }
      else targetX = 0;
    }
    if (!blocking) {
      const dir = Math.sign(targetX - e.x) || e.side;
      // 壁を超えたらキャンプへ
      if (wall.level === 0 || wall.hp <= 0) {
        e.x += Math.sign(0 - e.x) * e.speed * (e.stunned > 0 ? 0.22 : 1) * dt;
      } else if ((e.side < 0 && e.x < wall.x - 12) || (e.side > 0 && e.x > wall.x + 12)) {
        e.x += Math.sign((wall.x - e.side * 12) - e.x) * e.speed * (e.stunned > 0 ? 0.22 : 1) * dt;
      } else {
        blocking = true;
      }
    }
    // 攻撃判定
    e.attackCd -= dt;
    if (wall.level > 0 && wall.hp > 0 && Math.abs(e.x - wall.x) < 20) {
      if (e.attackCd <= 0) {
        wall.hp -= 3 + Math.floor(state.day * 0.85);
        e.attackCd = 0.9;
        spawnMeme(wall.x, GROUND_Y - 50, pick(LORE.wallHit));
        spawnSparks(wall.x, GROUND_Y - 30, 3, ['#c8a060', '#fff'], 60);
        shake(1.5, 0.08);
        if (wall.hp <= 0) {
          wall.hp = 0;
          wall.level = 0;
          const bl = pick(LORE.wallBreak);
          toast((e.side < 0 ? '西' : '東') + 'の壁崩壊！ ' + bl, 3);
          story(bl, 2.8);
          spawnMeme(wall.x, GROUND_Y - 60, pick(['あ゛あ゛っ', 'ファッ!?', 'なに!?']));
          shake(7, 0.4);
          screenFlash('rgba(200,80,40,0.3)', 0.2);
          spawnSparks(wall.x, GROUND_Y - 40, 10, ['#8b5a2b', '#ff6b9d', '#fff'], 140);
        }
      }
    } else if (Math.abs(e.x - 0) < 28) {
      // たき火ダメージ
      if (e.attackCd <= 0) {
        structures.campfire.hp -= 6 + Math.floor(state.day * 0.9);
        e.attackCd = 0.8;
        const cl = pick(LORE.campHit);
        spawnMeme(0, GROUND_Y - 70, 'ファッ!?');
        shake(4, 0.15);
        screenFlash('rgba(255,120,40,0.2)', 0.08);
        spawnSparks(0, GROUND_Y - 30, 5, ['#ff6600', '#ffcc33'], 80);
        if (structures.campfire.hp < 40) {
          toast(cl, 2);
          story(cl, 2.2);
        }
        if (structures.campfire.hp <= 0) {
          structures.campfire.hp = 0;
          state.over = true;
          state.running = false;
          shake(10, 0.55);
          screenFlash('rgba(180,0,40,0.4)', 0.35);
          spawnSparks(0, GROUND_Y - 40, 12, ['#f44', '#ff6b9d', '#333'], 160);
          showEnd(false);
        }
      }
    }
  }

  tickLocationBus(dt);
  tickMission(dt);
  if (state.heatEventT > 0) state.heatEventT -= dt;
  tickPresentation(dt);

  // HUD
  const left = document.getElementById('hud-left');
  const right = document.getElementById('hud-right');
  const remain = Math.max(0, (state.isNight ? state.nightLength : state.dayLength) - state.dayTimer);
  const gaze = state.gazeT > 0 ? ' <span style="color:#f88">眼光…</span>' : '';
  const combo = state.killCombo >= 2 ? ` <span class="meme">×${state.killCombo}</span>` : '';
  const wTag = workers.length ? ` 作業${workers.length}` : '';
  const iTag = unlockedCount() ? ` 聖地${unlockedCount()}` : '';
  const busTag = state.bus ? (state.bus.mode === 'raid' ? ' <span style="color:#f84">侵攻</span>' : ' <span style="color:#fc8">バス</span>') : '';
  const misTag = state.mission ? ` <span style="color:#fc8">撮${state.mission.progress}/${state.mission.need}</span>` : '';
  const heatTag = state.heatEvent ? ' <span style="color:#f66">真夏</span>' : '';
  const chTag = ` ${chapterName(state.chapter)}`;
  const asTag = state.assault ? ' <span style="color:#f96">攻勢</span>' : '';
  const cmTag = ` <span style="color:#8cf">内政${state.civilTier|0}</span>/<span style="color:#fa8">軍事${state.miliTier|0}</span>`;
  left.innerHTML = `<span class="gold">🪙 ${state.coins}</span> <span style="color:#8af">銀行${state.bank}</span>${combo}<br>Day ${state.day}${chTag}${asTag}${cmTag}${gaze}${wTag}${iTag}${busTag}${misTag}${heatTag}<br><span class="${state.isNight ? 'night' : 'gold'}">${state.isNight ? '夜' : '昼'} ${remain.toFixed(0)}s</span> 茶×${state.icedTeaStock}`;
  const spot = nearestSpot();
  const sk = state.skillCd > 0 ? `Q技能CD ${state.skillCd.toFixed(0)}s` : 'Q/迫真＝括弧ツッコミ';
  right.innerHTML = spot
    ? `<span class="meme">支払い可</span><br>${spot.label}<br><span class="gold">コスト ${spot.cost}</span>`
    : `${sk}<br>T＝アイスティー／湿度に注意`;
}

function tickWindWeather(dt) {
  // 基調風 + 突風
  const base = Math.sin(state.animT * 0.55) * 1.35 + Math.sin(state.animT * 0.19 + 1.7) * 0.85;
  if (Math.random() < 0.012 * dt * 60) state.windGust = rand(1.2, 2.8) * (Math.random() < 0.5 ? -1 : 1);
  state.windGust *= Math.exp(-dt * 1.6);
  state.wind = base + state.windGust;
  // 雲影スクロール
  state.cloudX = (state.cloudX || 0) + (18 + state.wind * 6) * dt;
  // 夕立（昼終盤／夕のみ・短い）
  if (state.rainT > 0) state.rainT -= dt;
  if (state.rainCool > 0) state.rainCool -= dt;
  if (state.running && !state.isNight && state.rainT <= 0 && state.rainCool <= 0) {
    const phase = dayPhase();
    if (phase >= 0.52 && phase <= 0.7 && Math.random() < 0.004 * dt * 60) {
      state.rainT = rand(3.2, 6.5);
      state.rainCool = 28;
      if (Math.random() < 0.55) toast('夕立…湿度が上がる', 2.2);
      state.humidity = Math.min(100, state.humidity + 6);
      updateHumidityHud();
    }
  }
}

function drawCloudShadows(phase) {
  if (!GFX.weather) return;
  if (phase >= 0.72) return; // 夜は星優先
  const low = GFX.quality === 'low';
  const n = low ? 3 : 6;
  const a = phase > 0.55 ? 0.1 : 0.14;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const cx = ((state.cloudX * (0.7 + i * 0.08) + i * 170) % (W + 160)) - 80;
    const cy = GROUND_Y - 18 - (i % 3) * 4;
    const rw = 50 + (i % 3) * 22;
    ctx.globalAlpha = a * (0.7 + (i % 2) * 0.25);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    if (low) {
      ctx.ellipse(cx, cy, rw, 7, 0, 0, Math.PI * 2);
    } else {
      ctx.ellipse(cx, cy, rw, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + rw * 0.45, cy + 1, rw * 0.55, 6, 0, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  // 空の雲シルエット（昼）
  if (!low && phase < 0.65) {
    ctx.globalAlpha = 0.18 + (phase > 0.5 ? 0.08 : 0);
    for (let i = 0; i < 4; i++) {
      const cx = ((-state.cloudX * 0.35 + i * 210) % (W + 120)) - 40;
      const cy = 28 + (i % 3) * 16;
      ctx.fillStyle = phase > 0.52 ? '#6a4a58' : '#e8f0ff';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 36 + i * 4, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 22, cy + 2, 28, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// 時刻・光（Two Crowns風の昼夜ブレンド）
// =========================================================
function dayPhase() {
  // タイトルシネマ：夜→夜明けへ
  if (state.titleCine && !state.running) {
    return lerp(0.92, 0.22, clamp(state.titleDawn, 0, 1));
  }
  // 0=夜明け 0.25=昼 0.55=夕暮れ 0.75=夜 1=深夜寄り
  if (!state.running && state.over && !state.won) return 0.85;
  if (state.isNight) {
    const p = state.dayTimer / Math.max(1, state.nightLength);
    return 0.72 + clamp(p, 0, 1) * 0.26;
  }
  const p = state.dayTimer / Math.max(1, state.dayLength);
  if (p < 0.12) return lerp(0.05, 0.22, p / 0.12);       // 夜明け→朝
  if (p < 0.55) return lerp(0.22, 0.38, (p - 0.12) / 0.43); // 朝→昼
  if (p < 0.82) return lerp(0.38, 0.58, (p - 0.55) / 0.27); // 昼→夕
  return lerp(0.58, 0.72, (p - 0.82) / 0.18);               // 夕→夜前
}

function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }

function skyColors(phase) {
  // phase 0..1 → top/mid/bot
  const stops = [
    { p: 0.00, t: '#1a2040', m: '#3a4068', b: '#6a5080' }, // 夜明け前
    { p: 0.12, t: '#ff9a6a', m: '#ffc090', b: '#8fbc6a' }, // 夜明け
    { p: 0.28, t: '#5eb8ff', m: '#b8e4ff', b: '#8fbc6a' }, // 朝
    { p: 0.40, t: '#4aa8ff', m: '#c8e8ff', b: '#7aaa58' }, // 昼
    { p: 0.58, t: '#ff7a4a', m: '#ffb070', b: '#6a8a48' }, // 夕
    { p: 0.72, t: '#1a1840', m: '#2a2858', b: '#3a3050' }, // 宵
    { p: 0.88, t: '#070a18', m: '#121828', b: '#1a2030' }, // 深夜
    { p: 1.00, t: '#050812', m: '#0c1020', b: '#141820' },
  ];
  let a = stops[0], b = stops[1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (phase >= stops[i].p && phase <= stops[i + 1].p) { a = stops[i]; b = stops[i + 1]; break; }
    if (phase >= stops[i].p) { a = stops[i]; b = stops[Math.min(i + 1, stops.length - 1)]; }
  }
  const t = (phase - a.p) / Math.max(0.001, b.p - a.p);
  return { top: mixHex(a.t, b.t, t), mid: mixHex(a.m, b.m, t), bot: mixHex(a.b, b.b, t), phase };
}

function mixHex(c1, c2, t) {
  const p = (c) => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const a = p(c1), b = p(c2);
  const r = (a[0] + (b[0]-a[0])*t)|0, g = (a[1]+(b[1]-a[1])*t)|0, bl = (a[2]+(b[2]-a[2])*t)|0;
  return '#' + [r,g,bl].map(v => v.toString(16).padStart(2,'0')).join('');
}


function drawTorchLights() {
  if (!GFX.torches) return;
  const nightish = state.isNight || (state.titleCine && state.titleDawn < 0.55);
  if (!nightish && !(state.titleCine && state.titleDawn < 0.7)) return;
  const posts = [];
  // 門灯（壁）
  for (const w of [structures.leftWall, structures.rightWall]) {
    if (w.level > 0) posts.push({ x: w.x, y: GROUND_Y - (w.level === 1 ? 50 : 70), gate: true });
  }
  // トーチ列：領地内に等間隔
  const lx = structures.leftWall.level > 0 ? structures.leftWall.x + 40 : -120;
  const rx = structures.rightWall.level > 0 ? structures.rightWall.x - 40 : 120;
  const step = GFX.quality === 'low' ? 90 : 70;
  for (let x = lx; x <= rx; x += step) {
    if (Math.abs(x) < 28) continue; // たき火付近はスキップ
    posts.push({ x, y: GROUND_Y - 34, gate: false });
  }
  // タイトル時は仮のトーチ列
  if (state.titleCine && posts.length < 3) {
    for (let i = -3; i <= 3; i++) posts.push({ x: i * 70, y: GROUND_Y - 34, gate: false });
  }
  const maxL = GFX.quality === 'low' ? 6 : posts.length;
  for (let i = 0; i < Math.min(posts.length, maxL); i++) {
    const p = posts[i];
    const sx = wx(p.x);
    const flick = 0.85 + Math.sin(state.animT * 7 + p.x * 0.05) * 0.15;
    // ポール
    drawPixelRect(sx - 1, p.y, 3, GROUND_Y - p.y, '#3a2818');
    // 炎
    const fi = ((state.animT * 10 + i) | 0) % 3;
    drawPixelRect(sx - 2, p.y - 6 - fi, 5, 6 + fi, fi === 0 ? '#ff6600' : '#ffcc33');
    drawPixelRect(sx, p.y - 8 - fi, 2, 3, '#fff8d0');
    // 暖かい光
    const rad = (p.gate ? 70 : 48) * flick;
    const g = ctx.createRadialGradient(sx, p.y - 4, 2, sx, p.y - 4, rad);
    g.addColorStop(0, `rgba(255,180,70,${0.28 * flick})`);
    g.addColorStop(0.45, `rgba(255,120,40,${0.1 * flick})`);
    g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(sx - rad, p.y - rad, rad * 2, rad * 2);
    // 地面の光だまり
    ctx.globalAlpha = 0.16 * flick;
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.ellipse(sx, GROUND_Y + 1, rad * 0.45, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawHeatWave() {
  if (!GFX.heatHaze) return;
  const h = state.humidity || 0;
  if (h < 55 && !(state.titleCine && state.titleDawn > 0.5)) return;
  const strength = state.titleCine ? 0.12 : clamp((h - 50) / 200, 0, 0.2);
  const bands = GFX.quality === 'low' ? 4 : 8;
  ctx.save();
  for (let i = 0; i < bands; i++) {
    const y = GROUND_Y - 90 + i * 10 + Math.sin(state.animT * 2.5 + i) * 3;
    const ox = Math.sin(state.animT * 3.2 + i * 1.3) * (3 + strength * 20);
    ctx.globalAlpha = strength * (0.35 + (i % 2) * 0.2);
    ctx.fillStyle = h >= 75 ? 'rgba(255,160,180,0.5)' : 'rgba(255,230,180,0.45)';
    ctx.fillRect(ox, y, W, 2);
  }
  // 汗のきらめき（空中の光粒）
  if (h >= 60 || (state.titleCine && state.titleDawn > 0.4)) {
    const n = GFX.quality === 'low' ? 4 : 10;
    for (let i = 0; i < n; i++) {
      const px = ((i * 97 + state.animT * 40 * (1 + i * 0.02)) % W);
      const py = GROUND_Y - 30 - ((state.animT * 25 + i * 40) % 100);
      ctx.globalAlpha = 0.25 + Math.sin(state.animT * 6 + i) * 0.15;
      ctx.fillStyle = i % 2 ? '#fff' : '#aef';
      ctx.fillRect(px, py, 2, 2);
    }
  }
  ctx.restore();
}

function drawSoftShadow(x, y, w, alpha, windSkew) {
  const sk = windSkew != null ? windSkew : (state.wind || 0) * 1.8;
  const cx = x + sk;
  if (!GFX.softShadow) {
    ctx.globalAlpha = (alpha || 0.28) * 0.7;
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - w, y, w * 2, 3);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.globalAlpha = alpha || 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, y + 2, w + Math.abs(sk) * 0.15, Math.max(3, w * 0.28), sk * 0.02, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawGodRays(phase) {
  if (phase < 0.08 || phase > 0.62) return;
  const sunX = W * (0.78 - (phase - 0.2) * 0.15);
  const sunY = 36 + Math.abs(phase - 0.35) * 90;
  ctx.save();
  ctx.globalAlpha = phase > 0.5 ? 0.07 : 0.09;
  for (let i = -3; i <= 3; i++) {
    const ang = -0.4 + i * 0.11;
    ctx.fillStyle = phase > 0.5 ? '#ffaa66' : '#fff8d0';
    ctx.beginPath();
    ctx.moveTo(sunX, sunY);
    ctx.lineTo(sunX + Math.cos(ang) * 420, sunY + Math.sin(ang) * 420);
    ctx.lineTo(sunX + Math.cos(ang + 0.05) * 420, sunY + Math.sin(ang + 0.05) * 420);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawAurora() {
  if (!state.isNight) return;
  ctx.save();
  for (let band = 0; band < 3; band++) {
    const y0 = 28 + band * 22;
    const g = ctx.createLinearGradient(0, y0, W, y0 + 40);
    const a = 0.10 + Math.sin(state.animT * 0.7 + band) * 0.04;
    g.addColorStop(0, `rgba(40,255,180,0)`);
    g.addColorStop(0.35, `rgba(${60+band*40},${220-band*30},255,${a})`);
    g.addColorStop(0.65, `rgba(180,80,255,${a * 0.85})`);
    g.addColorStop(1, `rgba(40,255,180,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, y0 + 20);
    for (let x = 0; x <= W; x += 16) {
      const yy = y0 + Math.sin(x * 0.012 + state.animT * (0.8 + band * 0.2) + band) * (10 + band * 4)
        + Math.sin(x * 0.03 - state.animT) * 4;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, y0 + 55);
    ctx.lineTo(0, y0 + 55);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}


function drawGroundFog(phase) {
  const a = phase >= 0.68 ? 0.14 : 0.06;
  const g = ctx.createLinearGradient(0, GROUND_Y - 28, 0, GROUND_Y + 8);
  g.addColorStop(0, 'rgba(200,220,255,0)');

}
function drawHumidityHaze() {
  const h = state.humidity || 0;
  if (h < 40) return;

  const g = ctx.createLinearGradient(0, GROUND_Y - 100, 0, GROUND_Y + 20);
  const col = h >= 80 ? `rgba(255,140,180,${a})` : `rgba(170,200,255,${a})`;
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y - 110, W, 130);
  // 熱ゆらぎドット
  if (h >= 70) {
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 8; i++) {
      const x = ((i * 97 + state.animT * 30) % W);
      const y = GROUND_Y - 20 - Math.sin(state.animT * 2 + i) * 8;
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, 2, 6);
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- 描画（ドット絵ベース + ミーム文字） ----------
function wx(x) { return Math.floor(x - state.cameraX); }

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  const phase = dayPhase();
  const sky = skyColors(phase);
  const nightish = phase >= 0.68;

  // ---- カメラシェイク ----
  let shakeX = 0, shakeY = 0;
  if (state.shakeT > 0 && state.shakeMag > 0) {
    const m = state.shakeMag * (state.shakeT / 0.35);
    shakeX = (Math.random() - 0.5) * 2 * m;
    shakeY = (Math.random() - 0.5) * 2 * m * 0.6;
  }
  ctx.save();
  ctx.translate(shakeX | 0, shakeY | 0);

  // ---- 空グラデ ----
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, sky.top);
  skyGrad.addColorStop(0.45, sky.mid);
  skyGrad.addColorStop(1, sky.bot);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // 星（夜）
  if (phase >= 0.65) {
    const starA = clamp((phase - 0.65) / 0.2, 0, 1);
    ctx.globalAlpha = starA * 0.9;
    const starN = GFX.starCount || 40;
    for (let i = 0; i < starN; i++) {
      const sx = ((i * 97 + 30) - state.cameraX * 0.08 + Math.sin(state.animT * 0.2 + i) * 2) % W;
      const sy = (i * 53) % (GROUND_Y - 50);
      if (sy > 8) {
        const tw = 0.55 + Math.sin(state.animT * 3 + i * 1.7) * 0.45;
        ctx.globalAlpha = starA * tw;
        ctx.fillStyle = i % 7 === 0 ? '#ffd700' : '#fff';
        ctx.fillRect(sx, sy, i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
      }
    }
    ctx.globalAlpha = 1;
    if (GFX.aurora) drawAurora();
  }

  // 太陽 / 月
  if (phase < 0.68) {
    const sunX = W * (0.82 - phase * 0.25);
    const sunY = 28 + Math.pow(Math.abs(phase - 0.35), 1.2) * 110;
    const glow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 70);
    const warm = phase > 0.5;
    glow.addColorStop(0, warm ? 'rgba(255,160,80,0.85)' : 'rgba(255,245,200,0.95)');
    glow.addColorStop(0.35, warm ? 'rgba(255,120,40,0.25)' : 'rgba(255,220,140,0.28)');
    glow.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sunX - 80, sunY - 80, 160, 160);
    drawPixelRect(sunX - 10, sunY - 10, 20, 20, warm ? '#ff8844' : '#ffe566');
    drawPixelRect(sunX - 6, sunY - 6, 12, 12, '#fff8d0');
    if (GFX.godRays) drawGodRays(phase);
  } else {
    const moonX = W * 0.72;
    const moonY = 48;
    const mg = ctx.createRadialGradient(moonX, moonY, 2, moonX, moonY, 46);
    mg.addColorStop(0, 'rgba(200,220,255,0.55)');
    mg.addColorStop(1, 'rgba(120,160,255,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(moonX - 50, moonY - 50, 100, 100);
    drawPixelRect(moonX - 8, moonY - 8, 16, 16, '#d8e4ff');
    drawPixelRect(moonX - 4, moonY - 2, 4, 4, '#a0b0d0');
  }

  // 遠景
  drawParallaxHills(phase);
  // 雲影（移動）
  drawCloudShadows(phase);

  // 地面
  drawGroundTiles(phase);

  // 領地床（聖地解放でマップ横断方向へ伸びる）
  let lx = structures.leftWall.level > 0 ? structures.leftWall.x : -40;
  let rx = structures.rightWall.level > 0 ? structures.rightWall.x : 40;
  for (const L of unlockedLandmarks()) {
    if (L.side < 0) lx = Math.min(lx, L.x - 30);
    else rx = Math.max(rx, L.x + 30);
  }
  const territoryAlpha = nightish ? 0.16 : 0.12;
  ctx.fillStyle = `rgba(255, 215, 0, ${territoryAlpha})`;
  ctx.fillRect(wx(lx), GROUND_Y, rx - lx, 6);
  ctx.fillStyle = 'rgba(255,215,0,0.4)';
  for (let x = wx(lx); x < wx(rx); x += 4) ctx.fillRect(x, GROUND_Y, 2, 2);
  // 領地の淡い光床
  if (!nightish || state.isNight) {
    const tg = ctx.createLinearGradient(wx(lx), GROUND_Y - 8, wx(rx), GROUND_Y - 8);
    tg.addColorStop(0, 'rgba(255,215,0,0)');
    tg.addColorStop(0.5, nightish ? 'rgba(255,180,60,0.08)' : 'rgba(255,215,0,0.06)');
    tg.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = tg;
    ctx.fillRect(wx(lx), GROUND_Y - 10, rx - lx, 10);
  }

  // たき火（影→本体）
  drawSoftShadow(wx(0), GROUND_Y, 22, nightish ? 0.4 : 0.22);
  drawCampfire(wx(0), GROUND_Y);
  drawLandmarkMap(phase, nightish);
  drawLocationBus();
  drawMidsummerFx();
  drawMissionMarker();

  // 壁
  drawSoftShadow(wx(structures.leftWall.x), GROUND_Y, 14, 0.25);
  drawSoftShadow(wx(structures.rightWall.x), GROUND_Y, 14, 0.25);
  drawWall(structures.leftWall, true);
  drawWall(structures.rightWall, false);
  drawTorchLights();

  // ショップヒント円
  if (state.running) {
    for (const s of shopSpots()) {
      if (!s.can) continue;
      const near = Math.abs(player.x - s.x) <= s.r;
      ctx.strokeStyle = near ? '#ffd700' : 'rgba(255,215,0,0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(wx(s.x), GROUND_Y - 4, 12, 0, Math.PI * 2);
      ctx.stroke();
      if (near) {
        // パルス光環
        ctx.globalAlpha = 0.25 + Math.sin(state.animT * 5) * 0.1;
        ctx.strokeStyle = '#fff8c0';
        ctx.beginPath();
        ctx.arc(wx(s.x), GROUND_Y - 4, 16 + Math.sin(state.animT * 5) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#ffd700';
        ctx.font = '8px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText(`[SPACE] ${s.cost}🪙`, wx(s.x), GROUND_Y - 70);
        ctx.fillStyle = '#ff6b9d';
        ctx.fillText(s.label, wx(s.x), GROUND_Y - 84);
      }
    }
  }

  // コイン
  for (const c of coinsOnGround) {
    drawSoftShadow(wx(c.x), GROUND_Y, 6, 0.2);
    drawCoin(wx(c.x), c.y);
  }

  // 作業員
  for (const w of workers) {
    drawSoftShadow(wx(w.x), GROUND_Y, 9, 0.2);
    drawWorker(wx(w.x), GROUND_Y, w);
  }
  // ユニット
  for (const u of units) {
    drawSoftShadow(wx(u.x), GROUND_Y, 10, 0.22);
    drawArcher(wx(u.x), GROUND_Y, u);
  }

  // 敵
  for (const e of enemies) {
    drawSoftShadow(wx(e.x), GROUND_Y, e.isBoss || e.isMur ? 16 : 11, 0.28);
    drawEnemy(wx(e.x), GROUND_Y, e);
  }

  // 矢 + 軌跡グロー
  for (const a of arrows) {
    const dir = a.vx > 0 ? 1 : -1;
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#ffe8a0';
    ctx.fillRect(wx(a.x) - dir * 10, a.y - 1, 10, 4);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff8d0';
    ctx.fillRect(wx(a.x) - dir * 5, a.y, 6, 2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(wx(a.x), a.y, 9, 2);
    drawPixelRect(wx(a.x) + (dir > 0 ? 8 : -2), a.y - 1, 3, 4, '#ffd700');
  }

  // プレイヤー
  drawSoftShadow(wx(player.x), GROUND_Y, 14, 0.3);
  drawYajyu(wx(player.x), GROUND_Y, player.facing);

  // 技能リング残光
  if (state.skillRingT > 0) {
    const p = 1 - state.skillRingT / 0.85;
    ctx.globalAlpha = (1 - p) * 0.55;
    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(wx(player.x), GROUND_Y - 36, 20 + p * 90, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(wx(player.x), GROUND_Y - 36, 10 + p * 60, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // FX
  for (const f of fx) {
    if (f.type === 'meme') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ff6b9d';
      ctx.font = '9px "Press Start 2P"';
      ctx.textAlign = 'center';
      const my = clamp(f.y - f.t * 26, 108, GROUND_Y - 28);
      const mx = clamp(wx(f.x), 40, W - 40);
      ctx.fillText(String(f.text).slice(0, 12), mx, my);
      ctx.globalAlpha = 1;
    } else if (f.type === 'burst') {
      const p = f.t / f.life;
      for (let k = 0; k < 8; k++) {
        const ang = k / 8 * Math.PI * 2;
        drawPixelRect(wx(f.x) + Math.cos(ang) * p * 22, f.y + Math.sin(ang) * p * 14, 3, 3, k % 2 ? '#ff6b9d' : '#ffd700');
      }
    } else if (f.type === 'dot' || f.type === 'spark') {
      const a = 1 - f.t / (f.life || 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color || '#fff';
      const s = f.size || 3;
      ctx.fillRect(wx(f.x), f.y, s, s);
      if (f.type === 'spark') {
        ctx.globalAlpha = a * 0.4;
        ctx.fillRect(wx(f.x) - 1, f.y - 1, s + 2, s + 2);
      }
      ctx.globalAlpha = 1;
    } else if (f.type === 'mist') {
      const a = (1 - f.t / f.life) * 0.9;
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color || 'rgba(180,210,255,0.15)';
      const s = f.size || 14;
      ctx.beginPath();
      ctx.ellipse(wx(f.x), f.y, s, s * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (f.type === 'ring') {
      const p = f.t / f.life;
      const r = (f.r0 || 4) + ((f.r1 || 30) - (f.r0 || 4)) * p;
      ctx.globalAlpha = (1 - p) * 0.7;
      ctx.strokeStyle = f.color || 'rgba(255,215,0,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(wx(f.x), f.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === 'paren') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ff6b9d';
      ctx.font = '18px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText(f.text || '（', wx(f.x), f.y);
      ctx.globalAlpha = 1;
    } else if (f.type === 'trail') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = f.color || '#ffe8a0';
      ctx.fillRect(wx(f.x), f.y, f.size || 2, f.size || 2);
      ctx.globalAlpha = 1;
    } else if (f.type === 'slash') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a;
      ctx.strokeStyle = f.color || '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(wx(f.x) - 8, f.y - 4);
      ctx.lineTo(wx(f.x) + 10, f.y + 3);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === 'pillar') {
      const a = (1 - f.t / f.life) * 0.9;
      const w = f.w || 14;
      const g = ctx.createLinearGradient(wx(f.x), 0, wx(f.x), GROUND_Y);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.35, f.color || 'rgba(255,215,0,0.35)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = a;
      ctx.fillStyle = g;
      ctx.fillRect(wx(f.x) - w / 2, 0, w, GROUND_Y);
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = '#fff';
      ctx.fillRect(wx(f.x) - 1, 20, 2, GROUND_Y - 40);
      ctx.globalAlpha = 1;
    } else if (f.type === 'pay') {
      const p = Math.min(1, f.t / f.life);
      drawCoin(wx(f.tx - (1 - p) * (f.tx - player.x)), GROUND_Y - 20 - Math.sin(p * Math.PI) * 40);
    }
  }

  // 名前プレート
  ctx.fillStyle = '#ff6b9d';
  ctx.font = '8px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('野獣先輩', wx(player.x), GROUND_Y - 72);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('👑王道を征く', wx(player.x), GROUND_Y - 84);

  // 湿度ヘイズ
  drawGroundFog(phase);
  drawHumidityHaze();
  drawHeatWave();
  drawRain();
  drawBossCineOverlay();

  // 夜間ヴィネット＋たき火ライト体積
  if (nightish) {
    const g = ctx.createRadialGradient(W/2, GROUND_Y - 40, 60, W/2, GROUND_Y, 460);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0,0,0,${0.35 + (phase - 0.68) * 0.5})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // たき火の暖色ボリュームライト
    const lx2 = wx(0), ly2 = GROUND_Y - 24;
    const pulse = 150 + Math.sin(state.animT * 4) * 12;
    const light = ctx.createRadialGradient(lx2, ly2, 8, lx2, ly2, pulse);
    light.addColorStop(0, 'rgba(255,190,80,0.32)');
    light.addColorStop(0.4, 'rgba(255,140,40,0.12)');
    light.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, W, H);
    // 地面に落ちる火の円
    const floor = ctx.createRadialGradient(lx2, GROUND_Y, 4, lx2, GROUND_Y, 90);
    floor.addColorStop(0, 'rgba(255,160,40,0.18)');
    floor.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = floor;
    ctx.fillRect(lx2 - 100, GROUND_Y - 4, 200, 20);
  } else {
    // 昼でも淡いヴィネットでシネマ感
    const g = ctx.createRadialGradient(W/2, H*0.45, 120, W/2, H*0.5, 520);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(20,30,50,0.18)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // キャンプHPバー
  drawBar(wx(-30), GROUND_Y + 18, 60, 6, structures.campfire.hp / structures.campfire.maxHp, '#e85', '#333');
  ctx.fillStyle = '#ccc';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('部室', wx(0), GROUND_Y + 36);

  ctx.restore(); // shake

  // 画面フラッシュ（シェイク外＝HUDに被せる）
  if (state.flashT > 0) {
    ctx.globalAlpha = Math.min(1, state.flashT * 4) * 0.85;
    ctx.fillStyle = state.flashColor || 'rgba(255,255,255,0.35)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // 夜明けの感動オーバーレイ
  if (state.dawnFxT > 0) {
    const p = 1 - state.dawnFxT / 3.8;
    ctx.globalAlpha = Math.min(0.4, (1 - Math.abs(p - 0.35)) * 0.5);
    const dg = ctx.createLinearGradient(0, 0, 0, H);
    dg.addColorStop(0, 'rgba(255,180,100,0.35)');
    dg.addColorStop(0.5, 'rgba(255,220,160,0.08)');
    dg.addColorStop(1, 'rgba(255,140,80,0)');
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // クリア演出オーバーレイ
  if (state.winFxT > 0) {
    const p = 1 - state.winFxT / 5.5;
    ctx.globalAlpha = Math.min(0.4, p * 0.45);
    const wg = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, 320);
    wg.addColorStop(0, 'rgba(255,215,0,0.55)');
    wg.addColorStop(1, 'rgba(255,107,157,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H);
    // スローモ感のレターボックス
    if (state.slowMoT > 0) {
      ctx.globalAlpha = Math.min(0.55, state.slowMoT * 0.35);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, 28);
      ctx.fillRect(0, H - 28, W, 28);
    }
    ctx.globalAlpha = 1;
  } else if (state.slowMoT > 0 && state.dawnFxT > 0) {
    ctx.globalAlpha = Math.min(0.4, state.slowMoT * 0.25);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, 18);
    ctx.fillRect(0, H - 18, W, 18);
    ctx.globalAlpha = 1;
  }
}

function drawBar(x, y, w, h, ratio, fg, bg) {
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
  ctx.strokeStyle = '#000';
  ctx.strokeRect(x, y, w, h);
}


function drawParallaxHills(phase) {
  const night = (phase != null ? phase : (state.isNight ? 0.85 : 0.35)) >= 0.68;
  const dusk = phase != null && phase > 0.5 && phase < 0.72;
  const bands = [
    { col: night ? '#0e1418' : dusk ? '#4a5a40' : '#3a6a4a', par: 0.12, h: 78 },
    { col: night ? '#152018' : dusk ? '#5a7048' : '#4a8055', par: 0.24, h: 54 },
    { col: night ? '#1c2a22' : dusk ? '#6a8850' : '#5a9458', par: 0.38, h: 36 },
    { col: night ? '#243428' : dusk ? '#7a9a58' : '#6aaa60', par: 0.52, h: 22 },
  ];
  for (const b of bands) {
    ctx.fillStyle = b.col;
    for (let i = -4; i < 10; i++) {
      const base = i * 220 - (state.cameraX * b.par) % 220;
      // pixel stepped hill
      for (let px = 0; px < 240; px += 4) {
        const rise = Math.sin((px + i * 40) * 0.03) * b.h + b.h * 0.4;
        const top = GROUND_Y - rise;
        ctx.fillRect((base + px) | 0, top | 0, 4, (GROUND_Y - top) | 0);
      }
    }
  }
  // 遠景木（ドット）
  ctx.fillStyle = night ? '#1a2818' : '#2a5530';
  for (let i = -2; i < 12; i++) {
    const tx = ((i * 160 - state.cameraX * 0.35) % (W + 160));
    const x = tx - 40;
    drawPixelRect(x + 6, GROUND_Y - 40, 4, 20, night ? '#2a1a10' : '#4a3020');
    blitPixels(x, GROUND_Y - 58, ['..VvV.','vVVVVv','.VVVV.','.vVVv.'], PAL, 3, false);
  }
}

function drawGroundTiles(phase) {
  const night = (phase != null ? phase : (state.isNight ? 0.85 : 0.35)) >= 0.68;
  const dusk = phase != null && phase > 0.52 && phase < 0.72;
  drawPixelRect(0, GROUND_Y, W, H - GROUND_Y, night ? '#1e1812' : dusk ? '#4a3828' : '#5c4030');
  const off = ((state.cameraX | 0) % 8);
  const step = GFX.grassDense ? 6 : 10;
  for (let x = -off; x < W + 8; x += 8) {
    const worldX = x + (state.cameraX|0);
    const row = (worldX / 8 | 0);
    const top = night ? '#2f4a28' : (row % 3 === 0 ? '#5a9a40' : '#4a8a38');
    const mid = night ? '#3a3020' : '#6b8f3a';
    drawPixelRect(x, GROUND_Y, 8, 3, top);
    drawPixelRect(x, GROUND_Y + 3, 8, 5, mid);
    // 草ゆれ（風）
    const wind = Math.sin(state.animT * 2.4 + worldX * 0.08) * 2 + (state.wind || 0) * 0.9
      + Math.sin(state.animT * 4.1 + worldX * 0.03) * 1;
    if (row % (GFX.grassDense ? 2 : 3) === 0) {
      const gh = 5 + (row % 3);
      const col = night ? '#3a5a30' : (row % 5 === 0 ? '#7aba50' : '#6aaa48');
      drawPixelRect(x + 2 + wind, GROUND_Y - gh, 2, gh, col);
      drawPixelRect(x + 5 + wind * 0.7, GROUND_Y - gh - 2, 1, gh + 2, night ? '#2a4a28' : '#8aca60');
      // 穂先
      if (GFX.grassDense && row % 4 === 0) drawPixelRect(x + 2 + wind, GROUND_Y - gh - 2, 2, 2, '#c8e080');
    }
    // 小石
    if (row % 11 === 0) drawPixelRect(x + 3, GROUND_Y + 1, 2, 2, night ? '#3a3028' : '#7a6a50');
  }
  drawPixelRect(0, GROUND_Y + 8, W, 2, night ? '#1a140e' : '#3a2818');
  if (GFX.water) drawPond(phase);
}

function drawPond(phase) {
  // 部室東側の小さな水面（ワールド x≈90）
  const pondX = wx(96);
  const pondY = GROUND_Y - 2;
  const night = (phase || 0) >= 0.68;
  if (GFX.quality === 'low') {
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = night ? '#1e3248' : '#468cb0';
    ctx.beginPath();
    ctx.ellipse(pondX, pondY, 34, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#e8f8ff';
    ctx.fillRect(pondX - 10, pondY - 2, 16, 1);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(pondX, pondY, 38, 8, 0, 0, Math.PI * 2);
  ctx.clip();
  const wg = ctx.createLinearGradient(pondX, pondY - 10, pondX, pondY + 10);
  wg.addColorStop(0, night ? 'rgba(30,50,80,0.85)' : 'rgba(70,140,180,0.75)');
  wg.addColorStop(1, night ? 'rgba(20,40,60,0.9)' : 'rgba(40,100,140,0.85)');
  ctx.fillStyle = wg;
  ctx.fillRect(pondX - 40, pondY - 12, 80, 24);
  // きらめき
  ctx.globalAlpha = 0.45;
  for (let i = 0; i < (GFX.quality === 'low' ? 3 : 6); i++) {
    const sx = pondX - 28 + ((state.animT * 18 + i * 13) % 56);
    const sy = pondY - 2 + Math.sin(state.animT * 3 + i) * 2;
    ctx.fillStyle = '#e8f8ff';
    ctx.fillRect(sx, sy, 3, 1);
  }
  // たき火色の反射（夜）
  if (night || state.isNight) {
    const rg = ctx.createRadialGradient(wx(0), pondY, 4, pondX, pondY, 50);
    rg.addColorStop(0, 'rgba(255,160,60,0.22)');
    rg.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = rg;
    ctx.fillRect(pondX - 40, pondY - 10, 80, 20);
  } else {
    // 空の淡い反射帯
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#fff8d0';

// ---------- ロケバス／聖地／攻勢 ----------
function startLocationBus(fromXOrCamp, toId, quiet, mode) {
  const L = landmarkById(toId);
  if (!L || state.bus) return false;
  const fromX = (fromXOrCamp === 0 || fromXOrCamp == null) ? 0 : +fromXOrCamp;
  const cargo = [];
  for (const w of workers) {
    if (cargo.length >= 2) break;
    if (Math.abs(w.x - fromX) < 160 || Math.abs(w.x - L.x) < 160) cargo.push(w);
  }
  state.bus = {
    mode: mode || 'civil',
    x: fromX, tx: L.x,
    fromId: fromX === 0 ? 'camp' : null,
    toId: L.id, t: 0, cargo, returning: false, opId: null,
  };
  if (!quiet) {
    toast(pick(LORE.busDepart));
    story(`【内政】ロケバス　→${L.short}`, 2.0);
    spawnMeme(fromX, GROUND_Y - 55, 'バス!');
  }
  return true;
}

function startRaidBus(opId) {
  const op = (state.outposts || []).find(o => o.id === opId && !o.cleared);
  if (!op || state.bus) return false;
  const cargoW = workers.filter(w => Math.abs(w.x) < 200 || Math.abs(w.x - op.x) < 200).slice(0, 2);
  const vans = units.filter(u => u.role === 'vanguard');
  state.bus = {
    mode: 'raid',
    x: 0, tx: op.x,
    fromId: 'camp', toId: opId, t: 0,
    cargo: cargoW, vans, returning: false, opId: op.id,
  };
  toast(pick(LORE.assaultOpen));
  story(`【軍事】侵攻バス　→${op.short}`, 2.2);
  spawnMeme(0, GROUND_Y - 55, '侵攻!');
  screenFlash('rgba(255,80,40,0.15)', 0.2);
  return true;
}

function damageOutpost(op, dmg) {
  if (!op || op.cleared) return;
  // 関係・軍事で実ダメージ微増
  const mul = 1 + (state.miliTier|0) * 0.05 + ((state.bond && state.bond.crew)|0) / 500;
  const real = Math.max(1, Math.round(dmg * mul));
  op.hp = Math.max(0, op.hp - real);
  toast(pick(LORE.outpostHit) + ` −${real}`, 2.2);
  spawnMeme(op.x, GROUND_Y - 60, '-' + real);
  shake(3, 0.15);
  spawnRetaliation(op, real);
  if (op.hp <= 0) clearOutpost(op);
}

function clearOutpost(op) {
  op.cleared = true;
  op.hp = 0;
  toast(pick(LORE.outpostDown), 3.0);
  story(`敵拠点破壊　${op.name}　次エリア解放`, 3.0);
  spawnMeme(op.x, GROUND_Y - 70, '破壊!');
  screenFlash('rgba(255,215,0,0.25)', 0.35);
  shake(6, 0.35);
  // 戦利品（ゲーム内コイン／銀行）
  dropCoin(op.x, 2 + state.chapter);
  state.bank += 1 + state.chapter;
  spawnMeme(op.x + 20, GROUND_Y - 50, '810+');
  // 壁押し出し
  if (op.side > 0) structures.rightWall.x = Math.max(structures.rightWall.x, op.x - 20);
  else structures.leftWall.x = Math.min(structures.leftWall.x, op.x + 20);
  // 章進行：両側（またはエンドレス片方）壊したら chapter++
  const targetCh = (op.unlockChapter != null ? op.unlockChapter : (state.chapter + 1));
  const defs = OUTPOST_DEFS.filter(d => d.unlockChapter === targetCh);
  const related = (state.outposts || []).filter(o => (o.unlockChapter | 0) === targetCh);
  const need = Math.min(2, Math.max(1, defs.length || related.length));
  const got = related.filter(o => o.cleared).length;
  if (got >= need || state.chapter >= 3) {
    if (state.chapter < targetCh) {
      state.chapter = targetCh;
      toast(`章進行　→${chapterName(state.chapter)}`, 3.2);
      story(`新ロケ解禁　${chapterName(state.chapter)}`, 2.8);
    }
  }
  bumpBond('crew', 4);
  bumpBond('town', 3);
  checkAchievements();
  ensureOutpostsForAssault();
  saveGame(true);
}

function tickLocationBus(dt) {
  const b = state.bus;
  if (!b) {
    // 内政：自動巡回（civilTier）
    if (!state.isNight && state.civilTier >= 1 && unlockedCount() > 0) {
      state.busAutoT = (state.busAutoT || 0) - dt;
      if (state.busAutoT <= 0) {
        state.busAutoT = 18 - state.civilTier * 3;
        const u = unlockedLandmarks();
        const L = u[(Math.random() * u.length) | 0];
        if (L) startLocationBus(0, L.id, true, 'civil');
      }
    }
    return;
  }
  b.t += dt;
  const speed = b.mode === 'raid' ? 190 : 160;
  const dir = Math.sign(b.tx - b.x) || 1;
  b.x += dir * speed * dt;
  for (const w of (b.cargo || [])) w.x = b.x;
  if ((dir > 0 && b.x >= b.tx) || (dir < 0 && b.x <= b.tx)) {
    b.x = b.tx;
    if (b.mode === 'raid') {
      const op = (state.outposts || []).find(o => o.id === b.opId);
      if (op && !op.cleared) {
        let dmg = 10 + (state.miliTier | 0) * 3 + (b.vans || []).length * 8;
        dmg += Math.min(6, units.filter(u => u.role === 'gun').length);
        dmg += Math.min(4, (b.cargo || []).length * 2);
        damageOutpost(op, dmg);
      }
      // 先鋒を部室側へ戻す
      for (const v of (b.vans || [])) {
        v.x = (op && op.side > 0) ? structures.rightWall.x - 28 : structures.leftWall.x + 28;
      }
      toast(pick(LORE.busArrive));
      state.bus = null;
      return;
    }
    const L = landmarkById(b.toId);
    toast(pick(LORE.busArrive));
    if (L) {
      spawnMeme(L.x, GROUND_Y - 50, L.short);
      const bonus = facilityLv(L.id) >= 2 ? 2 : 1;
      if (Math.random() < 0.7 + (state.civilTier | 0) * 0.05) dropCoin(L.x + rand(-10, 10), bonus);
      for (const w of (b.cargo || [])) {
        w.x = L.x + rand(-24, 24);
        w.lmId = L.id;
        w.side = L.side;
      }
    }
    if (!b.returning && !state.isNight && b.toId !== 'camp') {
      b.returning = true;
      b.tx = 0;
      b.fromId = L ? L.id : null;
      b.toId = 'camp';
      b.t = 0;
      if (L) story(`【内政】バス　${L.short}→部室`, 1.6);
      return;
    }
    state.bus = null;
  }
}

  const sway = (state.wind || 0) * 0.55 + (state.isNight ? state.nightSway * 0.2 : 0);

  // 足元の影シルエット
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y + 3, wood ? 18 : 22, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  if (wood) {
    // 木壁：横ログ積み＋節＋縄帯
    for (let row = 0; row < Math.ceil(h / 6); row++) {
      const oy = GROUND_Y - (row + 1) * 6;
      const shade = row % 2 === 0 ? '#7a4a22' : '#8b5a2b';
      const hi = row % 2 === 0 ? '#a07040' : '#c09058';
      drawPixelRect(x - 14 + sway, oy, 28, 5, shade);
      drawPixelRect(x - 14 + sway, oy, 28, 1, '#3a2010');
      drawPixelRect(x - 14 + sway, oy, 1, 5, '#2a1508');
      drawPixelRect(x + 13 + sway, oy, 1, 5, '#2a1508');
      // 木目ハイライト
      drawPixelRect(x - 10 + sway + (row % 3) * 4, oy + 1, 6, 1, hi);
      // 節
      if (row % 3 === 1) drawPixelRect(x - 2 + sway, oy + 2, 2, 2, '#4a2810');
    }
    // 縄バンド
    for (const by of [GROUND_Y - 18, GROUND_Y - 40]) {
      drawPixelRect(x - 15 + sway, by, 30, 3, '#c9a227');
      drawPixelRect(x - 15 + sway, by + 1, 30, 1, '#ffe566');
    }
    // 簡易歯（尖塔）
    for (let i = 0; i < 5; i++) {
      const bx = x - 14 + i * 6 + sway;
      blitPixels(bx, GROUND_Y - h - 8, ['.T.','TTT','tTt'], PAL, 2, false);
    }
  } else {
    // 石壁：煉瓦目地＋苔＋狭間
    const brickW = 5, brickH = 4;
    const rows = Math.ceil(h / brickH);
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < 7; col++) {
        const ox = x - 16 + col * brickW + (row % 2) * 2;
        const oy = GROUND_Y - (row + 1) * brickH;
        const n = (row * 7 + col) % 5;
        const shade = n === 0 ? '#3a3a44' : n === 1 ? '#5a5a66' : n === 2 ? '#7a7a88' : n === 3 ? '#6a6a74' : '#8a8a96';
        drawPixelRect(ox + sway, oy, brickW - 1, brickH - 1, shade);
        // 目地
        drawPixelRect(ox + sway, oy + brickH - 1, brickW, 1, '#1a1a22');
        if ((row + col) % 6 === 0) drawPixelRect(ox + sway + 1, oy + 1, 1, 1, '#c8c8d8');
        // 苔（下側）
        if (row < 3 && (col + row) % 4 === 0) drawPixelRect(ox + sway, oy + 2, 3, 1, '#3a6a38');
      }
    }
    // アウトライン
    drawPixelRect(x - 17 + sway, GROUND_Y - h, 1, h, '#0e0e14');
    drawPixelRect(x + 16 + sway, GROUND_Y - h, 1, h, '#0e0e14');
    // 狭間（石の歯）
    for (let i = 0; i < 5; i++) {
      const bx = x - 16 + i * 7 + sway;
      drawPixelRect(bx, GROUND_Y - h - 12, 5, 12, '#6a6a78');
      drawPixelRect(bx, GROUND_Y - h - 12, 5, 1, '#d0d0e0');
      drawPixelRect(bx + 1, GROUND_Y - h - 10, 3, 2, '#9a9aac');
    }
    // 上部の金縁アクセント
    drawPixelRect(x - 16 + sway, GROUND_Y - h, 32, 2, '#c9a227');
  }

  // 旗（風連動 + IKZO影）
  const flagWave = Math.sin(state.animT * 7 + (isLeft ? 0 : 2)) * (wood ? 3.2 : 2.4) + (state.wind || 0) * 1.8;
  const poleH = h + 28;
  drawPixelRect(x + (isLeft ? -2 : 0), GROUND_Y - poleH, 3, poleH - h + 18, '#222');
  const fx = x + (isLeft ? -22 : 4) + flagWave;
  // 旗の影
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.fillRect(fx + 2 + (state.wind || 0) * 0.6, GROUND_Y - poleH + 4, 18, 12);
  ctx.globalAlpha = 1;
  blitOutlined(fx, GROUND_Y - poleH, [
    'RRRRRRRR',
    'RrRRRRrR',
    'RRR1RRRR',
    'RrRRRRrR',
    'RRRRRRRR',
  ], PAL, 2, false);
  ctx.fillStyle = '#fff';
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'left';
  // IKZO文字も風で揺れる
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillText('IKZO', fx + 5 + (state.wind || 0) * 0.3, GROUND_Y - poleH + 13);
  ctx.fillStyle = '#fff';
  ctx.fillText('IKZO', fx + 4, GROUND_Y - poleH + 12);
  // レベルラベル
  ctx.fillStyle = wood ? '#c9a227' : '#d0d0e8';
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText(wood ? '木壁' : '石壁', x, GROUND_Y - h - 16);
  drawBar(x - 20, GROUND_Y + 10, 40, 5, wall.hp / wall.maxHp, wood ? '#8c4' : '#4cf', '#333');
}

function drawCoin(x, y) {
  const bob = Math.sin(state.animT * 6 + x * 0.05) * 2;
  const yy = y + bob;
  // 微光
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(x, yy - 2, 7 + Math.sin(state.animT * 5) * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  drawPixelRect(x - 4, yy - 8, 8, 8, '#c9a227');
  drawPixelRect(x - 3, yy - 7, 6, 6, '#ffd700');
  drawPixelRect(x - 1, yy - 5, 2, 2, '#fff8c8');
}

function drawYajyu(x, y, facing) {
  ctx.imageSmoothingEnabled = false;
  const walking = Math.abs(player.vx) > 10 || state.titleCine;
  const fi = walking && !state.titleCine ? frameIndex(9, FR_WALK.length) : frameIndex(2, FR_IDLE.length);
  const bob = (walking && !state.titleCine) ? (fi % 2) : Math.sin(state.animT * 2.2) * 0.7;
  const flip = facing < 0;
  const body = (walking && !state.titleCine) ? FR_WALK[fi] : FR_IDLE[fi % FR_IDLE.length];
  blitOutlined(x - 16, y - 44 + bob, body, PAL, 2, flip);
  if (SPR.senpai) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(SPR.senpai, x - 18, y - 62 + bob, 36, 36);
  }
  // リーゼントシルエット（野獸先輩）
  const hx = flip ? -1 : 1;
  blitOutlined(x - 12, y - 58 + bob, [
    '..KKKK.',
    '.KKKkKK',
    'KKkKKKK',
    '.KKKKK.',
    '..K.K..',
  ], Object.assign({}, PAL, { K: '#1a1210', k: '#3a2820' }), 2, flip);
  // 前髪ツヤ
  drawPixelRect(x + hx * 2, y - 56 + bob, 3, 2, '#4a3830');
  drawPixelRect(x + hx * 4, y - 54 + bob, 2, 1, '#6a5040');

  // 王冠（王道を征く）＋きらめき
  const cy = y - 70 + bob;
  blitOutlined(x - 12, cy, [
    '.G.G.G.G.',
    'GgGgGgGgG',
    'GGGUUGGGG',
    '.GGGGGGG.',
    '..G...G..',
  ], PAL, 2, false);
  // 宝石点滅
  if (Math.sin(state.animT * 8) > 0.2) {
    drawPixelRect(x - 1, cy + 4, 3, 3, '#fff');
    drawPixelRect(x - 8, cy + 2, 2, 2, '#ff6b9d');
    drawPixelRect(x + 6, cy + 2, 2, 2, '#8af');
  }
  // 王冠グロー
  if (GFX.quality !== 'low' || state.titleCine) {
    const pulse = 0.2 + Math.sin(state.animT * 3) * 0.1;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(x, cy + 6, 14 + Math.sin(state.animT * 2) * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // 汗のきらめき
  if (state.humidity >= 55 || state.titleCine) {
    const sweaty = state.humidity >= 70 || state.titleCine;
    if (sweaty && Math.sin(state.animT * 10 + x) > 0.15) {
      drawPixelRect(x + (flip ? -12 : 10), y - 34 + bob, 2, 4, '#8cf');
      drawPixelRect(x + (flip ? -8 : 6), y - 28 + bob, 2, 3, '#dff');
      drawPixelRect(x + (flip ? -14 : 12), y - 40 + bob, 1, 2, '#fff');
    }
  }
  if (state.gazeT > 0) {
    ctx.strokeStyle = 'rgba(255,60,60,0.6)';
    ctx.strokeRect(x - 20, y - 72, 40, 72);
  }
}

function drawArcher(x, y, u) {
  ctx.imageSmoothingEnabled = false;
  if (u.role === 'vanguard') {
    const bob = Math.sin(state.animT * 4 + (u.x || 0) * 0.05) * 1.2;
    drawPixelRect(x - 10, y - 30 + bob, 20, 30, '#5a2a18');
    drawPixelRect(x - 12, y - 34 + bob, 24, 6, '#c9a227');
    drawPixelRect(x + 6, y - 28 + bob, 4, 18, '#888');
    ctx.fillStyle = '#ff6b9d';
    ctx.font = '5px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('先鋒', x, y - 40 + bob);
    if (SPR.kohai) ctx.drawImage(SPR.kohai, x - 12, y - 48 + bob, 24, 24);
    return;
  }
  const shooting = (u._shotFlash || 0) > 0;
  const fi = shooting ? 3 : frameIndex(4, FR_ARCH.length);
  const bob = Math.sin(state.animT * 3 + (u.x || 0) * 0.05) * 0.7 + state.nightSway * 0.2;
  blitOutlined(x - 16, y - 36 + bob, FR_ARCH[fi], PAL, 2, u.side === 'left');
  if (SPR.kohai) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(SPR.kohai, x - 14, y - 52 + bob, 28, 28);
  }
  if ((u.tier | 0) > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '5px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('T' + (u.tier | 0), x, y - 56 + bob);
  }
  ctx.strokeStyle = '#c8a060';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const bowX = u.side === 'left' ? x - 12 : x + 12;
  ctx.arc(bowX, y - 22 + bob, 9, -1.1, 1.1);
  ctx.stroke();
  if (shooting) {
    drawPixelRect(bowX - 3, y - 24 + bob, 8, 2, '#fff8e0');
    blitPixels(bowX - 2, y - 28 + bob, ['Y','F'], PAL, 2, false);
  }
  ctx.fillStyle = '#8af';
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('砲台', x, y - 56 + bob);
}

function drawEnemy(x, y, e) {
  ctx.imageSmoothingEnabled = false;
  const fi = frameIndex(e.isKoko ? 10 : 6, 4);
  const stunBob = e.stunned > 0 ? Math.sin(state.animT * 22) * 2 : 0;
  let frames = FR_ENEMY;
  if (e.isGaze) frames = FR_GAZE;
  else if (e.isTaka) frames = FR_TAKA;
  else if (e.isTono) frames = FR_TONO;
  else if (e.isNgimo) frames = FR_NGIMO;
  else if (e.isKoko) frames = FR_KOKO;
  else if (e.isMur) frames = FR_MUR;
  if (e._flash > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; }
  blitOutlined(x - 16, y - 36 + stunBob, frames[fi % frames.length], PAL, 2, e.side > 0);
  if (e._flash > 0) {
    ctx.globalAlpha = Math.min(0.7, e._flash * 5);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 14, y - 36 + stunBob, 28, 32);
    ctx.restore();
  }
  // 遠野笑顔は顔スプライト
  if (e.isTono && SPR.tono) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(SPR.tono, x - 14, y - 52 + stunBob, 28, 28);
  }
  if (e.isGaze || e.isMur || (e.isBoss && state.bossCineT > 0)) {
    ctx.globalAlpha = 0.28 + Math.sin(state.animT * 8) * 0.12;
    ctx.fillStyle = e.isMur ? '#33ffee' : '#f44';
    ctx.fillRect(x - 48, y - 30, 96, 2);
    ctx.globalAlpha = 1;
  }
  if (e.isBoss) {
    // 王冠風シルエット
    drawPixelRect(x - 8, y - 52, 16, 3, '#ffd700');
    drawPixelRect(x - 6, y - 56, 3, 4, '#ffd700');
    drawPixelRect(x - 1, y - 58, 3, 6, '#fff8c8');
    drawPixelRect(x + 4, y - 56, 3, 4, '#ffd700');
    if (state.bossCineT > 0) {
      ctx.globalAlpha = 0.4 + Math.sin(state.animT * 12) * 0.2;
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(x - 10, y - 42, 4, 3);
      ctx.fillRect(x + 6, y - 42, 4, 3);
      ctx.globalAlpha = 1;
    }
  }
  if (e.isKoko) {
    ctx.fillStyle = '#44ddff';
    ctx.font = '8px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('↑', x - 10, y - 50 + Math.sin(state.animT * 12) * 3);
    ctx.fillStyle = '#ff44aa';
    ctx.fillText('↓', x + 10, y - 44 + Math.cos(state.animT * 12) * 3);
  }
  if (e.stunned > 0) {
    ctx.fillStyle = '#ff6b9d';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('（）', x, y - 54);
  }
  ctx.fillStyle = e.isTaka ? '#ff8' : e.isMur ? '#33ffee' : e.isTono ? '#ffe066' : '#f88';
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText(e.name, x, y - 48 + stunBob);
  drawBar(x - 14, y + 4, 28, 3, e.hp / e.maxHp, '#f44', '#333');
}
</script>
