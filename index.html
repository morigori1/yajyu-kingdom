// ---------- 更新 ----------
let last = performance.now();
function loop(now) {
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  // ヒットストップ／スローモ（感情演出）— 実時間で減衰
  if (state.hitStop > 0) state.hitStop -= raw;
  if (state.slowMoT > 0) state.slowMoT -= raw;
  if (state.dawnFxT > 0) state.dawnFxT -= raw;
  if (state.clearPillarT > 0) state.clearPillarT -= raw;
  const scale = state.hitStop > 0 ? 0.15 : (state.slowMoT > 0 ? 0.42 : 1);
  const dt = raw * scale;
  // 最低限の移動は update の try 外（例外で移動が死なない）
  if (state.running && !state.over) {
    try { updateMoveEssential(dt); } catch (_) {}
  }
  try {
    if (state.running && !state.over) update(dt);
    else {
      tickPresentation(dt, raw);
      if (state.titleCine) {
        state.cameraX = Math.sin(state.animT * 0.25) * 70 + Math.sin(state.animT * 0.07) * 30;
        state.nightSway = Math.sin(state.animT * 1.2) * 1.2;
      }
    }
  } catch (err) {
    if (!state._updErrLogged) {
      state._updErrLogged = true;
      try { console.error('update error', err); } catch (_) {}
    }
  }
  // 音：BGMモード同期（約1.2秒ごと・既存ループ非阻害）
  if (typeof audSyncBgm === 'function') {
    if (!AUD._syncAt) AUD._syncAt = 0;
    if (now - AUD._syncAt > 1200) { AUD._syncAt = now; try { audSyncBgm(false); } catch (_) {} }
  }
  try { draw(); } catch (err) {
    if (!state._drawErrLogged) {
      state._drawErrLogged = true;
      try { console.error('draw error', err); } catch (_) {}
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function tickPresentation(dt, rawDt) {
  const r = rawDt != null ? rawDt : dt;
  if (state.shakeT > 0) state.shakeT -= r;
  else state.shakeMag = 0;
  if (state.flashT > 0) state.flashT -= r;
  if (state.skillRingT > 0) state.skillRingT -= r;
  if (state.winFxT > 0) state.winFxT -= r;
  // タイトル導入：徐々に夜が明ける
  if (state.titleCine && !state.running) {
    state.titleDawn = Math.min(1, (state.titleDawn || 0) + r * 0.11);
    const ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('hidden')) {
      if (state.titleDawn > 0.35) ov.classList.add('cine-dawn');
      else ov.classList.remove('cine-dawn');
    }
    // 王冠きらめき粒子（低頻度）
    if (GFX.quality !== 'low' && Math.random() < 0.08 * r * 60) {
      pushFx({
        type: 'spark', x: player.x + rand(-10, 10), y: GROUND_Y - 70 + rand(-6, 4),
        vx: rand(-20, 20), vy: rand(-50, -10), t: 0, life: 0.5,
        color: pick(['#ffd700', '#fff8c8', '#fff']), size: 2,
      });
    }
  }
  state.animT += dt;
  tickWindWeather(dt);
  spawnMistAmbient(dt);
  const emberChance = (state.isNight ? 0.35 : 0.12) * (GFX.emberMul || 1);
  if (Math.random() < emberChance * dt * 60) {
    pushFx({
      type: 'spark', x: rand(-8, 8), y: GROUND_Y - rand(24, 40),
      vx: rand(-20, 20), vy: rand(-70, -30),
      t: 0, life: rand(0.4, 0.9),
      color: pick(['#ffcc33', '#ff6600', '#ffe566', '#fff']),
      size: 2,
    });
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.t += dt;
    if (f.type === 'pay') {
      const p = Math.min(1, f.t / f.life);
      f.x = f.x + (f.tx - f.x) * p;
    }
    if (f.type === 'dot' || f.type === 'spark' || f.type === 'trail') {
      f.x += (f.vx || 0) * dt;
      f.y += (f.vy || 0) * dt;
      if (f.type !== 'trail') f.vy = (f.vy || 0) + (f.type === 'spark' ? 200 : 120) * dt;
    }
    if (f.type === 'mist' || f.type === 'ember') {
      f.x += (f.vx || 0) * dt;
      f.y += (f.vy || 0) * dt;
    }
    if (f.type === 'paren') f.y -= 22 * dt;
    if (f.type === 'slash') { f.x += (f.vx || 0) * dt; }
    if (f.t >= (f.life || 1)) fx.splice(i, 1);
  }
  for (const e of enemies) { if (e._flash > 0) e._flash -= dt; }
  for (const u of units) { if (u._shotFlash > 0) u._shotFlash -= dt; }
}

function updateMoveEssential(dt) {
  // 移動・カメラ・向き — update 例外でも必ず動く
  if (state.dungeon) { try { updateDungeonMove(dt); } catch (_) { state.dungeon = null; } return 0; }
  if (state.bus && state.bus.carryPlayer) {
    player.x = state.bus.x;
    player.vx = 0;
    const lookB = (player.facing || 1) * 36;
    const targetCamB = player.x - W / 2 + lookB;
    state.cameraX += (targetCamB - state.cameraX) * Math.min(1, dt * 4.2);
    return 0;
  }
  let input = 0;
  try {
    if (keys['ArrowLeft'] || keys['KeyA'] || touchMove.left) input -= 1;
    if (keys['ArrowRight'] || keys['KeyD'] || touchMove.right) input += 1;
  } catch (_) {}
  player.vx = input * (player.speed || 160) * (typeof playerSpeedMul === 'function' ? playerSpeedMul() : 1);
  if (input) player.facing = input;
  player.x += player.vx * dt;
  const lb = (world && world.leftBound != null) ? world.leftBound + 40 : -2000;
  const rb = (world && world.rightBound != null) ? world.rightBound - 40 : 2000;
  player.x = clamp(player.x, lb, rb);
  // animT は tickPresentation 側のみ
  const look = (player.facing || 1) * 36;
  const breath = Math.sin(state.animT * 0.55) * 2.5;
  const targetCam = player.x - W / 2 + look + breath;
  state.cameraX += (targetCam - state.cameraX) * Math.min(1, dt * 4.2);
  return input;
}

function update(dt) {
  if (state.dungeon) { try { updateDungeon(dt); } catch (e) { state.dungeon = null; } return; }
  try { updateExplore(dt); } catch (_) {}
  try { updateEx2(dt); } catch (_) {}
  try { updateAdv(dt); } catch (_) {}
  if (state._payLock > 0) state._payLock -= dt;
  try { tickMounts(dt); } catch (_) {}
  try { tickNestQueue(dt); } catch (_) {}
  // 昼夜
  state.dayTimer += dt;
  if (!state.isNight && state.running && !state.over) {
    const remainD = (state.dayLength || 52) - state.dayTimer;
    if (remainD < 7 && remainD > 0) { try { beginDuskRaid(); } catch (_) {} }
  }
  const len = state.isNight ? state.nightLength : state.dayLength;
  if (state.dayTimer >= len) {
    if (state.isNight) {
      // 朝へ
      enemies.length = 0; // 残敵逃走
      try { fileBattleReport(); } catch (_) {}
      state.day++;
      startDay();
      winCheck();
    } else {
      startNight();
    }
  }

  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) document.getElementById('toast').classList.remove('show');
  }
  if (storyTimer > 0) {
    storyTimer -= dt;
    if (storyTimer <= 0) {
      const s = document.getElementById('story');
      if (s) s.classList.remove('show');
    }
  }

  // 独自メカ＆アニメ時刻（animT / 風は tickPresentation）
  state.nightSway = state.wind * 1.1 + (state.isNight ? Math.sin(state.animT * 1.7) * 0.4 : 0);
  if (state.bossCineT > 0) {
    state.bossCineT -= dt;
    const tx = state.bossCineX * 0.55;
    state.cameraX += (tx - state.cameraX) * Math.min(1, dt * 3.2);
  }
  if (state.skillCd > 0) state.skillCd -= dt;
  if (state.skillStunT > 0) state.skillStunT -= dt;
  if (state.gazeT > 0) state.gazeT -= dt;
  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.killCombo = 0;
  }
  // 昼ミニ選択（Day2以降・遅め・選択中も移動可）
  if (!state.isNight && !state.dayChoiceDone && (state.day | 0) >= 2) {
    const choiceAt = Math.max(28, Math.min(40, (state.dayLength || 52) * 0.48));
    if (state.dayTimer >= choiceAt) {
      openDayChoice();
      // returnしない：パネル表示中も移動・カメラ更新を継続
    }
  }
  // 湿度：移動で上昇、静止＋部室近傍で低下、夜は上昇速め
  const nearCamp = Math.abs(player.x) < 70;
  const moving = Math.abs(player.vx) > 10 || (keys['ArrowLeft']||keys['KeyA']||touchMove.left||keys['ArrowRight']||keys['KeyD']||touchMove.right);
  // note: player.vx set below — use input preview
  let humidRate = state.isNight ? 1.8 : 1.1;
  // 仮: 下で再計算するためフラグのみ。本計算は移動後

  // 移動本体は updateMoveEssential（loop側・try外）。ここは湿度用 input のみ
  let input = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || touchMove.left) input -= 1;
  if (keys['ArrowRight'] || keys['KeyD'] || touchMove.right) input += 1;

  // 湿度本計算（真夏Evt倍率）
  const hMul = heatHumidTickMul();
  if (Math.abs(input) > 0) state.humidity += humidRate * dt * (state.isNight ? 1.35 : 1) * hMul * ((state.explorePerks && state.explorePerks.humid) ? 0.85 : 1);
  else if (nearCamp) state.humidity -= 3.2 * dt * (state.heatEvent === 'mugicha_day' ? 1.3 : 1);
  else state.humidity -= 0.35 * dt;
  // 敵近接で汗
  for (const e of enemies) {
    if (Math.abs(e.x - player.x) < 90) { state.humidity += 2.2 * dt * hMul; break; }
  }
  state.humidity = clamp(state.humidity, 0, 100);
  tickHeatRisk(dt, Math.abs(input) > 0);
  if ((Math.floor(state.animT * 4) % 4) === 0) updateHumidityHud();

  // 通常カメラは updateMoveEssential。bossCine のみ上書き可（上記）

  // ambientミーム（たき火周辺）
  if (!state._memeCd) state._memeCd = 0;
  state._memeCd -= dt;
  if (state._memeCd <= 0) {
    state._memeCd = state.isNight ? 4.5 : 7;
    const lines = state.isNight
      ? ['見とけよ', 'ファッ!?', 'ンアッー', 'キタ!', '114514', '来るな']
      : ['いいゾ〜これ', 'やりますねぇ', '王道を征く', '114514', '810', 'こ↑こ↓', 'おかのした', 'あっ（察し）'];
    spawnMeme(rand(-40, 40), GROUND_Y - 54, pick(lines));
  }

  // コイン物理＆拾い
  for (let i = coinsOnGround.length - 1; i >= 0; i--) {
    const c = coinsOnGround[i];
    c.age += dt;
    c.pickupDelay = Math.max(0, c.pickupDelay - dt);
    c.vy += 400 * dt;
    c.y += c.vy * dt;
    if (c.y >= GROUND_Y - 8) {
      c.y = GROUND_Y - 8;
      if (Math.abs(c.vy) > 30) c.vy *= -0.35;
      else c.vy = 0;
    }
    if (c.pickupDelay <= 0 && Math.abs(c.x - player.x) < 22 && Math.abs(c.y - (GROUND_Y - 10)) < 30) {
      state.coins++;
      spawnCoinSparkle(c.x, c.y);
      coinsOnGround.splice(i, 1);
      try { if (typeof audPlay === 'function') audPlay('coin'); } catch (_) {}
      spawnFloat(c.x, c.y - 12, '+1', '#ffe566');
      pushFx({ type: 'pay', x: c.x, y: c.y, tx: player.x, ty: GROUND_Y - 36, t: 0, life: 0.28 });
      if (Math.random() < 0.28) spawnMeme(player.x + 20, GROUND_Y - 50, pick(LORE.coinPickup));
    }
  }

  // 作業員後輩（昼の収入）
  if (!state.isNight) {
    for (const w of workers) {
      w.workCd = (w.workCd || 0) - dt;
      // 解放聖地／部室のあいだをロケ往復（徒歩片鱗／バスは別途）
      const u = unlockedLandmarks();
      let home = 0;
      if (w.lmId && state.landmarks[w.lmId]) {
        const Lm = landmarkById(w.lmId);
        if (Lm) home = Lm.x;
      } else if (u.length) {
        const pool = u.filter(x => (w.side || 0) === 0 || x.side === w.side);
        const pickL = (pool.length ? pool : u)[0];
        home = pickL ? pickL.x : 0;
        if (pickL) w.lmId = pickL.id;
      }
      // ロケバス搭乗中は座標をバスに追従
      if (state.bus && state.bus.cargo && state.bus.cargo.includes(w)) {
        w.x = state.bus.x;
      } else {
        const target = home + Math.sin(state.animT * 0.6 + (w.bob || 0)) * 36;
        w.x += (target - w.x) * Math.min(1, dt * 1.4);
      }
      if (w.workCd <= 0) {
        const job = w.job || 'gather';
        w.workCd = (job === 'supply' ? 5.5 : job === 'cheer' ? 6.0 : job === 'film' ? 5.0 : 4.5) + rand(0, 2);
        if (job === 'supply') {
          // 補給線：物資蓄積＋壁微回復＋熱中症↓
          if ((state.supplyStock | 0) < 5 && Math.random() < 0.55 + (state.civilTier|0) * 0.08) {
            state.supplyStock = Math.min(5, (state.supplyStock | 0) + 1);
            spawnMeme(w.x, GROUND_Y - 40, '補給+');
            if ((state.supplyStock | 0) >= 3) checkAchievements();
          }
          const tgtLm = state.supplyLmId || w.lmId;
          if (tgtLm) w.lmId = tgtLm;
          for (const wall of [structures.leftWall, structures.rightWall]) {
            if (wall.level >= 1 && wall.hp < wall.maxHp && Math.random() < 0.45) {
              wall.hp = Math.min(wall.maxHp, wall.hp + 3);
            }
          }
          if (Math.random() < 0.42) {
            state.heatRisk = clamp((state.heatRisk | 0) - 2, 0, 100);
          }
          if (Math.random() < 0.2) bumpBond('town', 1);
        } else if (job === 'film') {
          if (Math.random() < 0.4) {
            state.filmShots = (state.filmShots | 0) + 1;
            spawnMeme(w.x, GROUND_Y - 40, '📷');
            if (Math.random() < 0.35) bumpBond('crew', 1);
            try {
              if (state.mission && state.mission.kind === 'film') {
                state.mission.progress = Math.min(state.mission.need|0, (state.mission.progress|0) + 1);
              }
            } catch (_) {}
          } else {
            spawnMeme(w.x, GROUND_Y - 40, 'ロケ');
          }
        } else if (job === 'cheer') {
          spawnMeme(w.x, GROUND_Y - 40, pick(['応援!', 'やりますねぇ', 'ホラホラ']));
          if (Math.random() < 0.25) bumpBond('kohai', 1);
          // 隣接砲のクール微短縮
          for (const u of units) {
            if ((u.role || 'gun') === 'vanguard') continue;
            if (Math.abs(u.x - w.x) < 90) u.cooldown = Math.max(0, (u.cooldown || 0) - 0.15);
          }
        } else {
          // 集金後輩（TD）
          const pay = 1 + (facilityLv(w.lmId) >= 2 ? 1 : 0) + ((state.civilTier | 0) >= 2 && Math.random() < 0.35 ? 1 : 0) + (Math.random() < bondMul('kohai') - 1 ? 1 : 0);
          if (Math.random() < 0.55) {
            dropCoin(w.x + rand(-12, 12), pay);
          } else {
            state.coins += pay;
            spawnMeme(w.x, GROUND_Y - 40, pick(LORE.workerWork));
          }
        }
        if (Math.random() < 0.25) pushFx({
          type: 'spark', x: w.x, y: GROUND_Y - 20, vx: rand(-10,10), vy: -40,
          t: 0, life: 0.4, color: job === 'supply' ? '#8cf' : job === 'cheer' ? '#f8a' : '#ffd700', size: 2,
        });
      }
    }
  } else {
    // 夜は部室付近に退避
    for (const w of workers) {
      w.x += (rand(-30, 30) - w.x) * dt * 0.8;
    }
  }

  // 軍事ユニット（砲台／先鋒）
  for (const u of units) {
    if (u._shotFlash > 0) u._shotFlash -= dt;
    const wall = u.side === 'left' ? structures.leftWall : structures.rightWall;
    if (u.role === 'vanguard') {
      // 先鋒は壁より外側で待機（侵攻時にバスへ）
      const ideal = wall.x + (u.side === 'left' ? -28 : 28);
      u.x += (ideal - u.x) * dt * 2.2;
      continue;
    }
    const ideal = wall.x + (u.side === 'left' ? 16 : -16);
    u.x += (ideal - u.x) * dt * 2;
    u.cooldown -= dt;
    if (u.cooldown <= 0 && state.isNight) {
      let best = null, bestD = 280 + (u.tier | 0) * 40 + (state.miliTier | 0) * 20;
      for (const e of enemies) {
        const d = Math.abs(e.x - u.x);
        if (d < bestD && ((u.side === 'left' && e.x <= u.x + 40) || (u.side === 'right' && e.x >= u.x - 40) || d < 200)) {
          best = e; bestD = d;
        }
      }
      if (!best) {
        for (const e of enemies) {
          const d = Math.abs(e.x - u.x);
          if (d < bestD) { best = e; bestD = d; }
        }
      }
      if (best) {
        const spd = 240 + (u.tier | 0) * 35 + (state.awakenA ? 40 : 0);
        const vx = (best.x - u.x) > 0 ? spd : -spd;
        const iced = state.awakenB === 'iced';
        arrows.push({
          x: u.x, y: GROUND_Y - 28,
          vx, life: 1.25 + (u.tier|0)*0.05, trailCd: 0,
          dmg: 1 + Math.min(2, u.tier | 0) + ((u.tier|0) >= 2 ? 1 : 0),
          iced,
          color: iced ? '#8cf' : ((u.tier|0)>=2 ? '#f8a' : '#ffe8a0'),
        });
        try { if (typeof audPlay === 'function') audPlay('shot'); } catch (_) {}
        u._shotFlash = 0.18;
        spawnSparks(u.x, GROUND_Y - 28, iced ? 4 : 3, iced ? ['#8cf','#dff','#ffd700'] : ['#fff8d0', '#ffd700'], 50);
        pushFx({ type: 'ring', x: u.x, y: GROUND_Y - 28, t: 0, life: 0.15, color: iced ? 'rgba(120,200,255,0.45)' : 'rgba(255,240,180,0.4)', r0: 2, r1: 12 });
        const baseCd = (1.05 + rand(0, 0.35) - (u.tier | 0) * 0.14);
        u.cooldown = Math.max(0.28, baseCd) * archerCdMul();
      } else {
        u.cooldown = 0.35;
      }
    }
  }

  // 矢（軌跡・着弾リング）
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.x += a.vx * dt;
    a.life -= dt;
    a.trailCd = (a.trailCd || 0) - dt;
    if (a.trailCd <= 0) {
      a.trailCd = GFX.quality === 'low' ? 0.045 : 0.022;
      pushFx({
        type: 'trail', x: a.x - Math.sign(a.vx) * 4, y: a.y + rand(-1, 1),
        t: 0, life: 0.22, color: a.color || '#ffe8a0', size: 2,
        vx: -a.vx * 0.05, vy: rand(-10, 10),
      });
    }
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.abs(a.x - e.x) < 14 && Math.abs((GROUND_Y - 20) - (e.y - 14)) < 24) {
        e.hp -= (a.dmg || 1);
        hit = true;
        try { if (typeof audPlay === 'function') audPlay('hit'); } catch (_) {}
        if (a.iced) {
          e._snareSlow = Math.max(e._snareSlow || 0, 0.7);
          e.stunned = Math.max(e.stunned || 0, 0.25);
          if (Math.random() < 0.25) spawnMeme(e.x, GROUND_Y - 44, '冷えてるゾ');
        }
        spawnArrowHit(e.x, GROUND_Y, a.vx);
        e._flash = 0.14;
        e.x += Math.sign(a.vx || e.side) * 7;
        spawnFloat(e.x, GROUND_Y - 36, '-' + (a.dmg || 1), a.iced ? '#8cf' : '#ffe8a0');
        state.hitStop = Math.max(state.hitStop, 0.04);
        if (e.hp <= 0) {
          spawnMeme(e.x, GROUND_Y - 40, pick(LORE.enemyDown));
          if (Math.random() < 0.55) dropCoin(e.x, 1);
          if (e.isTaka && Math.random() < 0.5) dropCoin(e.x, 1);
          onSacredKill();
          bestiaryKill(e.name || '?');
          noteKill();
          if (e.isBoss) bumpBond('kohai', 3);
          checkAchievements();
          spawnKillEcho(e.x, GROUND_Y, e.isBoss || e.isMur);
          enemies.splice(j, 1);
        }
        break;
      }
    }
    if (hit || a.life <= 0) {
      if (!hit && a.life <= 0) {
        // 空振り着地の小さな埃
        pushFx({ type: 'spark', x: a.x, y: GROUND_Y - 8, vx: rand(-20,20), vy: -30, t: 0, life: 0.2, color: '#c8a060', size: 2 });
      }
      arrows.splice(i, 1);
    }
  }

  // 胸ぐらスネア／810地雷
  tickMiliGadgets(dt);

  // 敵
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.anim = (e.anim || 0) + dt;
    if (e.stunned > 0) e.stunned -= dt;
    if (e._snareSlow > 0) e._snareSlow -= dt;
    if ((e.emergeT || 0) > 0) {
      e.emergeT -= dt;
      continue;
    }
    // 眼光デバフ：近距離で視線
    if (e.isGaze && Math.abs(e.x - player.x) < 220) {
      state.gazeT = Math.max(state.gazeT, 0.6);
    }
    // たかり後輩：壁より先輩のコインを優先して寄る／近接で窃盗
    if (e.isTaka && state.coins > 0 && Math.abs(e.x - player.x) < 280) {
      const dir = Math.sign(player.x - e.x) || e.side;
      const slow = (e.stunned > 0 ? 0.25 : 1) * (e._snareSlow > 0 ? 0.35 : 1);
      e.x += dir * e.speed * 1.15 * slow * dt;
      e.stealCd = (e.stealCd || 0) - dt;
      if (Math.abs(e.x - player.x) < 36 && e.stealCd <= 0) {
        state.coins = Math.max(0, state.coins - 1);
        e.stealCd = 2.8;
        dropCoin(e.x + rand(-20, 20), 1, true); // 奪って落とす演出（回収可）
        spawnMeme(e.x, GROUND_Y - 50, 'たかり!');
        toast('たかり後輩にコインを…あっ（察し）', 2.0);
        state.humidity = clamp(state.humidity + 4, 0, 100);
      }
      // たかり中は通常壁AIスキップ
      continue;
    }
    const wall = e.side < 0 ? structures.leftWall : structures.rightWall;
    let targetX = 0; // たき火
    let blocking = false;
    if (wall.level > 0 && wall.hp > 0) {
      // 壁の外側から近づく
      if (e.side < 0 && e.x < wall.x - 10) { targetX = wall.x - 12; }
      else if (e.side > 0 && e.x > wall.x + 10) { targetX = wall.x + 12; }
      else if (e.side < 0 && e.x >= wall.x - 14) { blocking = true; targetX = wall.x; }
      else if (e.side > 0 && e.x <= wall.x + 14) { blocking = true; targetX = wall.x; }
      else targetX = 0;
    }
    if (!blocking) {
      const dir = Math.sign(targetX - e.x) || e.side;
      // 壁を超えたらキャンプへ
      if (wall.level === 0 || wall.hp <= 0) {
        e.x += Math.sign(0 - e.x) * e.speed * (e.stunned > 0 ? 0.22 : 1) * (e._snareSlow > 0 ? 0.35 : 1) * dt;
      } else if ((e.side < 0 && e.x < wall.x - 12) || (e.side > 0 && e.x > wall.x + 12)) {
        e.x += Math.sign((wall.x - e.side * 12) - e.x) * e.speed * (e.stunned > 0 ? 0.22 : 1) * (e._snareSlow > 0 ? 0.35 : 1) * dt;
      } else {
        blocking = true;
      }
    }
    // 攻撃判定
    e.attackCd -= dt;
    if (wall.level > 0 && wall.hp > 0 && Math.abs(e.x - wall.x) < 20) {
      if (e.attackCd <= 0) {
        let wd = 3 + Math.floor(combatDayScale() * 0.8);
        try { wd = Math.max(1, Math.round(wd / (raidFormMul().wall || 1))); } catch (_) {}
        // 補給物資があれば被弾軽減
        if ((state.supplyStock | 0) > 0 && Math.random() < 0.28) {
          state.supplyStock--;
          wd = Math.max(1, Math.floor(wd * 0.62));
          spawnMeme(wall.x, GROUND_Y - 62, '補給防');
        }
        wall.hp -= wd;
        e.attackCd = 0.9;
        wall._flash = 0.22;
        spawnMeme(wall.x, GROUND_Y - 50, pick(LORE.wallHit));
        spawnSparks(wall.x, GROUND_Y - 30, 3, ['#c8a060', '#fff'], 60);
        spawnFloat(wall.x, GROUND_Y - 54, '-' + wd, '#f84');
        shake(1.2, 0.08);
        if (wall.hp <= 0) {
          wall.hp = 0;
          wall.level = 0;
          const bl = pick(LORE.wallBreak);
          toast((e.side < 0 ? '西' : '東') + 'の壁崩壊！ ' + bl, 3);
          story(bl, 2.8);
          spawnMeme(wall.x, GROUND_Y - 60, pick(['あ゛あ゛っ', 'ファッ!?', 'なに!?']));
          shake(7, 0.4);
          screenFlash('rgba(200,80,40,0.3)', 0.2);
          spawnSparks(wall.x, GROUND_Y - 40, 10, ['#8b5a2b', '#ff6b9d', '#fff'], 140);
        }
      }
    } else if (Math.abs(e.x - 0) < 28) {
      // たき火ダメージ
      if (e.attackCd <= 0) {
        let cdmg = 6 + Math.floor(state.day * 0.9);
        try { cdmg = Math.max(1, Math.round(cdmg / (raidFormMul().wall || 1))); } catch (_) {}
        structures.campfire.hp -= cdmg;
        e.attackCd = 0.8;
        const cl = pick(LORE.campHit);
        spawnMeme(0, GROUND_Y - 70, 'ファッ!?');
        spawnFloat(0, GROUND_Y - 64, '-' + cdmg, '#ff8844');
        shake(3, 0.12);
        spawnSparks(0, GROUND_Y - 30, 5, ['#ff6600', '#ffcc33'], 80);
        if (structures.campfire.hp < 40) {
          toast(cl, 2);
          story(cl, 2.2);
        }
        if (structures.campfire.hp <= 0) {
          structures.campfire.hp = 0;
          state.over = true;
          state.running = false;
          shake(10, 0.55);
          screenFlash('rgba(180,0,40,0.4)', 0.35);
          spawnSparks(0, GROUND_Y - 40, 12, ['#f44', '#ff6b9d', '#333'], 160);
          try { if (typeof audPlay === 'function') audPlay('lose'); if (typeof audSyncBgm === 'function') audSyncBgm(true); } catch (_) {}
          showEnd(false);
        }
      }
    }
  }

  tickLocationBus(dt);
  tickMission(dt);
  if (state.heatEventT > 0) state.heatEventT -= dt;
  tickPresentation(dt);

  // HUD
  const left = document.getElementById('hud-left');
  const right = document.getElementById('hud-right');
  const remain = Math.max(0, (state.isNight ? state.nightLength : state.dayLength) - state.dayTimer);
  const gaze = state.gazeT > 0 ? ' <span style="color:#f88">眼光…</span>' : '';
  const combo = state.killCombo >= 2 ? ` <span class="meme">×${state.killCombo}</span>` : '';
  const wTag = workers.length ? ` 作業${workers.length}` : '';
  const iTag = unlockedCount() ? ` 聖地${unlockedCount()}` : '';
  const busTag = state.bus ? (state.bus.mode === 'raid' ? ' <span style="color:#f84">侵攻</span>' : ' <span style="color:#fc8">バス</span>') : '';
  const misTag = state.mission ? ` <span style="color:#fc8">撮${state.mission.progress}/${state.mission.need}</span>` : '';
  ensureHeatState();
  const hev = heatEventDef(state.heatEvent);
  const heatTag = state.heatEvent ? ` <span style="color:#f66">${hev ? hev.name : '真夏'}</span>` : '';
  const riskTag = (state.heatRisk | 0) >= 50 ? ` <span style="color:${(state.heatRisk|0)>=80?'#f44':'#fa8'}">熱${state.heatRisk|0}</span>` : '';
  const chTag = ` ${chapterName(state.chapter)}`;
  const asTag = state.assault ? ' <span style="color:#f96">攻勢</span>' : '';
  const cmTag = ` <span style="color:#8cf">民${state.civilTier|0}</span>/<span style="color:#fa8">陣${state.miliTier|0}</span>`;
  const mount = (typeof equippedMount === 'function') ? equippedMount() : null;
  const mt = mount ? ` <span style="color:${((state.mounts.stam)|0) < 18 ? '#f84' : '#8cf'}">${mount.short}${Math.round(state.mounts.stam)}</span>` : '';
  const nestTag = (state.duskRaid || state.isNight) ? ' <span style="color:#c8a0ff">巣進軍</span>' : '';
  left.innerHTML = `<span class="gold">🪙 ${state.coins}</span> <span style="color:#8af">銀行${state.bank}</span>${combo}<br>Day ${state.day}${chTag}${asTag}${cmTag}${mt}${nestTag}${gaze}${wTag}${iTag}${busTag}${misTag}${heatTag}${riskTag}<br><span class="${state.isNight ? 'night' : 'gold'}">${state.isNight ? '夜' : '昼'} ${remain.toFixed(0)}s</span> 茶×${state.icedTeaStock} 麦×${state.mugichaStock|0}`;
  const spot = nearestSpot();
  const blocked = !spot ? nearbySpots()[0] : null;
  const sk = state.skillCd > 0 ? `Q技能CD ${state.skillCd.toFixed(0)}s` : 'Q/迫真＝括弧ツッコミ';
  if (spot) {
    right.innerHTML = `<span class="meme">現地払い</span><br>${spot.label}<br><span class="gold">${spot.cost}🪙　スペース</span>`;
  } else if (blocked && !blocked.can) {
    right.innerHTML = `${blocked.label}<br><span style="color:#fa8">${blocked.why || '今は払えない'}</span>`;
  } else {
    const eh = [((typeof advHudHint === 'function') ? advHudHint() : ''), ((typeof exploreHudHint === 'function') ? exploreHudHint() : ''), ((typeof ex2HudHint === 'function') ? ex2HudHint() : '')].filter(Boolean).join('<br>');
    right.innerHTML = eh ? `${sk}<br>${eh}` : `${sk}<br>現地へ行って払う　遠路はロケバス`;
  }
}


// =========================================================
// 天候・風・ボスシネマ
// =========================================================
function tickWindWeather(dt) {
  // 基調風 + 突風
  const base = Math.sin(state.animT * 0.55) * 1.35 + Math.sin(state.animT * 0.19 + 1.7) * 0.85;
  if (Math.random() < 0.012 * dt * 60) state.windGust = rand(1.2, 2.8) * (Math.random() < 0.5 ? -1 : 1);
  state.windGust *= Math.exp(-dt * 1.6);
  state.wind = base + state.windGust;
  // 雲影スクロール
  state.cloudX = (state.cloudX || 0) + (18 + state.wind * 6) * dt;
  // 夕立（昼終盤／夕のみ・短い／予報日は高確率）
  if (state.rainT > 0) {
    state.rainT -= dt;
    if (state.rainT <= 0) { try { if (typeof audSetRain === 'function') audSetRain(false); } catch (_) {} }
  }
  if (state.rainCool > 0) state.rainCool -= dt;
  if (state.running && !state.isNight && state.rainT <= 0 && state.rainCool <= 0) {
    const phase = dayPhase();
    const showerDay = state.heatEvent === 'evening_shower';
    const windowOk = showerDay ? (phase >= 0.42 && phase <= 0.78) : (phase >= 0.52 && phase <= 0.7);
    const chance = (showerDay ? 0.014 : 0.004) * dt * 60;
    if (windowOk && Math.random() < chance) {
      state.rainT = showerDay ? rand(5.5, 9.5) : rand(3.2, 6.5);
      state.rainCool = showerDay ? 18 : 28;
      ensureHeatState();
      state.heatFlags.shower_count = (state.heatFlags.shower_count | 0) + 1;
      unlockCodexId('qh_shower', true);
      if (Math.random() < 0.7 || showerDay) toast(showerDay ? '夕立！　熱が流れる　リスク↓' : '夕立…湿度が上がる', 2.4);
      try { if (typeof audPlay === 'function') audPlay('rain'); if (typeof audSetRain === 'function') audSetRain(true); } catch (_) {}
      state.humidity = Math.min(100, state.humidity + (showerDay ? 10 : 6));
      state.heatRisk = clamp((state.heatRisk | 0) - (showerDay ? 14 : 6), 0, 100);
      updateHumidityHud();
      try { checkAchievements(); } catch (_) {}
    }
  }
}

function startBossCine(x, name) {
  state.bossCineT = 1.85;
  state.bossCineX = x;
  state.slowMoT = Math.max(state.slowMoT, 0.85);
  state.hitStop = Math.max(state.hitStop, 0.12);
  shake(5, 0.45);
  screenFlash('rgba(80,0,20,0.4)', 0.45);
  story('眼光——　' + (name || 'ボス') + '　見とけよ見とけよ〜', 2.6);
  spawnMeme(x, GROUND_Y - 70, pick(['なに!?', 'ファッ!?', '王道を征く']));
  pushFx({ type: 'ring', x, y: GROUND_Y - 30, t: 0, life: 0.9, color: 'rgba(255,40,60,0.55)', r0: 6, r1: 90 });
  pushFx({ type: 'ring', x, y: GROUND_Y - 30, t: 0, life: 0.7, color: 'rgba(255,215,0,0.35)', r0: 4, r1: 60 });
}

function drawCloudShadows(phase) {
  if (!GFX.weather) return;
  if (phase >= 0.72) return; // 夜は星優先
  const low = GFX.quality === 'low';
  const n = low ? 3 : 6;
  const a = phase > 0.55 ? 0.1 : 0.14;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const cx = ((state.cloudX * (0.7 + i * 0.08) + i * 170) % (W + 160)) - 80;
    const cy = GROUND_Y - 18 - (i % 3) * 4;
    const rw = 50 + (i % 3) * 22;
    ctx.globalAlpha = a * (0.7 + (i % 2) * 0.25);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    if (low) {
      ctx.ellipse(cx, cy, rw, 7, 0, 0, Math.PI * 2);
    } else {
      ctx.ellipse(cx, cy, rw, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + rw * 0.45, cy + 1, rw * 0.55, 6, 0, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  // 空の雲シルエット（昼）
  if (!low && phase < 0.65) {
    ctx.globalAlpha = 0.18 + (phase > 0.5 ? 0.08 : 0);
    for (let i = 0; i < 4; i++) {
      const cx = ((-state.cloudX * 0.35 + i * 210) % (W + 120)) - 40;
      const cy = 28 + (i % 3) * 16;
      ctx.fillStyle = phase > 0.52 ? '#6a4a58' : '#e8f0ff';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 36 + i * 4, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 22, cy + 2, 28, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawRain() {
  if (state.rainT <= 0) return;
  const low = GFX.quality === 'low';
  const n = low ? 28 : 70;
  const fade = Math.min(1, state.rainT / 0.55);
  ctx.save();
  ctx.globalAlpha = 0.35 * fade;
  ctx.strokeStyle = '#a8c8e8';
  ctx.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    const px = ((i * 47 + state.animT * 220 + state.wind * 30) % W);
    const py = ((i * 91 + state.animT * 380) % (GROUND_Y + 10));
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + state.wind * 0.8, py + 8);
    ctx.stroke();
  }
  // 地面の水跳ね
  if (!low) {
    ctx.globalAlpha = 0.2 * fade;
    ctx.fillStyle = '#c0d8f0';
    for (let i = 0; i < 10; i++) {
      const px = ((i * 73 + state.animT * 90) % W);
      ctx.fillRect(px, GROUND_Y - 1, 2, 1);
    }
  }
  ctx.restore();
}

function drawBossCineOverlay() {
  if (state.bossCineT <= 0) return;
  const p = clamp(state.bossCineT / 1.85, 0, 1);
  const sx = wx(state.bossCineX);

  g.addColorStop(0, 'rgba(16,0,8,0)');

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.4 + Math.sin(state.animT * 14) * 0.18;

  ctx.lineWidth = 2;

// 時刻・光（Two Crowns風の昼夜ブレンド）
// =========================================================
function dayPhase() {
  // タイトルシネマ：夜→夜明けへ（タイトル中のみ）
  if (state.titleCine && !state.running) {
    return lerp(0.92, 0.22, clamp(state.titleDawn, 0, 1));
  }
  if (!state.running && state.over && !state.won) return 0.85;
  // 夜フラグのみが夜phase
  if (state.isNight === true) {
    const p = state.dayTimer / Math.max(1, state.nightLength || 38);
    return 0.72 + clamp(p, 0, 1) * 0.26;
  }
  // プレイ中の昼は常に 0.22〜0.55（夜空にしない）
  if (state.running && state.isNight !== true) {
    const p = state.dayTimer / Math.max(1, state.dayLength || 52);
    return lerp(0.22, 0.55, clamp(p, 0, 1));
  }
  const p = state.dayTimer / Math.max(1, state.dayLength || 52);
  if (p < 0.12) return lerp(0.18, 0.28, p / 0.12);
  if (p < 0.55) return lerp(0.28, 0.45, (p - 0.12) / 0.43);
  if (p < 0.82) return lerp(0.45, 0.55, (p - 0.55) / 0.27);
  return lerp(0.55, 0.62, (p - 0.82) / 0.18);
}

function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }

function skyColors(phase) {
  // 真夏パレット：白い熱昼／琥珀の夕／湿った青緑夜
  const stops = [
    { p: 0.00, t: '#0c1820', m: '#1a3040', b: '#2a4050' }, // 湿った夜明け前
    { p: 0.12, t: '#ffb080', m: '#ffd0a0', b: '#c8c070' }, // 白い朝焼け
    { p: 0.28, t: '#7ec8ff', m: '#e8f4ff', b: '#d0d080' }, // 漂白された朝
    { p: 0.38, t: '#5ab0ff', m: '#f0f6ff', b: '#c8c868' }, // Harsh noon
    { p: 0.48, t: '#ff8a48', m: '#ffc070', b: '#d09040' }, // 昼の終わり＝琥珀へ
    { p: 0.55, t: '#ff6a30', m: '#ff9040', b: '#c07030' }, // プレイ昼の終端で夕
    { p: 0.58, t: '#ff6a30', m: '#ff9040', b: '#c07030' }, // 琥珀の夕
    { p: 0.72, t: '#0c2830', m: '#1a4050', b: '#2a3840' }, // 湿った宵
    { p: 0.88, t: '#061418', m: '#0c2430', b: '#142830' }, // 自販機色の夜
    { p: 1.00, t: '#040e12', m: '#0a1c24', b: '#102028' },
  ];
  let a = stops[0], b = stops[1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (phase >= stops[i].p && phase <= stops[i + 1].p) { a = stops[i]; b = stops[i + 1]; break; }
    if (phase >= stops[i].p) { a = stops[i]; b = stops[Math.min(i + 1, stops.length - 1)]; }
  }
  const t = (phase - a.p) / Math.max(0.001, b.p - a.p);
  let top = mixHex(a.t, b.t, t), mid = mixHex(a.m, b.m, t), bot = mixHex(a.b, b.b, t);
  const th = chapterTheme();
  const biasAmt = 0.55 + Math.min(0.35, (state.chapter | 0) * 0.1);
  top = biasHex(top, th.skyBias, biasAmt);
  mid = biasHex(mid, th.skyBias, biasAmt * 0.75);
  bot = biasHex(bot, th.skyBias, biasAmt * 0.55);
  return { top, mid, bot, phase, accent: th.accent, neon: th.neon };
}

function mixHex(c1, c2, t) {
  const norm = (c) => (typeof c === 'string' && c[0] === '#' && c.length >= 7) ? c : '#808080';
  c1 = norm(c1); c2 = norm(c2);
  const p = (c) => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const a = p(c1), b = p(c2);
  const r = (a[0] + (b[0]-a[0])*t)|0, g = (a[1]+(b[1]-a[1])*t)|0, bl = (a[2]+(b[2]-a[2])*t)|0;
  return '#' + [r,g,bl].map(v => ((v % 256) + 256) % 256).map(v => v.toString(16).padStart(2,'0')).join('');
}


function drawTorchLights() {
  if (!GFX.torches) return;
  const nightish = state.isNight || (state.titleCine && state.titleDawn < 0.55);
  if (!nightish && !(state.titleCine && state.titleDawn < 0.7)) return;
  const posts = [];
  // 門灯（壁）
  for (const w of [structures.leftWall, structures.rightWall]) {
    if (w.level > 0) posts.push({ x: w.x, y: GROUND_Y - (w.level === 1 ? 50 : 70), gate: true });
  }
  // トーチ列：領地内に等間隔
  const lx = structures.leftWall.level > 0 ? structures.leftWall.x + 40 : -120;
  const rx = structures.rightWall.level > 0 ? structures.rightWall.x - 40 : 120;
  const step = GFX.quality === 'low' ? 90 : 70;
  for (let x = lx; x <= rx; x += step) {
    if (Math.abs(x) < 28) continue; // たき火付近はスキップ
    posts.push({ x, y: GROUND_Y - 34, gate: false });
  }
  // タイトル時は仮のトーチ列
  if (state.titleCine && posts.length < 3) {
    for (let i = -3; i <= 3; i++) posts.push({ x: i * 70, y: GROUND_Y - 34, gate: false });
  }
  const maxL = GFX.quality === 'low' ? 6 : posts.length;
  for (let i = 0; i < Math.min(posts.length, maxL); i++) {
    const p = posts[i];
    const sx = wx(p.x);
    const flick = 0.85 + Math.sin(state.animT * 7 + p.x * 0.05) * 0.15;
    // ポール
    drawPixelRect(sx - 1, p.y, 3, GROUND_Y - p.y, '#3a3a38');
    const vendish = i % 3 === 0;
    drawPixelRect(sx - 4, p.y - 6, 8, 5, vendish ? '#3ad0c8' : '#ffe080');
    const rad = (p.gate ? 70 : 48) * flick;
    const g = ctx.createRadialGradient(sx, p.y - 4, 2, sx, p.y - 4, rad);
    if (vendish) {
      g.addColorStop(0, `rgba(58,208,200,${0.26 * flick})`);
      g.addColorStop(0.45, `rgba(40,160,180,${0.1 * flick})`);
      g.addColorStop(1, 'rgba(20,80,90,0)');
    } else {
      g.addColorStop(0, `rgba(255,220,140,${0.28 * flick})`);
      g.addColorStop(0.45, `rgba(255,180,80,${0.1 * flick})`);
      g.addColorStop(1, 'rgba(255,140,40,0)');
    }
    ctx.fillStyle = g;
    ctx.fillRect(sx - rad, p.y - rad, rad * 2, rad * 2);
    // 地面の光だまり
    ctx.globalAlpha = 0.16 * flick;
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.ellipse(sx, GROUND_Y + 1, rad * 0.45, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawHeatWave() {
  if (!GFX.heatHaze) return;
  const h = state.humidity || 0;
  if (h < 55 && !(state.titleCine && state.titleDawn > 0.5)) return;
  const strength = state.titleCine ? 0.12 : clamp((h - 50) / 200, 0, 0.2);
  const bands = GFX.quality === 'low' ? 4 : 8;
  ctx.save();
  for (let i = 0; i < bands; i++) {
    const y = GROUND_Y - 90 + i * 10 + Math.sin(state.animT * 2.5 + i) * 3;
    const ox = Math.sin(state.animT * 3.2 + i * 1.3) * (3 + strength * 20);
    ctx.globalAlpha = strength * (0.35 + (i % 2) * 0.2);
    ctx.fillStyle = h >= 75 ? 'rgba(255,160,180,0.5)' : 'rgba(255,230,180,0.45)';
    ctx.fillRect(ox, y, W, 2);
  }
  // 汗のきらめき（空中の光粒）
  if (h >= 60 || (state.titleCine && state.titleDawn > 0.4)) {
    const n = GFX.quality === 'low' ? 4 : 10;
    for (let i = 0; i < n; i++) {
      const px = ((i * 97 + state.animT * 40 * (1 + i * 0.02)) % W);
      const py = GROUND_Y - 30 - ((state.animT * 25 + i * 40) % 100);
      ctx.globalAlpha = 0.25 + Math.sin(state.animT * 6 + i) * 0.15;
      ctx.fillStyle = i % 2 ? '#fff' : '#aef';
      ctx.fillRect(px, py, 2, 2);
    }
  }
  ctx.restore();
}

function drawSoftShadow(x, y, w, alpha, windSkew) {
  const sk = windSkew != null ? windSkew : (state.wind || 0) * 1.8;
  const cx = x + sk;
  if (!GFX.softShadow) {
    ctx.globalAlpha = (alpha || 0.28) * 0.7;
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - w, y, w * 2, 3);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.globalAlpha = alpha || 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, y + 2, w + Math.abs(sk) * 0.15, Math.max(3, w * 0.28), sk * 0.02, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawGodRays(phase) {
  if (phase < 0.08 || phase > 0.62) return;
  const sunX = W * (0.78 - (phase - 0.2) * 0.15);
  const sunY = 36 + Math.abs(phase - 0.35) * 90;
  ctx.save();
  ctx.globalAlpha = phase > 0.5 ? 0.07 : 0.09;
  for (let i = -3; i <= 3; i++) {
    const ang = -0.4 + i * 0.11;
    ctx.fillStyle = phase > 0.5 ? '#ffaa66' : '#fff8d0';
    ctx.beginPath();
    ctx.moveTo(sunX, sunY);
    ctx.lineTo(sunX + Math.cos(ang) * 420, sunY + Math.sin(ang) * 420);
    ctx.lineTo(sunX + Math.cos(ang + 0.05) * 420, sunY + Math.sin(ang + 0.05) * 420);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawAurora() {
  if (!state.isNight) return;
  ctx.save();
  for (let band = 0; band < 3; band++) {
    const y0 = 28 + band * 22;
    const g = ctx.createLinearGradient(0, y0, W, y0 + 40);
    const a = 0.10 + Math.sin(state.animT * 0.7 + band) * 0.04;
    g.addColorStop(0, `rgba(40,255,180,0)`);
    g.addColorStop(0.35, `rgba(${40+band*20},${200-band*20},210,${a})`);
    g.addColorStop(0.65, `rgba(80,180,160,${a * 0.85})`);
    g.addColorStop(1, `rgba(40,255,180,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, y0 + 20);
    for (let x = 0; x <= W; x += 16) {
      const yy = y0 + Math.sin(x * 0.012 + state.animT * (0.8 + band * 0.2) + band) * (10 + band * 4)
        + Math.sin(x * 0.03 - state.animT) * 4;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, y0 + 55);
    ctx.lineTo(0, y0 + 55);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}


function drawGroundFog(phase) {
  const a = phase >= 0.68 ? 0.14 : 0.06;
  const g = ctx.createLinearGradient(0, GROUND_Y - 28, 0, GROUND_Y + 8);
  g.addColorStop(0, 'rgba(200,220,255,0)');
  g.addColorStop(1, `rgba(180,200,220,${a})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y - 28, W, 36);
}
function drawHumidityHaze() {
  const h = state.humidity || 0;
  if (h < 40) return;
  const a = clamp((h - 40) / 120, 0, 0.22);
  const g = ctx.createLinearGradient(0, GROUND_Y - 100, 0, GROUND_Y + 20);
  const col = h >= 80 ? `rgba(255,140,180,${a})` : `rgba(170,200,255,${a})`;
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, col);

  ctx.fillRect(0, GROUND_Y - 110, W, 130);

  if (h >= 70) {

}

// ---------- 描画（ドット絵ベース + ミーム文字） ----------
function wx(x) { return Math.floor(x - state.cameraX); }

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

/** 昼夜・天候レイヤ（Kingdom Crowns風の空気感） */
function drawWeatherLayers(phase) {
  const th = chapterTheme();
  const nightish = phase >= 0.68;
  const low = GFX.quality === 'low';
  // 1) 章フォグ／空気遠近
  ctx.save();
  ctx.globalAlpha = nightish ? 0.1 : 0.06;
  const fogG = ctx.createLinearGradient(0, GROUND_Y - 120, 0, GROUND_Y);
  fogG.addColorStop(0, 'rgba(0,0,0,0)');
  fogG.addColorStop(1, th.fog);
  ctx.fillStyle = fogG;
  ctx.fillRect(0, GROUND_Y - 120, W, 120);
  // 2) 真夏ヒートヘイズ（既存 drawHeatWave と併用）
  if (!low && (state.heatEvent === 'heatwave' || state.humidity >= 80)) {
    ctx.globalAlpha = 0.06 + Math.sin(state.animT * 5) * 0.02;
    ctx.fillStyle = '#ff8844';
    for (let i = 0; i < 5; i++) {
      const y = GROUND_Y - 20 - i * 10 + Math.sin(state.animT * 3 + i) * 3;
      ctx.fillRect(0, y, W, 2);
    }
  }
  // 3) 花粉／埃／ネオン粒子
  if (!low) {
    const n = th.decor === 'neon' ? 18 : (th.decor === 'void' ? 14 : 10);
    for (let i = 0; i < n; i++) {
      const px = ((i * 73 + state.animT * (12 + i % 5) + state.wind * 8) % (W + 20)) - 10;
      const py = GROUND_Y - 30 - ((i * 37 + state.animT * 20) % 90);
      ctx.globalAlpha = 0.15 + (i % 3) * 0.05;
      ctx.fillStyle = th.decor === 'neon' ? th.neon : (th.decor === 'void' ? '#a8f' : '#ffe8a0');
      ctx.fillRect(px, py, th.decor === 'neon' ? 2 : 1, th.decor === 'neon' ? 2 : 1);
    }
  }
  // 4) 夕暮れ／夜明けのカラーグレーディング帯
  if (phase > 0.5 && phase < 0.72) {
    ctx.globalAlpha = (phase - 0.5) / 0.22 * 0.12;
    ctx.fillStyle = '#ff7040';
    ctx.fillRect(0, 0, W, GROUND_Y);
  } else if (phase < 0.18) {
    ctx.globalAlpha = (0.18 - phase) / 0.18 * 0.1;
    ctx.fillStyle = '#ffb080';
    ctx.fillRect(0, 0, W, GROUND_Y);
  }
  // 5) 夜のビネット
  if (nightish && !low) {
    const vg = ctx.createRadialGradient(W * 0.5, GROUND_Y - 40, 40, W * 0.5, GROUND_Y - 40, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(4,2,10,0.35)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  // 6) 眼光の太陽イベント：赤い縁取り
  if (state.heatEvent === 'gaze_sun') {
    ctx.globalAlpha = 0.08 + Math.sin(state.animT * 4) * 0.03;
    ctx.fillStyle = '#ff2244';
    ctx.fillRect(0, 0, W, 8);
    ctx.fillRect(0, GROUND_Y - 4, W, 4);
  }
  // 7) 夕立予報：鉛色の空帯
  if (state.heatEvent === 'evening_shower' && !nightish) {
    ctx.globalAlpha = 0.1 + (state.rainT > 0 ? 0.08 : 0);
    ctx.fillStyle = '#4a6080';
    ctx.fillRect(0, 0, W, 48);
  }
  // 8) 麦茶の日：琥珀色の柔らか光
  if (state.heatEvent === 'mugicha_day' && !nightish) {
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(0, GROUND_Y - 80, W, 80);
  }
  // 9) 熱中症注意：脈打つ赤ヴィネット
  if (state.heatEvent === 'heatstroke_warn' || (state.heatRisk | 0) >= 85) {
    ctx.globalAlpha = 0.07 + Math.sin(state.animT * 6) * 0.04;
    ctx.fillStyle = '#ff2200';
    ctx.fillRect(0, 0, W, 12);
    ctx.fillRect(0, H - 12, W, 12);
  }
  // 10) 湯気蜃気楼：追加ゆらぎ帯
  if (state.heatEvent === 'steam_haze' && !low) {
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#ffe8d0';
    for (let i = 0; i < 6; i++) {
      const y = GROUND_Y - 40 - i * 8 + Math.sin(state.animT * 4 + i * 1.7) * 5;
      ctx.fillRect(Math.sin(state.animT * 2.2 + i) * 6, y, W, 2);
    }
  }
  // 11) 810祭：金縁フラッシュ薄
  if (state.heatEvent === '810_festival') {
    ctx.globalAlpha = 0.05 + Math.sin(state.animT * 3) * 0.02;
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(0, 0, W, 6);
  }
  // 12) アイス屋台：水色の涼帯
  if (state.heatEvent === 'ice_stand' && !nightish) {
    ctx.globalAlpha = 0.07 + Math.sin(state.animT * 2.5) * 0.02;
    ctx.fillStyle = '#7ec8ff';
    ctx.fillRect(0, GROUND_Y - 70, W, 70);
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#e8f8ff';
    ctx.fillRect(0, 0, W, 24);
  }
  // 13) 洗濯日和：白い乾き帯
  if (state.heatEvent === 'laundry_day' && !nightish) {
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#f5f0e6';
    ctx.fillRect(0, GROUND_Y - 90, W, 90);
  }
  // 14) 焼肉の風：薄煙オレンジ
  if (state.heatEvent === 'bbq_wind' && !nightish) {
    ctx.globalAlpha = 0.05 + Math.sin(state.animT * 2) * 0.02;
    ctx.fillStyle = '#ff9944';
    for (let i = 0; i < 4; i++) {
      const x = ((i * 90 + state.animT * 30) % (W + 40)) - 20;
      ctx.fillRect(x, GROUND_Y - 100 - i * 8, 28, 3);
    }
  }
  ctx.restore();
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  const phase = dayPhase();
  const sky = skyColors(phase);
  // 星・月は isNight のみ（タイトルシネマは例外）
  const nightSky = (state.isNight === true) || (!!state.titleCine && !state.running);
  const nightish = nightSky;

  // ---- カメラシェイク ----
  let shakeX = 0, shakeY = 0;
  if (state.shakeT > 0 && state.shakeMag > 0) {
    const m = state.shakeMag * (state.shakeT / 0.35);
    shakeX = (Math.random() - 0.5) * 2 * m;
    shakeY = (Math.random() - 0.5) * 2 * m * 0.6;
  }
  ctx.save();
  ctx.translate(shakeX | 0, shakeY | 0);

  // ---- 空グラデ ----
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, sky.top);
  skyGrad.addColorStop(0.45, sky.mid);
  skyGrad.addColorStop(1, sky.bot);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // 星：本編は isNight のみ／タイトルシネマのみ例外
  if (nightSky) {
    const starA = state.isNight ? 0.9 : clamp(1 - (state.titleDawn || 0), 0.2, 0.9);
    ctx.globalAlpha = starA * 0.9;
    const starN = GFX.starCount || 40;
    for (let i = 0; i < starN; i++) {
      const sx = ((i * 97 + 30) - state.cameraX * 0.08 + Math.sin(state.animT * 0.2 + i) * 2) % W;
      const sy = (i * 53) % (GROUND_Y - 50);
      if (sy > 8) {
        const tw = 0.55 + Math.sin(state.animT * 3 + i * 1.7) * 0.45;
        ctx.globalAlpha = starA * tw;
        ctx.fillStyle = i % 7 === 0 ? '#ffd700' : '#fff';
        ctx.fillRect(sx, sy, i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
      }
    }
    ctx.globalAlpha = 1;
    if (GFX.aurora) drawAurora();
  }

  // 太陽 / 月（月は nightSky のみ）
  if (!nightSky) {

    const sunX = W * (0.82 - phase * 0.25);
    const sunY = 28 + Math.pow(Math.abs(phase - 0.35), 1.2) * 110;
    const glow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 70);
    const warm = phase > 0.5;
    glow.addColorStop(0, warm ? 'rgba(255,160,80,0.85)' : 'rgba(255,245,200,0.95)');
    glow.addColorStop(0.35, warm ? 'rgba(255,120,40,0.25)' : 'rgba(255,220,140,0.28)');
    glow.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sunX - 80, sunY - 80, 160, 160);
    drawPixelRect(sunX - 10, sunY - 10, 20, 20, warm ? '#ff8844' : '#ffe566');
    drawPixelRect(sunX - 6, sunY - 6, 12, 12, '#fff8d0');
    if (GFX.godRays) drawGodRays(phase);
  } else {
    const moonX = W * 0.72;
    const moonY = 48;
    const mg = ctx.createRadialGradient(moonX, moonY, 2, moonX, moonY, 46);
    mg.addColorStop(0, 'rgba(200,220,255,0.55)');
    mg.addColorStop(1, 'rgba(120,160,255,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(moonX - 50, moonY - 50, 100, 100);
    drawPixelRect(moonX - 8, moonY - 8, 16, 16, '#d8e4ff');
    drawPixelRect(moonX - 4, moonY - 2, 4, 4, '#a0b0d0');
    // 夜景差：街灯列＋湿度もや＋遠景ネオン帯
    ctx.globalAlpha = 0.35;
    for (let i = 0; i < 8; i++) {
      const lx = ((i * 110 - state.cameraX * 0.15) % (W + 40) + W + 40) % (W + 40) - 20;
      const tw = 0.5 + Math.sin(state.animT * 2.5 + i) * 0.3;
      ctx.globalAlpha = 0.25 + tw * 0.35;
      const lg = ctx.createRadialGradient(lx, GROUND_Y - 36, 1, lx, GROUND_Y - 36, 28);
      lg.addColorStop(0, 'rgba(255,220,140,0.55)');
      lg.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(lx - 28, GROUND_Y - 60, 56, 60);
      drawPixelRect(lx - 1, GROUND_Y - 40, 2, 40, '#444');
      drawPixelRect(lx - 4, GROUND_Y - 44, 8, 5, i % 3 === 0 ? '#3ad0c8' : '#ffe080');
    }
    ctx.globalAlpha = 0.12 + Math.min(0.18, (state.humidity|0) / 500);
    ctx.fillStyle = '#204850';
    ctx.fillRect(0, GROUND_Y - 90, W, 90);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = state.assault ? '#ff4060' : chapterTheme().neon;
    ctx.fillRect(0, GROUND_Y - 70, W, 3);
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = chapterTheme().accent;
    ctx.fillRect(0, GROUND_Y - 74, W, 2);
    ctx.globalAlpha = 1;
  }

  // 遠景
  drawParallaxHills(phase);
  // 雲影（移動）
  drawCloudShadows(phase);

  // 地面
  drawGroundTiles(phase);
  // 天候・空気レイヤ（地面の直後＝キャラの下）
  drawWeatherLayers(phase);
  try { drawStreetLayer(phase, nightish); } catch (_) {}

  // 領地床（聖地解放でマップ横断方向へ伸びる）
  let lx = structures.leftWall.level > 0 ? structures.leftWall.x : -40;
  let rx = structures.rightWall.level > 0 ? structures.rightWall.x : 40;
  for (const L of unlockedLandmarks()) {
    if (L.side < 0) lx = Math.min(lx, L.x - 30);
    else rx = Math.max(rx, L.x + 30);
  }
  const asphalt = nightish ? '#1c1e20' : (phase > 0.52 && phase < 0.72 ? '#323028' : '#3a3c40');
  ctx.fillStyle = asphalt;
  ctx.fillRect(wx(lx), GROUND_Y, rx - lx, 7);
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#2a2c2e';
  for (let x = wx(lx); x < wx(rx); x += 10) ctx.fillRect(x, GROUND_Y + 2, 6, 2);
  ctx.globalAlpha = 0.38;
  ctx.fillStyle = nightish ? '#8a7840' : '#c8b050';
  for (let x = wx(lx); x < wx(rx); x += 14) ctx.fillRect(x, GROUND_Y + 2, 7, 1);
  ctx.globalAlpha = 1;
  if (!nightish || state.isNight) {
    const tg = ctx.createLinearGradient(wx(lx), GROUND_Y - 8, wx(rx), GROUND_Y - 8);
    tg.addColorStop(0, 'rgba(200,180,80,0)');
    tg.addColorStop(0.5, nightish ? 'rgba(255,180,80,0.07)' : 'rgba(255,230,160,0.05)');
    tg.addColorStop(1, 'rgba(200,180,80,0)');
    ctx.fillStyle = tg;
    ctx.fillRect(wx(lx), GROUND_Y - 8, rx - lx, 8);
  }

  // たき火（影→本体）
  drawSoftShadow(wx(0), GROUND_Y, 22, nightish ? 0.4 : 0.22);
  drawCampfire(wx(0), GROUND_Y);
  drawLandmarkMap(phase, nightish);
  try { drawExploreLayer(nightish); } catch (_) {}
  try { drawAdvLayer(nightish); } catch (_) {}
  try { drawEncounter(); } catch (_) {}
  drawLocationBus();
  try { drawNests(nightish); } catch (_) {}
  try { drawMountStands(); } catch (_) {}
  drawMidsummerFx();
  drawMissionMarker();

  // 壁
  drawSoftShadow(wx(structures.leftWall.x), GROUND_Y, 14, 0.25);
  drawSoftShadow(wx(structures.rightWall.x), GROUND_Y, 14, 0.25);
  drawWall(structures.leftWall, true);
  drawWall(structures.rightWall, false);
  drawMiliGadgets();
  drawTorchLights();

  // 現地払い：足元にいるときだけ1つ。常時の謎円は出さない
  if (state.running) {
    const focus = nearestSpot();
    const inRange = !!(focus && Math.abs(player.x - focus.x) <= focus.r);
    if (inRange) {
      const others = nearbySpots().filter(s => s !== focus && Math.abs(player.x - s.x) <= s.r).length;
      ctx.strokeStyle = focus.can ? '#ffd700' : '#c88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(wx(focus.x), GROUND_Y - 4, 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.textAlign = 'center';
      const ready = focus.can
        ? `払う ${focus.cost}🪙`
        : (focus.why || '今は払えない');
      drawUiLabel(ready, wx(focus.x), GROUND_Y - 78, focus.can ? '#ffd700' : '#fa8', 15);
      drawUiLabel(focus.label, wx(focus.x), GROUND_Y - 94, focus.mount ? '#8cf' : '#ff6b9d', 14);
      if (others) {
        drawUiLabel('他' + others + '件　近い方を払う', wx(focus.x), GROUND_Y - 64, '#ccc', 12);
      }
    }
  }

  // コイン
  for (const c of coinsOnGround) {
    drawSoftShadow(wx(c.x), GROUND_Y, 6, 0.2);
    drawCoin(wx(c.x), c.y);
  }

  // 補給線（部室↔聖地）
  if (state.supplyLmId && workers.some(w => w.job === 'supply')) {
    const Lm = landmarkById(state.supplyLmId);
    if (Lm) {
      const x0 = wx(0), x1 = wx(Lm.x), y = GROUND_Y - 6;
      ctx.save();
      ctx.strokeStyle = 'rgba(120,200,255,0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y - 8);
      ctx.stroke();
      ctx.setLineDash([]);
      // 物資パルス
      const t = (state.animT || 0) * 0.35;
      const px = x0 + (x1 - x0) * ((t % 1 + 1) % 1);
      ctx.fillStyle = '#8cf';
      ctx.beginPath();
      ctx.arc(px, y - 8, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  // 作業員
  for (const w of workers) {
    drawSoftShadow(wx(w.x), GROUND_Y, 9, 0.2);
    drawWorker(wx(w.x), GROUND_Y, w);
    const job = w.job || 'gather';
    if (job !== 'gather') {
      ctx.save();
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = job === 'supply' ? '#8cf' : job === 'cheer' ? '#f8a' : '#fea';
      ctx.globalAlpha = 0.85;
      ctx.fillText(job === 'supply' ? '補給' : job === 'cheer' ? '応援' : '撮影', wx(w.x), GROUND_Y - 38);
      ctx.restore();
    }
  }
  // ユニット
  for (const u of units) {
    drawSoftShadow(wx(u.x), GROUND_Y, 10, 0.22);
    drawArcher(wx(u.x), GROUND_Y, u);
  }

  // 敵
  for (const e of enemies) {
    drawSoftShadow(wx(e.x), GROUND_Y, e.isBoss || e.isMur ? 16 : 11, 0.28);
    drawEnemy(wx(e.x), GROUND_Y, e);
  }

  // 矢 + 軌跡グロー
  for (const a of arrows) {
    const dir = a.vx > 0 ? 1 : -1;
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = a.color || '#ffe8a0';
    ctx.fillRect(wx(a.x) - dir * 14, a.y - 2, 16, 5);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fff';
    ctx.fillRect(wx(a.x) - dir * 8, a.y, 10, 3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(wx(a.x), a.y - 1, 11, 3);
    drawPixelRect(wx(a.x) + (dir > 0 ? 10 : -3), a.y - 2, 4, 5, a.iced ? '#8cf' : '#ffd700');
  }

  // プレイヤー
  drawSoftShadow(wx(player.x), GROUND_Y, 14, 0.3);
  drawYajyu(wx(player.x), GROUND_Y, player.facing);

  // 技能リング残光
  if (state.skillRingT > 0) {
    const p = 1 - state.skillRingT / 0.85;
    ctx.globalAlpha = (1 - p) * 0.55;
    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(wx(player.x), GROUND_Y - 36, 20 + p * 90, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(wx(player.x), GROUND_Y - 36, 10 + p * 60, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // FX
  for (const f of fx) {
    if (f.type === 'meme') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ff6b9d';
      ctx.font = uiFont(15);
      ctx.textAlign = 'center';
      const my = clamp(f.y - f.t * 26, 108, GROUND_Y - 28);
      const mx = clamp(wx(f.x), 40, W - 40);
      ctx.fillText(String(f.text).slice(0, 12), mx, my);
      ctx.globalAlpha = 1;
    } else if (f.type === 'burst') {
      const p = f.t / f.life;
      for (let k = 0; k < 8; k++) {
        const ang = k / 8 * Math.PI * 2;
        drawPixelRect(wx(f.x) + Math.cos(ang) * p * 22, f.y + Math.sin(ang) * p * 14, 3, 3, k % 2 ? '#ff6b9d' : '#ffd700');
      }
    } else if (f.type === 'dot' || f.type === 'spark') {
      const a = 1 - f.t / (f.life || 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color || '#fff';
      const s = f.size || 3;
      ctx.fillRect(wx(f.x), f.y, s, s);
      if (f.type === 'spark') {
        ctx.globalAlpha = a * 0.4;
        ctx.fillRect(wx(f.x) - 1, f.y - 1, s + 2, s + 2);
      }
      ctx.globalAlpha = 1;
    } else if (f.type === 'mist') {
      const a = (1 - f.t / f.life) * 0.9;
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color || 'rgba(180,210,255,0.15)';
      const s = f.size || 14;
      ctx.beginPath();
      ctx.ellipse(wx(f.x), f.y, s, s * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (f.type === 'ring') {
      const p = f.t / f.life;
      const r = (f.r0 || 4) + ((f.r1 || 30) - (f.r0 || 4)) * p;
      ctx.globalAlpha = (1 - p) * 0.7;
      ctx.strokeStyle = f.color || 'rgba(255,215,0,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(wx(f.x), f.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === 'paren') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ff6b9d';
      ctx.font = uiFont(22);
      ctx.textAlign = 'center';
      ctx.fillText(f.text || '（', wx(f.x), f.y);
      ctx.globalAlpha = 1;
    } else if (f.type === 'trail') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = f.color || '#ffe8a0';
      ctx.fillRect(wx(f.x), f.y, f.size || 2, f.size || 2);
      ctx.globalAlpha = 1;
    } else if (f.type === 'slash') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a;
      ctx.strokeStyle = f.color || '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(wx(f.x) - 8, f.y - 4);
      ctx.lineTo(wx(f.x) + 10, f.y + 3);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === 'pillar') {
      const a = (1 - f.t / f.life) * 0.9;
      const w = f.w || 14;
      const g = ctx.createLinearGradient(wx(f.x), 0, wx(f.x), GROUND_Y);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.35, f.color || 'rgba(255,215,0,0.35)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = a;
      ctx.fillStyle = g;
      ctx.fillRect(wx(f.x) - w / 2, 0, w, GROUND_Y);
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = '#fff';
      ctx.fillRect(wx(f.x) - 1, 20, 2, GROUND_Y - 40);
      ctx.globalAlpha = 1;
    } else if (f.type === 'pay') {
      const p = Math.min(1, f.t / f.life);
      drawCoin(wx(f.tx - (1 - p) * (f.tx - player.x)), GROUND_Y - 20 - Math.sin(p * Math.PI) * 40);
    } else if (f.type === 'float') {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color || '#ffe8a0';
      ctx.font = uiFont(15);
      ctx.textAlign = 'center';
      ctx.fillText(f.text || '', wx(f.x), f.y + (f.vy || -46) * f.t);
      ctx.globalAlpha = 1;
    }
  }

  try { drawNestChevrons(); } catch (_) {}

  // 名前プレート（顔の上）
  ctx.textAlign = 'center';
  drawUiLabel('野獣先輩', wx(player.x), GROUND_Y - 102, '#ff6b9d', 14);
  drawUiLabel('👑王道を征く', wx(player.x), GROUND_Y - 116, '#ffd700', 13);

  // 湿度ヘイズ
  drawGroundFog(phase);
  drawHumidityHaze();
  drawHeatWave();
  drawRain();
  // 章アクセントの夜ネオン帯
  if (phase >= 0.68) {
    const th = chapterTheme();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = th.neon;
    ctx.fillRect(0, GROUND_Y - 66, W, 2);
    ctx.globalAlpha = 1;
  }
  drawBossCineOverlay();

  // 夜間ヴィネット＋たき火ライト体積
  if (nightish) {
    const g = ctx.createRadialGradient(W/2, GROUND_Y - 40, 60, W/2, GROUND_Y, 460);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(4,14,18,${0.35 + (phase - 0.68) * 0.5})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // たき火の暖色ボリュームライト
    const lx2 = wx(0), ly2 = GROUND_Y - 24;
    const pulse = 150 + Math.sin(state.animT * 4) * 12;
    const light = ctx.createRadialGradient(lx2, ly2, 8, lx2, ly2, pulse);
    light.addColorStop(0, 'rgba(255,190,80,0.32)');
    light.addColorStop(0.4, 'rgba(255,140,40,0.12)');
    light.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, W, H);
    // 地面に落ちる火の円
    const floor = ctx.createRadialGradient(lx2, GROUND_Y, 4, lx2, GROUND_Y, 90);
    floor.addColorStop(0, 'rgba(255,160,40,0.18)');
    floor.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = floor;
    ctx.fillRect(lx2 - 100, GROUND_Y - 4, 200, 20);
  } else {
    // 昼でも淡いヴィネットでシネマ感
    const g = ctx.createRadialGradient(W/2, H*0.45, 120, W/2, H*0.5, 520);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(20,30,50,0.18)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // キャンプHPバー
  drawBar(wx(-30), GROUND_Y + 18, 60, 6, structures.campfire.hp / structures.campfire.maxHp, '#e85', '#333');
  ctx.textAlign = 'center';
  drawUiLabel('部室', wx(0), GROUND_Y + 36, '#e8dcc0', 13);

  ctx.restore(); // shake

  // 画面フラッシュ（シェイク外＝HUDに被せる）
  if (state.flashT > 0) {
    ctx.globalAlpha = Math.min(1, state.flashT * 4) * 0.85;
    ctx.fillStyle = state.flashColor || 'rgba(255,255,255,0.35)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // 夜明けの感動オーバーレイ
  if (state.dawnFxT > 0) {
    const p = 1 - state.dawnFxT / 3.8;
    ctx.globalAlpha = Math.min(0.4, (1 - Math.abs(p - 0.35)) * 0.5);
    const dg = ctx.createLinearGradient(0, 0, 0, H);
    dg.addColorStop(0, 'rgba(255,180,100,0.35)');
    dg.addColorStop(0.5, 'rgba(255,220,160,0.08)');
    dg.addColorStop(1, 'rgba(255,140,80,0)');
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // クリア演出オーバーレイ
  if (state.winFxT > 0) {
    const p = 1 - state.winFxT / 5.5;
    ctx.globalAlpha = Math.min(0.4, p * 0.45);
    const wg = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, 320);
    wg.addColorStop(0, 'rgba(255,215,0,0.55)');
    wg.addColorStop(1, 'rgba(255,107,157,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H);
    // スローモ感のレターボックス
    if (state.slowMoT > 0) {
      ctx.globalAlpha = Math.min(0.55, state.slowMoT * 0.35);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, 28);
      ctx.fillRect(0, H - 28, W, 28);
    }
    ctx.globalAlpha = 1;
  } else if (state.slowMoT > 0 && state.dawnFxT > 0) {
    ctx.globalAlpha = Math.min(0.4, state.slowMoT * 0.25);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, 18);
    ctx.fillRect(0, H - 18, W, 18);
    ctx.globalAlpha = 1;
  }

  if (state.dungeon) { try { drawDungeon(); } catch (_) { try { ctx.restore(); } catch (__) {} } }
  // 一時デバッグHUD（直るまで残す）
  if (state.debugHUD) {
    try {
      const lines = [
        'run=' + !!state.running + ' night=' + !!state.isNight + ' cine=' + !!state.titleCine,
        'cam=' + (state.cameraX|0) + ' px=' + (player.x|0) + ' vx=' + (player.vx|0),
        'phase=' + (typeof dayPhase === 'function' ? dayPhase().toFixed(2) : '?') + ' day=' + (state.day|0),
        'tmL=' + !!touchMove.left + ' tmR=' + !!touchMove.right,
      ];
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.font = '10px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffe066';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      for (let i = 0; i < lines.length; i++) {
        const y = 14 + i * 12;
        ctx.strokeText(lines[i], 8, y);
        ctx.fillText(lines[i], 8, y);
      }
      ctx.restore();
    } catch (_) {}
  }
}

function drawBar(x, y, w, h, ratio, fg, bg) {
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
  ctx.strokeStyle = '#000';
  ctx.strokeRect(x, y, w, h);
}


function drawParallaxHills(phase) {
  const night = (phase != null ? phase : (state.isNight ? 0.85 : 0.35)) >= 0.68;
  const dusk = phase != null && phase > 0.5 && phase < 0.72;
  const th = chapterTheme();
  const cols = night ? th.hillsNight : (dusk ? th.hillsDusk : th.hills);
  const bands = [
    { col: cols[0], par: 0.12, h: 78 },
    { col: cols[1], par: 0.24, h: 54 },
    { col: cols[2], par: 0.38, h: 36 },
    { col: cols[3], par: 0.52, h: 22 },
  ];
  for (const b of bands) {
    ctx.fillStyle = b.col;
    for (let i = -4; i < 10; i++) {
      const base = i * 220 - (state.cameraX * b.par) % 220;
      for (let px = 0; px < 240; px += 4) {
        let rise = Math.sin((px + i * 40) * 0.03) * b.h + b.h * 0.4;
        // 章ごと稜線：新宿は矩形ビル、外縁は尖塔、井の頭は緩やか
        if (th.decor === 'neon' && b.par > 0.3) {
          rise = b.h * (0.55 + ((px / 20 | 0) % 3) * 0.22 + ((i + px / 40) % 2) * 0.15);
        } else if (th.decor === 'void') {
          rise += Math.sin((px + i * 70) * 0.07) * 12;
        } else if (th.decor === 'pond') {
          rise *= 0.85;
        }
        const top = GROUND_Y - rise;
        ctx.fillRect((base + px) | 0, top | 0, 4, (GROUND_Y - top) | 0);
      }
    }
  }
  // 遠景デコール（章テーマ）
  if (th.decor === 'neon') {
    for (let i = -2; i < 10; i++) {
      const tx = ((i * 140 - state.cameraX * 0.32) % (W + 140)) - 30;
      const bh = 28 + (i % 4) * 10;
      drawPixelRect(tx, GROUND_Y - bh, 18 + (i % 3) * 4, bh, night ? '#1a1020' : '#2a2030');
      if (night || phase > 0.6) {
        const tw = 0.4 + Math.sin(state.animT * 3 + i) * 0.3;
        ctx.globalAlpha = 0.35 + tw * 0.4;
        drawPixelRect(tx + 3, GROUND_Y - bh + 6, 3, 3, th.neon);
        drawPixelRect(tx + 10, GROUND_Y - bh + 14, 3, 3, '#ffe066');
        drawPixelRect(tx + 6, GROUND_Y - bh + 22, 4, 2, '#8cf');
        ctx.globalAlpha = 1;
      }
    }
  } else if (th.decor === 'void') {
    for (let i = -1; i < 8; i++) {
      const tx = ((i * 180 - state.cameraX * 0.28) % (W + 180)) - 40;
      const spire = 40 + (i % 3) * 14;
      drawPixelRect(tx + 8, GROUND_Y - spire, 4, spire, night ? '#201818' : '#4a4038');
      drawPixelRect(tx + 2, GROUND_Y - spire - 4, 16, 3, night ? '#3a3020' : '#6a5a40');
      drawPixelRect(tx + 14, GROUND_Y - spire + 8, 8, 2, night ? '#ff9944' : '#8a6040');
    }
  } else if (th.decor === 'pond') {
    for (let i = -2; i < 12; i++) {
      const tx = ((i * 160 - state.cameraX * 0.35) % (W + 160)) - 40;
      drawPixelRect(tx + 6, GROUND_Y - 36, 4, 18, night ? '#1a1810' : '#3a3020');
      blitPixels(tx, GROUND_Y - 56, ['..VvV.','vVVVVv','.VVVV.','.vVVv.'], PAL, 3, false);
      // 水面きらめき帯
      if (!night && i % 3 === 0) {
        ctx.globalAlpha = 0.2 + Math.sin(state.animT * 2 + i) * 0.1;
        ctx.fillStyle = '#c8e8ff';
        ctx.fillRect(tx - 10, GROUND_Y - 8, 40, 2);
        ctx.globalAlpha = 1;
      }
    }
    } else {
    // alley / 下北：住宅壁・室外機・電柱。中世の森ではない
    for (let i = -2; i < 12; i++) {
      const tx = ((i * 160 - state.cameraX * 0.35) % (W + 160));
      const x = tx - 40;
      drawPixelRect(x, GROUND_Y - 36, 28, 36, night ? '#2a2824' : '#6a6860');
      drawPixelRect(x + 4, GROUND_Y - 28, 6, 6, night ? '#ffe080' : '#bcd');
      drawPixelRect(x + 14, GROUND_Y - 28, 6, 6, night ? '#1a1814' : '#8a8880');
      drawPixelRect(x + 30, GROUND_Y - 14, 12, 8, night ? '#3a403c' : '#6a7068');
      if (i % 3 === 0) {
        drawPixelRect(x + 44, GROUND_Y - 52, 3, 52, night ? '#2a2a28' : '#4a4a44');
        drawPixelRect(x + 38, GROUND_Y - 48, 16, 2, '#3a3a38');
      }
      if (i % 4 === 0) {
        drawPixelRect(x + 18, GROUND_Y - 48, 18, 10, night ? '#3a2018' : '#8a5a38');
        drawPixelRect(x + 20, GROUND_Y - 46, 14, 2, th.accent);
      }
    }
  }
  // 章フォグ帯
  if (GFX.quality !== 'low') {
    ctx.globalAlpha = night ? 0.14 : 0.08;
    ctx.fillStyle = th.fog;
    ctx.fillRect(0, GROUND_Y - 100, W, 70);
    ctx.globalAlpha = 1;
  }
}

function drawGroundTiles(phase) {
  const night = (phase != null ? phase : (state.isNight ? 0.85 : 0.35)) >= 0.68;
  const dusk = phase != null && phase > 0.52 && phase < 0.72;
  const th = chapterTheme();
  drawPixelRect(0, GROUND_Y, W, H - GROUND_Y, night ? th.groundNight : dusk ? th.groundDusk : th.ground);
  const off = ((state.cameraX | 0) % 8);
  const grass = (th.grass && th.grass.length) ? th.grass : ['#5a9a40', '#4a8a38'];
  const groundCol = th.ground || '#5c4030';
  for (let x = -off; x < W + 8; x += 8) {
    const worldX = x + (state.cameraX|0);
    const row = (worldX / 8 | 0);
    const gi = ((row % grass.length) + grass.length) % grass.length;
    const g0 = grass[gi];
    const top = night ? biasHex(g0, { r: -30, g: -20, b: -20 }, 1) : g0;
    const mid = night ? '#3a3020' : mixHex(g0, groundCol, 0.35);
    drawPixelRect(x, GROUND_Y, 8, 3, top);
    drawPixelRect(x, GROUND_Y + 3, 8, 5, mid);
    const wind = Math.sin(state.animT * 2.4 + worldX * 0.08) * 2 + (state.wind || 0) * 0.9
      + Math.sin(state.animT * 4.1 + worldX * 0.03) * 1;
    if (row % (GFX.grassDense ? 2 : 3) === 0) {
      const gh = 5 + (row % 3);
      const col = night ? '#3a5a30' : grass[((gi + 1) % grass.length)];
      drawPixelRect(x + 2 + wind, GROUND_Y - gh, 2, gh, col);
      drawPixelRect(x + 5 + wind * 0.7, GROUND_Y - gh - 2, 1, gh + 2, night ? '#2a4a28' : th.accent);
      if (GFX.grassDense && row % 4 === 0) drawPixelRect(x + 2 + wind, GROUND_Y - gh - 2, 2, 2, '#c8e080');
    }
    if (row % 11 === 0) drawPixelRect(x + 3, GROUND_Y + 1, 2, 2, night ? '#3a3028' : '#7a6a50');
    // 新宿：路面ライン／外縁：亀裂
    if (th.decor === 'neon' && row % 9 === 0) drawPixelRect(x, GROUND_Y + 1, 8, 1, night ? '#4a2840' : '#6a4860');
    if (th.decor === 'void' && row % 13 === 0) drawPixelRect(x + 1, GROUND_Y - 1, 1, 4, '#2a1840');
  }
  drawPixelRect(0, GROUND_Y + 8, W, 2, night ? '#1a140e' : '#3a2818');
  if (GFX.water) drawPond(phase);
}

function drawPond(phase) {
  // 部室東側の小さな水面（ワールド x≈90）／井の頭章は広く
  const th = chapterTheme();
  const pondScale = th.decor === 'pond' ? 1.55 : (th.decor === 'void' ? 0.7 : 1);
  const pondX = wx(th.decor === 'pond' ? 110 : 96);
  const pondY = GROUND_Y - 2;
  const night = (phase || 0) >= 0.68;
  if (GFX.quality === 'low') {
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = night ? '#1e3248' : '#468cb0';
    ctx.beginPath();
    ctx.ellipse(pondX, pondY, 34 * pondScale, 7 * pondScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#e8f8ff';
    ctx.fillRect(pondX - 10, pondY - 2, 16, 1);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(pondX, pondY, 38 * pondScale, 8 * pondScale, 0, 0, Math.PI * 2);
  ctx.clip();
  const wg = ctx.createLinearGradient(pondX, pondY - 10, pondX, pondY + 10);
  wg.addColorStop(0, night ? 'rgba(30,50,80,0.85)' : 'rgba(70,140,180,0.75)');
  wg.addColorStop(1, night ? 'rgba(20,40,60,0.9)' : 'rgba(40,100,140,0.85)');
  ctx.fillStyle = wg;
  ctx.fillRect(pondX - 40, pondY - 12, 80, 24);
  // きらめき
  ctx.globalAlpha = 0.45;
  for (let i = 0; i < (GFX.quality === 'low' ? 3 : 6); i++) {
    const sx = pondX - 28 + ((state.animT * 18 + i * 13) % 56);
    const sy = pondY - 2 + Math.sin(state.animT * 3 + i) * 2;
    ctx.fillStyle = '#e8f8ff';
    ctx.fillRect(sx, sy, 3, 1);
  }
  // たき火色の反射（夜）
  if (night || state.isNight) {
    const rg = ctx.createRadialGradient(wx(0), pondY, 4, pondX, pondY, 50);
    rg.addColorStop(0, 'rgba(255,160,60,0.22)');
    rg.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = rg;
    ctx.fillRect(pondX - 40, pondY - 10, 80, 20);
  } else {
    // 空の淡い反射帯
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#fff8d0';
    ctx.fillRect(pondX - 20, pondY - 4, 40, 2);
  }
  ctx.restore();
  // 岸
  ctx.strokeStyle = night ? '#2a3a28' : '#4a6a38';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(pondX, pondY, 38 * pondScale, 8 * pondScale, 0, 0, Math.PI * 2);
  ctx.stroke();
}

// ---------- ロケバス／聖地／攻勢 ----------
function startLocationBus(fromXOrCamp, toId, quiet, mode, carryPlayer) {
  const L = landmarkById(toId);
  if (!L || state.bus) return false;
  const fromX = (fromXOrCamp === 0 || fromXOrCamp == null) ? 0 : +fromXOrCamp;
  const cargo = [];
  for (const w of workers) {
    if (cargo.length >= 2) break;
    if (Math.abs(w.x - fromX) < 160 || Math.abs(w.x - L.x) < 160) cargo.push(w);
  }
  state.bus = {
    mode: mode || 'civil',
    x: fromX, tx: L.x,
    fromId: fromX === 0 ? 'camp' : null,
    toId: L.id, t: 0, cargo, returning: false, opId: null,
    carryPlayer: !!carryPlayer,
  };
  if (!quiet) {
    toast((carryPlayer ? 'ロケバス　' : '') + pick(LORE.busDepart) + (carryPlayer ? '　→' + L.short : ''), 2.2);
    story((carryPlayer ? '遠路ワープ　' : '') + `ロケバス　→${L.short}`, 2.0);
    spawnMeme(fromX, GROUND_Y - 55, carryPlayer ? '乗車!' : 'バス!');
  }
  return true;
}

function startRaidBus(opId) {
  const op = (state.outposts || []).find(o => o.id === opId && !o.cleared);
  if (!op || state.bus) return false;
  // 補給線／応援優先で積み込み
  const ranked = workers.slice().sort((a, b) => {
    const score = (w) => (w.job === 'supply' ? 3 : w.job === 'cheer' ? 2 : w.job === 'film' ? 1 : 0);
    return score(b) - score(a);
  });
  const cargoW = ranked.filter(w => Math.abs(w.x) < 220 || Math.abs(w.x - op.x) < 220).slice(0, 2);
  let vans = units.filter(u => u.role === 'vanguard');
  const form = state.raidForm || 'std';
  if (form === 'rush') vans = vans.slice(0, Math.max(1, vans.length)); // 全先鋒
  if (form === 'fort') vans = vans.slice(0, 1); // 守り寄り・先鋒1
  state.bus = {
    mode: 'raid',
    x: 0, tx: op.x,
    fromId: 'camp', toId: opId, t: 0,
    cargo: cargoW, vans, returning: false, opId: op.id,
    form, carryPlayer: true,
  };
  try { if (typeof audPlay === 'function') audPlay('pay'); } catch (_) {}
  toast(pick(LORE.assaultOpen) + '　' + raidFormName(form).split('（')[0]);
  story(`【軍事】侵攻バス　→${op.short}　${raidFormName(form)}`, 2.4);
  spawnMeme(0, GROUND_Y - 55, form === 'rush' ? '突撃!' : form === 'fort' ? '堅守侵攻' : '侵攻!');
  screenFlash('rgba(255,80,40,0.15)', 0.2);
  return true;
}

function damageOutpost(op, dmg) {
  if (!op || op.cleared) return;
  // 関係・軍事・攻勢編成で実ダメージ微増
  const form = raidFormMul();
  const supplyBonus = Math.min(0.12, (state.supplyStock | 0) * 0.03);
  const mul = (1 + (state.miliTier|0) * 0.05 + ((state.bond && state.bond.crew)|0) / 500 + supplyBonus) * (form.dmg || 1);
  const real = Math.max(1, Math.round(dmg * mul));
  op.hp = Math.max(0, op.hp - real);
  state._raidDmgAcc = (state._raidDmgAcc | 0) + real;
  // 補給消費（侵攻成功片鱗）
  if ((state.supplyStock | 0) > 0 && Math.random() < 0.45) {
    state.supplyStock = Math.max(0, (state.supplyStock | 0) - 1);
  }
  toast(pick(LORE.outpostHit) + ` −${real}`, 2.2);
  spawnMeme(op.x, GROUND_Y - 60, '-' + real);
  shake(3, 0.15);
  spawnRetaliation(op, real);
  if (op.hp <= 0) clearOutpost(op);
}

function clearOutpost(op) {
  op.cleared = true;
  op.hp = 0;
  toast(pick(LORE.outpostDown), 3.0);
  story(`敵拠点破壊　${op.name}　次エリア解放`, 3.0);
  spawnMeme(op.x, GROUND_Y - 70, '破壊!');
  screenFlash('rgba(255,215,0,0.25)', 0.35);
  shake(6, 0.35);
  // 戦利品（ゲーム内コイン／銀行）
  dropCoin(op.x, 2 + state.chapter);
  state.bank += 1 + state.chapter;
  spawnMeme(op.x + 20, GROUND_Y - 50, '810+');
  // 壁押し出し
  if (op.side > 0) structures.rightWall.x = Math.max(structures.rightWall.x, op.x - 20);
  else structures.leftWall.x = Math.min(structures.leftWall.x, op.x + 20);
  // 章進行：両側（またはエンドレス片方）壊したら chapter++
  const targetCh = (op.unlockChapter != null ? op.unlockChapter : (state.chapter + 1));
  const defs = OUTPOST_DEFS.filter(d => d.unlockChapter === targetCh);
  const related = (state.outposts || []).filter(o => (o.unlockChapter | 0) === targetCh);
  const need = Math.min(2, Math.max(1, defs.length || related.length));
  const got = related.filter(o => o.cleared).length;
  if (got >= need || state.chapter >= 3) {
    if (state.chapter < targetCh) {
      state.chapter = targetCh;
      if (!state.chapterIntro) state.chapterIntro = {};
      state.chapterIntro[state.chapter] = false; // 新章導入を朝に再生
      toast(`章進行　→${chapterName(state.chapter)}`, 3.2);
      story(chapterIntroLine(), 3.8);
      state.chapterIntro[state.chapter] = true;
    }
  }
  bumpBond('crew', 4);
  bumpBond('town', 3);
  checkAchievements();
  ensureOutpostsForAssault();
  saveGame(true);
}

function tickLocationBus(dt) {
  const b = state.bus;
  if (!b) {
    // 内政：自動巡回（civilTier）
    if (!state.isNight && state.civilTier >= 1 && unlockedCount() > 0) {
      state.busAutoT = (state.busAutoT || 0) - dt;
      if (state.busAutoT <= 0) {
        state.busAutoT = 18 - state.civilTier * 3;
        const u = unlockedLandmarks();
        const L = u[(Math.random() * u.length) | 0];
        if (L) startLocationBus(0, L.id, true, 'civil');
      }
    }
    return;
  }
  b.t += dt;
  const speed = b.mode === 'raid' ? 190 : 160;
  const dir = Math.sign(b.tx - b.x) || 1;
  b.x += dir * speed * dt;
  for (const w of (b.cargo || [])) w.x = b.x;
  if (b.carryPlayer) { player.x = b.x; player.vx = 0; }
  if ((dir > 0 && b.x >= b.tx) || (dir < 0 && b.x <= b.tx)) {
    b.x = b.tx;
    if (b.carryPlayer) player.x = b.tx;
    if (b.mode === 'raid') {
      const op = (state.outposts || []).find(o => o.id === b.opId);
      if (op && !op.cleared) {
        let dmg = 8 + (state.miliTier | 0) * 3 + (b.vans || []).length * 9;
        dmg += Math.min(6, units.filter(u => u.role === 'gun').length);
        dmg += Math.min(4, (b.cargo || []).length * 2);
        dmg += Math.floor(((state.bond && state.bond.crew)|0) / 25);
        if (state.day < 5) dmg = Math.max(6, dmg - 2);
        damageOutpost(op, dmg);
      }
      // 先鋒を部室側へ戻す
      for (const v of (b.vans || [])) {
        v.x = (op && op.side > 0) ? structures.rightWall.x - 28 : structures.leftWall.x + 28;
      }
      if (b.carryPlayer) {
        player.x = b.tx;
        toast('降車　拠点前', 1.8);
      }
      toast(pick(LORE.busArrive));
      state.bus = null;
      return;
    }
    const L = landmarkById(b.toId);
    toast(pick(LORE.busArrive));
    if (L) {
      spawnMeme(L.x, GROUND_Y - 50, L.short);
      const bonus = facilityLv(L.id) >= 2 ? 2 : 1;
      if (Math.random() < 0.7 + (state.civilTier | 0) * 0.05) dropCoin(L.x + rand(-10, 10), bonus);
      for (const w of (b.cargo || [])) {
        w.x = L.x + rand(-24, 24);
        w.lmId = L.id;
        w.side = L.side;
      }
    }
    if (b.carryPlayer && b.toId !== 'camp') {
      player.x = b.tx;
      toast('降車　' + ((L && L.short) || '到着') + '　近場は乗り物', 2.2);
      b.carryPlayer = false;
    }
    if (!b.returning && !state.isNight && b.toId !== 'camp') {
      b.returning = true;
      b.tx = 0;
      b.fromId = L ? L.id : null;
      b.toId = 'camp';
      b.t = 0;
      b.carryPlayer = false;
      if (L) story(`バス空車　${L.short}→部室`, 1.6);
      return;
    }
    if (b.carryPlayer) player.x = b.tx;
    state.bus = null;
  }
}

function drawMidsummerFx() {
  if (!state.heatEvent && !state.midsummer) return;
  if (!state.gfxDeep) return;

  const t = state.animT;

}

function tickMiliGadgets(dt) {
  if (!state.snares) state.snares = [];
  if (!state.mines) state.mines = [];
  const sRange = snareRange();
  const sDur = snareSlowDur();
  // スネア：近接敵を掴んで遅延
  for (const s of state.snares) {
    for (const e of enemies) {
      if (Math.abs(e.x - s.x) < sRange) {
        e._snareSlow = Math.max(e._snareSlow || 0, sDur);
        if (Math.random() < 0.015) spawnMeme(e.x, GROUND_Y - 48, '胸ぐら');
      }
    }
  }
  // くっさガス片鱗：壁付近の敵を遅延＋微ダメ（軽量）
  if (state.awakenB === 'gas' && state.isNight) {
    state._gasT = (state._gasT || 0) - dt;
    if (state._gasT <= 0) {
      state._gasT = 1.6;
      for (const side of ['left','right']) {
        const wall = side === 'left' ? structures.leftWall : structures.rightWall;
        if (wall.level <= 0) continue;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.abs(e.x - wall.x) >= 70) continue;
          e._snareSlow = Math.max(e._snareSlow || 0, 0.55);
          e.hp = (e.hp || 1) - 0.35;
          e._flash = Math.max(e._flash || 0, 0.08);
          if (e.hp <= 0) {
            bestiaryKill(e.name || '?');
            onSacredKill();
            noteKill();
            if (Math.random() < 0.4) dropCoin(e.x, 1);
            enemies.splice(j, 1);
          }
        }
        if (Math.random() < 0.35) spawnMeme(wall.x, GROUND_Y - 55, 'くっさ');
      }
    }
  }
  // 地雷：夜のみ起爆＋軽スプラッシュ
  if (!state.isNight) return;
  const mR = mineRadius();
  const mD = mineDmg();
  for (let i = state.mines.length - 1; i >= 0; i--) {
    const m = state.mines[i];
    if (!m.armed) continue;
    let triggered = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.abs(e.x - m.x) < mR) { triggered = true; break; }
    }
    if (!triggered) continue;
    m.armed = false;
    spawnMeme(m.x, GROUND_Y - 40, '810!');
    toast(miliMineName() + '　起爆', 1.2);
    spawnSparks(m.x, GROUND_Y - 20, 8, ['#ff8', '#f44', '#ffd700'], 140);
    shake(5, 0.18);
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const d = Math.abs(e.x - m.x);
      if (d > mR + 22) continue;
      const falloff = d <= mR ? 1 : 0.55;
      e.hp = (e.hp || 1) - mD * falloff;
      e._flash = 0.22;
      e.stunned = Math.max(e.stunned || 0, 0.65);
      if (e.hp <= 0) {
        spawnMeme(e.x, GROUND_Y - 40, pick(LORE.enemyDown));
        bestiaryKill(e.name || '後輩');
        onSacredKill();
        noteKill();
        if (Math.random() < 0.55) dropCoin(e.x, 1);
        checkAchievements();
        enemies.splice(j, 1);
      }
    }
    state.mines.splice(i, 1);
  }
}

function drawLocationBus() {

  drawSoftShadow(sx, GROUND_Y, 34, 0.4);

  drawPixelRect(sx - 30, GROUND_Y - 14 + bob, 4, 8, '#333');
  drawPixelRect(sx + 26, GROUND_Y - 14 + bob, 4, 8, '#333');

  for (let i = 0; i < 3; i++) {

  }
  // ドア線
  drawPixelRect(sx - 2, GROUND_Y - 24 + bob, 2, 14, '#333');

  drawPixelRect(sx + 24, GROUND_Y - 18 + bob, 4, 3, blink ? '#ffe080' : '#c9a040');
  drawPixelRect(sx - 28, GROUND_Y - 18 + bob, 4, 3, raid ? '#f44' : '#e44');

    drawPixelRect(sx + ox, GROUND_Y - 8 + bob, 10, 8, '#1a1a1a');
