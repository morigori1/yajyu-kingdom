    if (wheelSpin === 0) drawPixelRect(sx + ox + 4, GROUND_Y - 7 + bob, 2, 6, '#888');
    else if (wheelSpin === 1) drawPixelRect(sx + ox + 2, GROUND_Y - 5 + bob, 6, 2, '#888');
    else if (wheelSpin === 2) drawPixelRect(sx + ox + 4, GROUND_Y - 7 + bob, 2, 6, '#666');
    else drawPixelRect(sx + ox + 2, GROUND_Y - 5 + bob, 6, 2, '#666');
  }
  // 屋根上：ロケ＝カメラ／侵攻＝スパイク＋旗
  if (raid) {
    drawPixelRect(sx - 6, GROUND_Y - 36 + bob, 4, 8, '#444');
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.moveTo(sx - 4, GROUND_Y - 36 + bob);
    ctx.lineTo(sx + 10, GROUND_Y - 40 + bob);
    ctx.lineTo(sx - 4, GROUND_Y - 30 + bob);
    ctx.fill();
    drawPixelRect(sx + 8, GROUND_Y - 32 + bob, 3, 6, '#333');
    drawPixelRect(sx - 18, GROUND_Y - 32 + bob, 3, 4, '#333');
  } else {
    // カメラクレーン＋マイク
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx + 6, GROUND_Y - 30 + bob);
    ctx.lineTo(sx + 18, GROUND_Y - 42 + bob);
    ctx.stroke();
    drawPixelRect(sx + 14, GROUND_Y - 46 + bob, 10, 6, '#222');
    drawPixelRect(sx + 16, GROUND_Y - 44 + bob, 4, 3, '#8af');
    drawPixelRect(sx - 10, GROUND_Y - 34 + bob, 8, 4, '#666'); // 荷物
  }
  // サイドストライプ／ロゴ
  drawPixelRect(sx - 26, GROUND_Y - 16 + bob, 52, 2, raid ? '#ff6b9d' : '#ff6b9d');
  ctx.fillStyle = raid ? '#ff4422' : '#5a3a10';
  ctx.font = uiFont(12);
  ctx.textAlign = 'center';
  ctx.fillText(raid ? '侵攻バス' : 'ロケバス', sx, GROUND_Y - 34 + bob);
  let dest = '…';
  if (raid) {
    const op = (state.outposts || []).find(o => o.id === b.opId);
    dest = op ? op.short : '拠点';
  } else {
    dest = b.toId === 'camp' ? '部室' : ((landmarkById(b.toId) || {}).short || '…');
  }
  ctx.fillStyle = '#ffd700';
  ctx.fillText((b.carryPlayer ? '乗車→' : '→') + dest, sx, GROUND_Y - 42 + bob);
  // 排気煙
  if (state.gfxDeep && Math.sin(state.animT * 9) > 0) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#aaa';
    ctx.beginPath();
    ctx.arc(sx - 30, GROUND_Y - 20 + bob - Math.sin(state.animT * 5) * 4, 3, 0, Math.PI * 2);

}

  if (id === 'kichijoji' || id === 'yamanote') {

    drawPixelRect(sx + 28, GROUND_Y - 34, 8, 4, lit === 2 ? '#4f4' : '#141');
  }
  if (id === 'kabuki') {
    // ネオン帯
    const pulse = 0.4 + Math.sin(state.animT * 6) * 0.3;
    ctx.globalAlpha = pulse;
    drawPixelRect(sx - 36, GROUND_Y - 50, 20, 4, '#ff6b9d');
    drawPixelRect(sx + 16, GROUND_Y - 44, 18, 4, '#6af');
    ctx.globalAlpha = 1;
  }
  if (id === 'gaien_e' || ch >= 3) {
    // 外縁：熱気・埃

      ctx.globalAlpha = 0.12 + Math.sin(state.animT * 2 + sx) * 0.05;
      ctx.fillStyle = '#ffcc88';
      ctx.fillRect(sx - 50, GROUND_Y - 60, 100, 50);
      ctx.globalAlpha = 1;

  }
  if (id === 'azuma' || id === 'laundry') {

    drawPixelRect(sx - 44, GROUND_Y - 48, 2, 48, '#3a3a3a');

    ctx.beginPath();
    ctx.moveTo(sx - 44, GROUND_Y - 44);
    ctx.lineTo(sx - 10, GROUND_Y - 40);
    ctx.stroke();
  }
  // 夜景差：窓明かり・街灯フレア・ネオン強調
  if (nightish) {
    const flicker = 0.55 + Math.sin(state.animT * 4 + sx * 0.03) * 0.25;

      ctx.fillStyle = '#ffe8a0';
      ctx.fillRect(sx - 40, GROUND_Y - 8, 70, 3);
      ctx.globalAlpha = 1;

}

      for (let i = 0; i < 4; i++) {
        drawPixelRect(sx - 20 + i * 10, GROUND_Y + 2, 6, 3, '#eee');

    }
    if (id === 'gaien_w') {
      drawPixelRect(sx - 8, GROUND_Y - 64, 16, 6, '#8a6a20');
      ctx.fillStyle = '#ffd700';
      ctx.font = uiFont(11);
      ctx.textAlign = 'center';
      ctx.fillText('外縁', sx, GROUND_Y - 59);
    }
    if (id === 'kitazawa') {
      // ブランコ
      drawPixelRect(sx - 22, GROUND_Y - 28, 2, 20, '#666');
      drawPixelRect(sx - 12, GROUND_Y - 28, 2, 20, '#666');
      drawPixelRect(sx - 22, GROUND_Y - 10, 12, 3, '#8a5a30');
    }
  }
  if (opened) {
    const glow = ctx.createRadialGradient(sx - 20, GROUND_Y - 16, 1, sx - 20, GROUND_Y - 16, 18);
    glow.addColorStop(0, 'rgba(255,220,120,0.55)');
    glow.addColorStop(1, 'rgba(255,180,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sx - 36, GROUND_Y - 40, 30, 40);
    const fac = facilityLv(L.id);
    if (fac >= 1) {
      // 施設看板＋等級で見た目差
      drawPixelRect(sx - 14, GROUND_Y - 62, 28, 8, fac >= 3 ? '#ff6b9d' : fac >= 2 ? '#ffd700' : '#c9a227');
      ctx.fillStyle = '#1a1008';
      ctx.font = uiFont(11);
      ctx.textAlign = 'center';
      ctx.fillText('Lv' + fac, sx, GROUND_Y - 56);
      // Lv2+: 旗
      if (fac >= 2) {
        const fy = GROUND_Y - 70 - fac * 2;
        drawPixelRect(sx + 18, GROUND_Y - 50, 2, 28 + fac * 2, '#888');
        drawPixelRect(sx + 20, fy, 14, 8, fac >= 3 ? '#ff6b9d' : '#ffd700');
        ctx.fillStyle = '#1a1008';
        ctx.font = uiFont(11);
        ctx.fillText(fac >= 3 ? 'MAX' : '施設', sx + 27, fy + 6);
      }
      // Lv3: 屋根金縁＋煙
      if (fac >= 3) {
        drawPixelRect(sx - 26, GROUND_Y - 36, 52, 2, '#ffd700');
        const smokeY = GROUND_Y - 48 - ((state.animT * 18) % 20);
        ctx.globalAlpha = 0.4;
        drawPixelRect(sx + 8, smokeY, 4, 4, '#ccc');
        drawPixelRect(sx + 12, smokeY - 6, 3, 3, '#aaa');
        ctx.globalAlpha = 1;
      }
      // 作業員がいる施設は足元に作業マーク
      if ((state.workers || []).some(w => w.lmId === L.id)) {
        ctx.fillStyle = '#8cf';
        ctx.font = uiFont(11);
        ctx.fillText('作業中', sx, GROUND_Y + 12);
      }
    }
    if (state.mission && state.mission.lmId === L.id && state.gfxDeep) {
      const pulse = 0.35 + Math.sin(state.animT * 8) * 0.15;
      const g2 = ctx.createRadialGradient(sx, GROUND_Y - 30, 2, sx, GROUND_Y - 30, 55);
      g2.addColorStop(0, `rgba(255,255,200,${pulse})`);
      g2.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = g2;
      ctx.fillRect(sx - 55, GROUND_Y - 70, 110, 70);
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx + 24, GROUND_Y - 10);
      ctx.lineTo(sx + 40, GROUND_Y - 48);
      ctx.stroke();
      drawPixelRect(sx + 36, GROUND_Y - 54, 12, 8, '#222');
      drawPixelRect(sx + 38, GROUND_Y - 52, 4, 3, '#8af');
    }
  }
}

function drawLandmarkMap(phase, nightish) {
  const maxCh = (state.assault ? state.chapter + 1 : state.chapter);
  for (const L of LANDMARKS) {
    if (L.chapter > maxCh + 0) continue; // 遠すぎる章は描かない
    const opened = !!state.landmarks[L.id];
    const sx = wx(L.x);
    if (sx < -90 || sx > W + 90) continue;
    const known = L.chapter <= maxCh;
    ctx.globalAlpha = opened ? 1 : (known ? 0.42 : 0.2);
    ctx.fillStyle = nightish ? '#2a2a30' : '#5a5a58';
    ctx.fillRect(sx - 28, GROUND_Y + 1, 56, 4);
    drawLandmarkBuilding(sx, L, opened, nightish);
    ctx.globalAlpha = opened ? 0.95 : 0.4 + Math.sin(state.animT * 2 + L.x * 0.01) * 0.06;
    ctx.fillStyle = opened ? '#ffd700' : '#c9a227';
    ctx.font = uiFont(12);
    ctx.textAlign = 'center';
    const fac = opened ? facilityLv(L.id) : 0;
    // fac used below for badge
    ctx.fillText(opened ? L.short : (known ? L.short + '…？' : '???'), sx, GROUND_Y - 54);
    if (opened) {
      ctx.fillStyle = '#ff6b9d';
      ctx.fillText(fac >= 1 ? `聖地施設${fac}` : '聖地', sx, GROUND_Y - 44);
    }
    ctx.globalAlpha = 1;
  }
  // 章隠しマーカー
  ensureCollectState();
  for (const sec of CHAPTER_SECRETS) {
    if ((state.chapter | 0) < sec.ch && !(state.assault && (state.chapter|0) + 1 >= sec.ch)) continue;
    if (state.secrets[sec.id]) continue;
    const sx = wx(sec.x);
    if (sx < -40 || sx > W + 40) continue;
    const pulse = 0.45 + Math.sin(state.animT * 5 + sec.x * 0.02) * 0.25;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffd700';
    ctx.font = uiFont(16);
    ctx.textAlign = 'center';
    ctx.fillText('★', sx, GROUND_Y - 36 + Math.sin(state.animT * 3) * 2);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#c9a227';
    ctx.font = uiFont(11);
    ctx.fillText('隠し', sx, GROUND_Y - 22);
    ctx.globalAlpha = 1;
  }
  drawOutposts(nightish);
  if (unlockedCount() > 0 || state.assault) {
    const sx = wx(0);
    // 部室バス停（屋根＋ベンチ＋時刻表）
    drawSoftShadow(sx + 42, GROUND_Y, 22, 0.3);
    drawPixelRect(sx + 28, GROUND_Y - 40, 3, 40, '#666');
    drawPixelRect(sx + 28, GROUND_Y - 44, 36, 5, state.assault ? '#8a2a1a' : '#2a6aaa');
    drawPixelRect(sx + 30, GROUND_Y - 42, 32, 2, '#ffd700');
    drawPixelRect(sx + 32, GROUND_Y - 14, 20, 3, '#6a4a28'); // ベンチ
    drawPixelRect(sx + 34, GROUND_Y - 18, 2, 4, '#6a4a28');
    drawPixelRect(sx + 48, GROUND_Y - 18, 2, 4, '#6a4a28');
    drawPixelRect(sx + 56, GROUND_Y - 34, 12, 16, '#1a1a1a'); // 時刻表
    ctx.fillStyle = state.assault ? '#f84' : '#8cf';
    ctx.font = uiFont(11);
    ctx.textAlign = 'center';
    ctx.fillText(state.assault ? 'RAID' : 'BUS', sx + 46, GROUND_Y - 48);
    if (state.bus) {
      const pulse = 0.4 + Math.sin(state.animT * 8) * 0.3;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ffd700';
      ctx.fillText('発車中', sx + 46, GROUND_Y - 56);
      ctx.globalAlpha = 1;
    }
  }
}

  const wind = (state.wind || 0) * 0.3;
  // 体
  blitOutlined(x - 10 + wind, y - 30 + bob, [
    '..oo..',
    '.oooo.',
    'oossoo',
    '.ssss.',
    '.s..s.',
    'nn..nn',
  ], Object.assign({}, PAL, { o: '#f0c8a0', s: '#4a6aaa', n: '#2a2a30' }), 2, false);

  // 袋／ツール
  drawPixelRect(x + 8 + wind, y - 18 + bob, 6, 8, '#8b5a2b');

  {
    const ey = y - 28 + bob;

  ctx.strokeStyle = '#c4a070';

function drawWall(wall, isLeft) {
  ctx.imageSmoothingEnabled = false;
  const x = wx(wall.x);
  if (wall._flash > 0) {
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#ff6644';
    ctx.fillRect(x - 18, GROUND_Y - 50, 36, 50);
    ctx.restore();
    wall._flash -= 0.04;
  }
  if (wall.level <= 0) {
    const bob = Math.sin(state.animT * 2 + wall.x * 0.01) * 1;
    // 机・コンテナ・波板の仮囲い
    drawPixelRect(x - 16, GROUND_Y - 14 + bob, 14, 10, '#6a5840');
    drawPixelRect(x + 2, GROUND_Y - 12 + bob, 12, 8, '#8a6a28');
    drawPixelRect(x - 10, GROUND_Y - 22 + bob, 20, 8, '#7a7a70');
    drawPixelRect(x - 8, GROUND_Y - 20 + bob, 16, 2, '#5a5a54');
    drawPixelRect(x + 10, GROUND_Y - 10 + bob, 5, 8, '#ff8844');
    ctx.textAlign = 'center';
    drawUiLabel(miliWallName(), x, GROUND_Y - 30, 'rgba(255,215,0,0.85)', 13);
    return;
  }
  const wood = wall.level === 1;
  const h = wood ? 56 : 82;
  const sway = (state.wind || 0) * 0.55 + (state.isNight ? state.nightSway * 0.2 : 0);

  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y + 3, wood ? 18 : 22, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  if ((wall.level|0) >= 2 || (state.miliTier|0) >= 2) {
    const ag = ctx.createRadialGradient(x, GROUND_Y - 30, 4, x, GROUND_Y - 30, 40);
    ag.addColorStop(0, 'rgba(255,107,157,0.18)');
    ag.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ag;
    ctx.fillRect(x - 40, GROUND_Y - 70, 80, 70);
  }

  if (wood) {
    // 合板＋波板＋土嚢。ログ城壁ではない
    for (let row = 0; row < Math.ceil(h / 8); row++) {
      const oy = GROUND_Y - (row + 1) * 8;
      const shade = row % 2 === 0 ? '#8a7a58' : '#6a5a40';
      drawPixelRect(x - 15 + sway, oy, 30, 7, shade);
      drawPixelRect(x - 15 + sway, oy, 30, 1, '#3a3020');
      if (row % 2 === 0) drawPixelRect(x - 12 + sway, oy + 2, 8, 3, '#c4a070');
    }
    for (const by of [GROUND_Y - 16, GROUND_Y - 36]) {
      drawPixelRect(x - 16 + sway, by, 32, 5, '#7a7a70');
      drawPixelRect(x - 16 + sway, by + 1, 32, 1, '#4a4a44');
    }
    drawPixelRect(x - 18 + sway, GROUND_Y - 10, 10, 8, '#8a7848');
    drawPixelRect(x + 8 + sway, GROUND_Y - 10, 10, 8, '#8a7848');
    // 屋上スピーカー
    drawPixelRect(x - 6 + sway, GROUND_Y - h - 10, 12, 8, '#3a3a38');
    drawPixelRect(x - 4 + sway, GROUND_Y - h - 8, 8, 4, '#2a2a28');
  } else {
    // コンクリートブロック＋錆び鋼。狭間の石城ではない
    const brickW = 6, brickH = 5;
    const rows = Math.ceil(h / brickH);
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < 6; col++) {
        const ox = x - 16 + col * brickW + (row % 2) * 2;
        const oy = GROUND_Y - (row + 1) * brickH;
        const n = (row * 6 + col) % 4;
        const shade = n === 0 ? '#6a6860' : n === 1 ? '#5a5850' : n === 2 ? '#7a7868' : '#4a4840';
        drawPixelRect(ox + sway, oy, brickW - 1, brickH - 1, shade);
        drawPixelRect(ox + sway, oy + brickH - 1, brickW, 1, '#2a2820');
        if ((row + col) % 5 === 0) drawPixelRect(ox + sway + 1, oy + 1, 2, 1, '#8a6040');
        if (row < 2 && (col + row) % 3 === 0) drawPixelRect(ox + sway, oy + 3, 3, 1, '#3a6a38');
      }
    }
    drawPixelRect(x - 17 + sway, GROUND_Y - h, 1, h, '#1a1814');
    drawPixelRect(x + 16 + sway, GROUND_Y - h, 1, h, '#1a1814');
    // 屋上室外機＋鉄筋
    drawPixelRect(x - 10 + sway, GROUND_Y - h - 10, 14, 8, '#5a6058');
    drawPixelRect(x - 8 + sway, GROUND_Y - h - 8, 10, 3, '#2a2e2c');
    drawPixelRect(x + 8 + sway, GROUND_Y - h - 14, 2, 14, '#4a4030');
    drawPixelRect(x - 16 + sway, GROUND_Y - h, 32, 2, '#c4a070');
  }

  // 旗（風連動 + IKZO影）
  const flagWave = Math.sin(state.animT * 7 + (isLeft ? 0 : 2)) * (wood ? 3.2 : 2.4) + (state.wind || 0) * 1.8;
  const poleH = h + 28;
  drawPixelRect(x + (isLeft ? -2 : 0), GROUND_Y - poleH, 3, poleH - h + 18, '#222');
  const fx = x + (isLeft ? -22 : 4) + flagWave;
  // 旗の影
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.fillRect(fx + 2 + (state.wind || 0) * 0.6, GROUND_Y - poleH + 4, 18, 12);
  ctx.globalAlpha = 1;
  blitOutlined(fx, GROUND_Y - poleH, [
    'RRRRRRRR',
    'RrRRRRrR',
    'RRR1RRRR',
    'RrRRRRrR',
    'RRRRRRRR',
  ], PAL, 2, false);
  ctx.font = uiFont(12);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillText('IKZO', fx + 5 + (state.wind || 0) * 0.3, GROUND_Y - poleH + 13);
  ctx.fillStyle = '#fff';
  ctx.fillText('IKZO', fx + 4, GROUND_Y - poleH + 12);
  ctx.textAlign = 'center';
  drawUiLabel(miliWallName(wall.level), x, GROUND_Y - h - 16, wood ? '#c9a227' : '#d0d0e8', 12);
  drawBar(x - 20, GROUND_Y + 10, 40, 5, wall.hp / wall.maxHp, wood ? '#8c4' : '#4cf', '#333');
}

function drawCoin(x, y) {

function drawYajyu(x, y, facing) {
  ctx.imageSmoothingEnabled = false;
  const walking = Math.abs(player.vx) > 10 || state.titleCine;
  const walkFrames = (FR_WALK && FR_WALK.length) ? FR_WALK : null;
  const idleFrames = (FR_IDLE && FR_IDLE.length) ? FR_IDLE : walkFrames;
  const fi = walking && !state.titleCine && walkFrames ? frameIndex(11, walkFrames.length) : frameIndex(2, (idleFrames || [[]]).length);
  const bob = (walking && !state.titleCine) ? (fi % 2) : Math.sin(state.animT * 2.2) * 0.7;
  const squash = (walking && !state.titleCine && fi % 2 === 0) ? 1 : 0;
  const flip = facing < 0;
  const body = (walking && !state.titleCine && walkFrames) ? walkFrames[fi] : (idleFrames ? idleFrames[fi % idleFrames.length] : null);
  const mount = (typeof equippedMount === 'function') ? equippedMount() : null;
  const rideLift = mount ? 8 : 0;
  // 乗り物（顔の下）
  if (mount) {
    const mx = x, my = y - 2 + bob;
    if (mount.id === 'chari') {
      drawPixelRect(mx - 16, my - 8, 7, 7, '#222');
      drawPixelRect(mx + 8, my - 8, 7, 7, '#222');
      drawPixelRect(mx - 12, my - 14, 24, 5, '#6a4030');
      drawPixelRect(mx + (flip ? -14 : 8), my - 22, 3, 10, '#444');
    } else if (mount.id === 'scooter') {
      drawPixelRect(mx - 14, my - 8, 28, 6, '#334');
      drawPixelRect(mx - 12, my - 14, 18, 6, '#556');
      drawPixelRect(mx + (flip ? -12 : 8), my - 26, 3, 14, '#99a');
      drawPixelRect(mx + (flip ? -16 : 6), my - 28, 8, 3, '#ff6b9d');
    } else {
      drawPixelRect(mx - 20, my - 16, 36, 12, '#6a4828');
      drawPixelRect(mx + (flip ? -22 : 12), my - 24, 10, 10, '#5a3820');
      drawPixelRect(mx + (flip ? 12 : -20), my - 10, 8, 4, '#4a2818');
      drawPixelRect(mx - 6, my - 20, 10, 4, '#ffd700');
    }
  }
  {
    const by = y - 32 + bob + squash - rideLift;
    ctx.fillStyle = '#1a0a00';
    ctx.fillRect(x - 11, by + 2, 22, 28);
    ctx.fillStyle = '#c87838';
    ctx.fillRect(x - 9, by, 18, 26);
    ctx.fillStyle = '#3a1020';
    ctx.fillRect(x + (flip ? 6 : -12), by + 4, 6, 18);
  }
  if (walking && !state.titleCine && GFX.quality !== 'low' && fi % 2 === 1) {
    ctx.globalAlpha = 0.35;
    drawPixelRect(x + (flip ? 6 : -10), y - 2, 3, 2, '#c8a878');
    ctx.globalAlpha = 1;
  }
  if (body && !mount) {
    try { blitOutlined(x - 16, y - 40 + bob + squash, body, PAL, 2, flip); } catch (_) {}
  }
  // 顔は頭。首で胴体とつなぐ。メダル枠は付けない
  const faceY = y - 44 + bob - rideLift;
  const faceSz = 34;
  drawPixelRect(x - 5, faceY + 10, 10, 8, '#c87838');
  drawPixelRect(x - 10, faceY + 16, 20, 5, '#5a2a18');
  const gotFace = drawSenpaiFace(x, faceY, faceSz, flip);
  if (!gotFace) {
    ctx.fillStyle = '#ffe0b0';
    ctx.fillRect(x - 10, faceY - 10, 20, 22);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 6, faceY - 2, 4, 4);
    ctx.fillRect(x + 3, faceY - 2, 4, 4);
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 5, faceY - 1, 2, 2);
    ctx.fillRect(x + 4, faceY - 1, 2, 2);
  }
  const cy = faceY - 18;
  blitOutlined(x - 14, cy, [
    '.G.G.G.G.G.',
    'GgGgGgGgGgG',
    'GGGGUUGGGGG',
    '.GGGGGGGGG.',
    '..G.....G..',
  ], PAL, 2, false);
  if (Math.sin(state.animT * 8) > 0.15) {
    drawPixelRect(x - 1, cy + 6, 3, 3, '#fff');
    drawPixelRect(x - 8, cy + 3, 2, 2, '#ff6b9d');
    drawPixelRect(x + 7, cy + 3, 2, 2, '#8af');
  }
  if (state.humidity >= 70 || state.titleCine) {
    drawPixelRect(x + (flip ? -14 : 12), faceY + 6, 2, 3, '#8cf');
  }
  const M = state.mounts;
  if (mount && M) {
    ctx.fillStyle = M.stam < 18 ? '#f84' : '#8cf';
    ctx.font = uiFont(12);
    ctx.textAlign = 'center';
    ctx.fillText(mount.short + ' ' + Math.round(M.stam), x, y + 14);
  }
}

function drawArcher(x, y, u) {
  ctx.imageSmoothingEnabled = false;
  if (u.role === 'vanguard') {
    const bob = Math.sin(state.animT * 4 + (u.x || 0) * 0.05) * 1.2;
    const march = Math.sin(state.animT * 6 + (u.x || 0)) * 1.5;
    // 部室トリオ：3体シルエット
    for (let k = -1; k <= 1; k++) {
      const ox = k * 7 + march * (k === 0 ? 0 : 0.3);
      const oy = bob + Math.abs(k) * 1;
      drawPixelRect(x - 4 + ox, y - 26 + oy, 8, 22, k === 0 ? '#5a2a18' : '#3a1a10');
      drawPixelRect(x - 5 + ox, y - 30 + oy, 10, 4, '#c9a227');
    }
    drawPixelRect(x + 8, y - 28 + bob, 4, 18, '#888');
    // 旗揺れ
    const fw = Math.sin(state.animT * 5 + x) * 3;
    drawPixelRect(x + 10 + fw, y - 44 + bob, 10, 8, '#ff6b9d');
    drawPixelRect(x + 10 + fw, y - 42 + bob, 8, 2, '#ffd700');
    ctx.fillStyle = '#ff6b9d';
    ctx.font = uiFont(11);
    ctx.textAlign = 'center';
    ctx.fillText('トリオ', x, y - 48 + bob);
    if (SPR.kohai) ctx.drawImage(SPR.kohai, x - 12, y - 52 + bob, 24, 24);
    return;
  }
  const shooting = (u._shotFlash || 0) > 0;
  const fi = shooting ? 3 : frameIndex(5, FR_ARCH.length);
  const bob = Math.sin(state.animT * 3 + (u.x || 0) * 0.05) * 0.7 + state.nightSway * 0.2;
  // 台座（塔感）＋装備スキンアクセント
  const skinA = towerSkinAccent();
  // 屋上スピーカー台座（木の砲台ではない）
  drawPixelRect(x - 12, y - 10, 24, 10, '#4a4a44');
  drawPixelRect(x - 10, y - 16, 20, 6, '#2a2a28');
  drawPixelRect(x - 8, y - 14, 6, 4, skinA);
  drawPixelRect(x + 2, y - 14, 6, 4, skinA);
  drawPixelRect(x - 12, y - 4, 24, 4, '#3a3830');
  if (state.towerSkin && state.towerSkin !== 'default') {
    drawPixelRect(x - 14, y - 8, 28, 2, skinA);
    ctx.globalAlpha = 0.22;
    const sg = ctx.createRadialGradient(x, y - 20 + bob, 2, x, y - 20 + bob, 26);
    sg.addColorStop(0, skinA);
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(x - 28, y - 52 + bob, 56, 48);
    ctx.globalAlpha = 1;
  }
  blitOutlined(x - 16, y - 36 + bob, FR_ARCH[fi], PAL, 2, u.side === 'left');
  if (SPR.kohai) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(SPR.kohai, x - 14, y - 52 + bob, 28, 28);
  }
  if ((u.tier | 0) > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = uiFont(11);
    ctx.textAlign = 'center';
    ctx.fillText('T' + (u.tier | 0), x, y - 56 + bob);
  }
  // 後輩表情
  {
    const ey = y - 40 + bob;
    drawPixelRect(x - 4, ey, 2, 2, '#fff');
    drawPixelRect(x + 2, ey, 2, 2, '#fff');
    if (shooting) {
      drawPixelRect(x - 3, ey, 2, 2, '#222');
      drawPixelRect(x + 2, ey, 2, 2, '#222');
      drawPixelRect(x - 2, ey + 6, 4, 1, '#422');
    } else {
      drawPixelRect(x - 3, ey + 1, 2, 1, '#222');
      drawPixelRect(x + 2, ey + 1, 2, 1, '#222');
      if ((state.bond && (state.bond.kohai|0) >= 20) || Math.sin(state.animT * 2 + x) > 0.8) {
        drawPixelRect(x - 2, ey + 6, 4, 2, '#c66');
      }
    }
  }
  ctx.strokeStyle = '#c8a060';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const bowX = u.side === 'left' ? x - 12 : x + 12;
  ctx.arc(bowX, y - 22 + bob, 9, -1.1, 1.1);
  ctx.stroke();
  if (shooting) {
    drawPixelRect(bowX - 3, y - 24 + bob, 8, 2, '#fff8e0');
    blitPixels(bowX - 2, y - 28 + bob, ['Y','F'], PAL, 2, false);
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = state.awakenA ? '#6af' : '#ffd700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bowX, y - 22 + bob, 12 + Math.sin(state.animT * 20) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 覚醒塔の見た目差（片鱗）
  if (state.awakenA) {
    const pulse = 0.25 + Math.sin(state.animT * 8 + x) * 0.12;
    const ag = ctx.createRadialGradient(x, y - 28 + bob, 2, x, y - 28 + bob, 28);
    ag.addColorStop(0, `rgba(80,160,255,${pulse})`);
    ag.addColorStop(1, 'rgba(40,80,200,0)');
    ctx.fillStyle = ag;
    ctx.fillRect(x - 30, y - 60 + bob, 60, 50);
    drawPixelRect(x - 8, y - 34 + bob, 16, 2, '#6af');
    drawPixelRect(x - 6, y - 18 + bob, 12, 2, '#8cf');
  }
  if (state.awakenB === 'iced') {
    drawPixelRect(x + (u.side === 'left' ? -14 : 8), y - 30 + bob, 6, 10, '#8cf');
    drawPixelRect(x + (u.side === 'left' ? -12 : 10), y - 32 + bob, 2, 2, '#dff');
  } else if (state.awakenB === 'gas') {
    ctx.globalAlpha = 0.35;
    drawPixelRect(x - 4, y - 8 + bob, 3, 3, '#8c6');
    drawPixelRect(x + 2, y - 12 + bob, 2, 2, '#6a4');
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = state.awakenA ? '#6af' : (state.awakenB === 'iced' ? '#8cf' : '#8af');
  ctx.font = uiFont(11);
  ctx.textAlign = 'center';
  let tag = miliGunNameShort(u.tier|0);
  if (state.awakenA) tag = '青' + tag;
  else if (state.awakenB === 'iced') tag = '氷' + tag;
  ctx.fillText(tag, x, y - 62 + bob);
}

function drawEnemy(x, y, e) {
  ctx.imageSmoothingEnabled = false;
  const emerge = Math.max(0, e.emergeT || 0);
  const emergeP = e.emergeMax ? emerge / e.emergeMax : 0;
  if (emergeP > 0) {
    y = y + emergeP * 26;
    ctx.globalAlpha = 1 - emergeP * 0.55;
  }
  const fi = frameIndex(e.isKoko ? 10 : 6, 4);
  const stunBob = e.stunned > 0 ? Math.sin(state.animT * 22) * 2 : 0;
  let frames = FR_ENEMY;
  if (e.isGaze) frames = FR_GAZE;
  else if (e.isTaka) frames = FR_TAKA;
  else if (e.isTono) frames = FR_TONO;
  else if (e.isNgimo) frames = FR_NGIMO;
  else if (e.isKoko) frames = FR_KOKO;
  else if (e.isMur) frames = FR_MUR;
  if (e._flash > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; }
  blitOutlined(x - 16, y - 36 + stunBob, frames[fi % frames.length], PAL, 2, e.side > 0);
  if (e._flash > 0) {
    ctx.globalAlpha = Math.min(0.7, e._flash * 5);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 14, y - 36 + stunBob, 28, 32);
    ctx.restore();
  }
  // 遠野笑顔は顔スプライト
  if (e.isTono && SPR.tono) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(SPR.tono, x - 14, y - 52 + stunBob, 28, 28);
  }
  if (e.isGaze || e.isMur || (e.isBoss && state.bossCineT > 0)) {
    ctx.globalAlpha = 0.28 + Math.sin(state.animT * 8) * 0.12;
    ctx.fillStyle = e.isMur ? '#33ffee' : '#f44';
    ctx.fillRect(x - 48, y - 30, 96, 2);
    ctx.globalAlpha = 1;
  }
  if (e.isBoss) {
    // 王冠風シルエット
    drawPixelRect(x - 8, y - 52, 16, 3, '#ffd700');
    drawPixelRect(x - 6, y - 56, 3, 4, '#ffd700');
    drawPixelRect(x - 1, y - 58, 3, 6, '#fff8c8');
    drawPixelRect(x + 4, y - 56, 3, 4, '#ffd700');
    if (state.bossCineT > 0) {
      ctx.globalAlpha = 0.4 + Math.sin(state.animT * 12) * 0.2;
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(x - 10, y - 42, 4, 3);
      ctx.fillRect(x + 6, y - 42, 4, 3);
      ctx.globalAlpha = 1;
    }
  }
  if (e.isKoko) {
    ctx.fillStyle = '#44ddff';
    ctx.font = uiFont(14);
    ctx.textAlign = 'center';
    ctx.fillText('↑', x - 10, y - 50 + Math.sin(state.animT * 12) * 3);
    ctx.fillStyle = '#ff44aa';
    ctx.fillText('↓', x + 10, y - 44 + Math.cos(state.animT * 12) * 3);
  }
  if (e.stunned > 0) {
    ctx.fillStyle = '#ff6b9d';
    ctx.font = uiFont(13);
    ctx.textAlign = 'center';
    ctx.fillText('（）', x, y - 54);
  }
  // 敵表情
  {
    const ey = y - 28 + stunBob;
    const flip = e.side > 0;
    const lx = x + (flip ? -6 : -4);
    const rx = x + (flip ? 2 : 4);
    drawPixelRect(lx, ey, 3, 3, '#fff');
    drawPixelRect(rx, ey, 3, 3, '#fff');
    if (e.stunned > 0) {
      drawPixelRect(lx, ey + 1, 3, 1, '#222');
      drawPixelRect(rx, ey + 1, 3, 1, '#222');
      drawPixelRect(x - 2, ey + 8, 5, 2, '#844');
    } else if (e.isGaze || e.isMur) {
      drawPixelRect(lx + 1, ey, 2, 3, '#f22');
      drawPixelRect(rx + 1, ey, 2, 3, '#f22');
    } else if (e.isTono) {
      drawPixelRect(lx + 1, ey + 1, 2, 1, '#222');
      drawPixelRect(rx + 1, ey + 1, 2, 1, '#222');
      drawPixelRect(x - 3, ey + 7, 6, 2, '#c66');
    } else if (e.isTaka) {
      drawPixelRect(lx + 1, ey + 1, 2, 2, '#222');
      drawPixelRect(rx + 1, ey + 1, 2, 2, '#222');
      drawPixelRect(x - 2, ey + 7, 4, 2, '#422'); // ニヤ
    } else if (e.isKoko) {
      drawPixelRect(lx + 1, ey, 2, 2, '#222');
      drawPixelRect(rx + 1, ey + 1, 2, 2, '#222'); // 非対称
    } else if (e.isBoss) {
      drawPixelRect(lx, ey, 3, 3, '#f44');
      drawPixelRect(rx, ey, 3, 3, '#f44');
    } else if ((e.hp || 1) <= 1) {
      drawPixelRect(lx + 1, ey + 1, 2, 1, '#222');
      drawPixelRect(rx + 1, ey + 1, 2, 1, '#222');
      drawPixelRect(x - 2, ey + 8, 4, 1, '#844');
    } else {
      drawPixelRect(lx + 1, ey + 1, 2, 2, '#222');
      drawPixelRect(rx + 1, ey + 1, 2, 2, '#222');
    }
  }
  ctx.fillStyle = e.isTaka ? '#ff8' : e.isMur ? '#33ffee' : e.isTono ? '#ffe066' : '#f88';
  ctx.font = uiFont(12);
  ctx.textAlign = 'center';
  ctx.fillText(e.name, x, y - 48 + stunBob);
  drawBar(x - 14, y + 4, 28, 3, e.hp / e.maxHp, '#f44', '#333');
  if (emergeP > 0) ctx.globalAlpha = 1;
}
try {
  window.__YK = {
    get state() { return state; }, player, ADV, SAVE_KEY, MOUNTS, NEST_DEFS, structures,
    inspectAdvCue, inspectAdvGraffiti, inspectAdvBox, enterAdvDungeon,
    advDungeonInteract, exitDungeon, resetGame, applySave, buildSaveBlob,
    saveGame, shopSpots, nearestSpot, nearbySpots, ensureAdvState, scoutForage, playerSpeedMul,
    openBranchPanel, closeBranchPanel, ensureMountState, equippedMount, activeNestForSide,
    beginDuskRaid, queueNightWave, emergeEnemy, startLocationBus, startRaidBus, tryPay,
  };
} catch (_) {}
</script>
